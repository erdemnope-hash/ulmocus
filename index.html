td>\n<td>Yükselir. Enerji ve gıda gibi dalgalı kalemler çıkarıldığı için kalıcı eğilimi daha iyi gösterir.</td>\n<td>Düşer.</td>\n<td>Çekirdek TÜFE (B ve C endeksleri)</td>\n</tr>\n<tr>\n<td>PA-3</td>\n<td>Üretici fiyatları</td>\n<td>Genellikle tüketici fiyatlarından önce yükselir.</td>\n<td>Düşer.</td>\n<td>ÜFE (TÜİK)</td>\n</tr>\n<tr>\n<td>PA-4</td>\n<td>Varlık fiyatları</td>\n<td>Konut, hisse senedi, altın ve arsa fiyatları çoğu zaman tüketici fiyatlarından önce ve daha hızlı yükselir.</td>\n<td>Düşer, balonlar söner.</td>\n<td>Konut fiyat endeksi (TCMB), BIST endeksi</td>\n</tr>\n<tr>\n<td>PA-5</td>\n<td>Enflasyon beklentileri</td>\n<td>Yükselir. Beklenti yükselince insanlar ve firmalar fiyatları ve ücretleri önceden artırır, enflasyon kendini besler.</td>\n<td>Düşer.</td>\n<td>TCMB Piyasa Katılımcıları Anketi, hanehalkı beklenti anketi</td>\n</tr>\n<tr>\n<td>PA-6</td>\n<td>Göreli fiyatlar</td>\n<td>Yeni para ekonomiye eşit dağılmaz. Bazı fiyatlar diğerlerinden önce yükselir ve fiyatların verdiği sinyaller bozulur.</td>\n<td>Bozulma azalır.</td>\n<td>Doğrudan ölçülmez</td>\n</tr>\n</tbody></table>\n<h3>2. Büyüme ve üretim</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Etki</th>\n<th>Para arzı genişlerse</th>\n<th>Para arzı daralırsa</th>\n<th>Ölçülebilir gösterge</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>PA-7</td>\n<td>Reel büyüme</td>\n<td>Kısa vadede hızlanır, uzun vadede eski seyrine döner.</td>\n<td>Kısa vadede yavaşlar, aşırı daralmada durgunluk (resesyon) olur.</td>\n<td>Reel GSYH (TÜİK)</td>\n</tr>\n<tr>\n<td>PA-8</td>\n<td>Potansiyel büyüme</td>\n<td>Etkilemez. Ekonominin uzun vadeli büyüme kapasitesi nüfus, sermaye ve verimlilikle belirlenir, parayla belirlenmez.</td>\n<td>Etkilemez. Ama uzun süren durgunluk kapasiteyi kalıcı olarak düşürebilir.</td>\n<td>Tahmin edilir, doğrudan ölçülmez</td>\n</tr>\n<tr>\n<td>PA-9</td>\n<td>Tüketim</td>\n<td>Kısa vadede artar.</td>\n<td>Azalır.</td>\n<td>Hanehalkı tüketim harcamaları</td>\n</tr>\n<tr>\n<td>PA-10</td>\n<td>Yatırım</td>\n<td>Ucuz kredi yüzünden artar. Ama bu yatırımların bir kısmı, faiz yapay olarak düşük olduğu için kârlı görünen yanlış yatırımlardır.</td>\n<td>Azalır. Yanlış yatırımlar tasfiye olur.</td>\n<td>Sabit sermaye yatırımları</td>\n</tr>\n<tr>\n<td>PA-11</td>\n<td>Kapasite kullanımı</td>\n<td>Artar.</td>\n<td>Düşer.</td>\n<td>Kapasite kullanım oranı (TCMB)</td>\n</tr>\n</tbody></table>\n<blockquote class=\"callout info\"><p class=\"ct\">Yanlış yatırım</p><p>Avusturya iktisat okulunun konjonktür teorisine göre bankaların yarattığı kredi faizi yapay olarak düşürür. Bu, uzun vadeli ve aslında kârsız projelere yatırım yapılmasına yol açar. Para genişlemesi durunca bu yatırımlar çöker. Ekonomik krizlerin kaynağı budur. Kısmi rezervi sınırlama fikri bu teoriyle doğrudan bağlantılıdır.</p>\n</blockquote>\n<h3>3. İstihdam ve ücretler</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Etki</th>\n<th>Para arzı genişlerse</th>\n<th>Para arzı daralırsa</th>\n<th>Ölçülebilir gösterge</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>PA-12</td>\n<td>İşsizlik</td>\n<td>Kısa vadede düşer, uzun vadede eski seviyesine döner.</td>\n<td>Kısa vadede artar.</td>\n<td>İşsizlik oranı (TÜİK)</td>\n</tr>\n<tr>\n<td>PA-13</td>\n<td>Nominal ücretler</td>\n<td>Artar.</td>\n<td>Artışı yavaşlar. Ücretler aşağı yönde katıdır, kolay düşmez.</td>\n<td>Ücret endeksleri</td>\n</tr>\n<tr>\n<td>PA-14</td>\n<td>Reel ücretler</td>\n<td>Fiyatlar ücretlerden hızlı arttığı için genellikle düşer.</td>\n<td>Fiyatlar düşerken ücretler aynı kaldığı için kısa vadede artabilir, ama işsizlik de artar.</td>\n<td>Reel ücret endeksi</td>\n</tr>\n</tbody></table>\n<h3>4. Faiz ve kredi</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Etki</th>\n<th>Para arzı genişlerse</th>\n<th>Para arzı daralırsa</th>\n<th>Ölçülebilir gösterge</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>PA-15</td>\n<td>Kısa vadeli faiz</td>\n<td>Kısa vadede düşer (likidite etkisi).</td>\n<td>Yükselir.</td>\n<td>Gecelik faiz, politika faizi</td>\n</tr>\n<tr>\n<td>PA-16</td>\n<td>Uzun vadeli faiz</td>\n<td>Uzun vadede yükselir. Enflasyon beklentisi arttıkça borç verenler daha yüksek faiz ister (Fisher etkisi).</td>\n<td>Uzun vadede düşer.</td>\n<td>Devlet tahvili faizleri</td>\n</tr>\n<tr>\n<td>PA-17</td>\n<td>Kredi hacmi</td>\n<td>Artar. Kısmi rezerv bankacılığında para arzının büyük kısmı zaten kredi yoluyla yaratılır.</td>\n<td>Azalır.</td>\n<td>Toplam kredi hacmi (BDDK, TCMB)</td>\n</tr>\n<tr>\n<td>PA-18</td>\n<td>Borçluluk</td>\n<td>Hanehalkı ve firmaların borcu artar.</td>\n<td>Borç alma zorlaşır.</td>\n<td>Hanehalkı ve firma borç/gelir oranı</td>\n</tr>\n</tbody></table>\n<h3>5. Döviz ve dış ticaret</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Etki</th>\n<th>Para arzı genişlerse</th>\n<th>Para arzı daralırsa</th>\n<th>Ölçülebilir gösterge</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>PA-19</td>\n<td>Döviz kuru</td>\n<td>TL değer kaybeder.</td>\n<td>TL değer kazanır.</td>\n<td>Dolar/TL, euro/TL, reel efektif döviz kuru</td>\n</tr>\n<tr>\n<td>PA-20</td>\n<td>Dış ticaret</td>\n<td>Kısa vadede ihracat ucuzlar ve artar, ithalat pahalanır. Ama Türkiye&#39;de üretim ithal girdiye bağlı olduğu için maliyetler de artar.</td>\n<td>İhracat zorlaşır, ithalat ucuzlar.</td>\n<td>İhracat, ithalat, cari açık</td>\n</tr>\n<tr>\n<td>PA-21</td>\n<td>Sermaye hareketleri</td>\n<td>Yabancı yatırımcı TL varlıklardan çıkar.</td>\n<td>Faizler yükseldiği için kısa vadeli yabancı para (sıcak para) girer.</td>\n<td>Ödemeler dengesi</td>\n</tr>\n<tr>\n<td>PA-22</td>\n<td>Dolarizasyon</td>\n<td>İnsanlar TL&#39;ye güvenmez, birikimlerini dövize ve altına çevirir.</td>\n<td>TL&#39;ye güven artar.</td>\n<td>Döviz mevduatı / toplam mevduat oranı</td>\n</tr>\n</tbody></table>\n<h3>6. Gelir ve servet dağılımı</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Etki</th>\n<th>Para arzı genişlerse</th>\n<th>Para arzı daralırsa</th>\n<th>Ölçülebilir gösterge</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>PA-23</td>\n<td>Cantillon etkisi</td>\n<td>Yeni paraya ilk ulaşanlar (bankalar, kredi alanlar, devlet, varlık sahipleri) fiyatlar yükselmeden harcar ve kazanır. Paraya en son ulaşanlar (ücretliler, emekliler) yükselmiş fiyatlarla karşılaşır ve kaybeder.</td>\n<td>Bu etki azalır.</td>\n<td>Gelir dağılımı (Gini katsayısı)</td>\n</tr>\n<tr>\n<td>PA-24</td>\n<td>Borçlu ve alacaklı</td>\n<td>Enflasyon borcun reel değerini eritir. Servet alacaklıdan borçluya geçer.</td>\n<td>Borcun reel değeri artar, borçlular zorlanır (borç deflasyonu).</td>\n<td>Reel faiz</td>\n</tr>\n<tr>\n<td>—</td>\n<td>Tasarruf sahipleri ve sabit gelirliler</td>\n<td>Tasarruflar ve sabit gelirler (emekli maaşı, memur maaşı, kira) değer kaybeder. Bu bir tür gizli vergidir (enflasyon vergisi).</td>\n<td>Tasarrufların değeri korunur.</td>\n<td>Reel mevduat getirisi</td>\n</tr>\n</tbody></table>\n<h3>7. Paranın dolaşım hızı</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Etki</th>\n<th>Para arzı genişlerse</th>\n<th>Para arzı daralırsa</th>\n<th>Ölçülebilir gösterge</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>PA-25</td>\n<td>Dolaşım hızı</td>\n<td>Enflasyon beklentisi yükselirse insanlar parayı elinde tutmak istemez ve hızla harcar. Dolaşım hızı artar, enflasyon formülün öngördüğünden daha yüksek çıkar.</td>\n<td>Belirsizlik ve kriz dönemlerinde insanlar parayı elinde tutar, dolaşım hızı düşer.</td>\n<td>Nominal GSYH / para arzı</td>\n</tr>\n</tbody></table>\n<blockquote class=\"callout warning\"><p class=\"ct\">Formül için önemli</p><p>Dolaşım hızı sabit değildir. Finansal yenilikler, faizler, güven ve dijitalleşme ile değişir. Nakdin kalkması ve dijital liraya geçiş de dolaşım hızını değiştirecektir. Sabit bir para arzı kuralı, dolaşım hızı değiştiğinde yanlış sonuç verir.</p>\n</blockquote>\n<h3>8. Kamu maliyesi</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Etki</th>\n<th>Para arzı genişlerse</th>\n<th>Para arzı daralırsa</th>\n<th>Ölçülebilir gösterge</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>PA-26</td>\n<td>Senyoraj</td>\n<td>Devlet para basarak gelir elde eder.</td>\n<td>Bu gelir azalır.</td>\n<td>Merkez Bankası&#39;nın Hazine&#39;ye aktardığı kâr</td>\n</tr>\n<tr>\n<td>PA-27</td>\n<td>Kamu borcu</td>\n<td>Enflasyon devletin borcunun reel değerini eritir.</td>\n<td>Borcun reel yükü artar.</td>\n<td>Kamu borcu / GSYH</td>\n</tr>\n<tr>\n<td>PA-28</td>\n<td>Vergi dilimi kayması</td>\n<td>Nominal gelirler arttığı için insanlar daha yüksek vergi dilimlerine geçer. Reel gelirleri artmadığı halde daha fazla vergi öderler.</td>\n<td>Bu etki ortadan kalkar.</td>\n<td>Vergi gelirleri / GSYH</td>\n</tr>\n</tbody></table>\n<h3>9. Finansal istikrar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Etki</th>\n<th>Para arzı genişlerse</th>\n<th>Para arzı daralırsa</th>\n<th>Ölçülebilir gösterge</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>PA-29</td>\n<td>Varlık balonları</td>\n<td>Konut ve borsada balon oluşur.</td>\n<td>Balonlar söner, varlık fiyatları düşer.</td>\n<td>Konut fiyatı / kira oranı, fiyat/kazanç oranı</td>\n</tr>\n<tr>\n<td>PA-30</td>\n<td>Banka sağlığı</td>\n<td>Kredi hızla büyür, kötü krediler birikir.</td>\n<td>Kötü krediler ortaya çıkar, bazı bankalar batabilir.</td>\n<td>Takipteki kredi oranı, sermaye yeterlilik oranı</td>\n</tr>\n<tr>\n<td>PA-31</td>\n<td>Bankalara hücum riski</td>\n<td>Kısmi rezervde bankalar mevduatın tamamını aynı anda geri ödeyemez. Rezerv oranı düştükçe risk artar.</td>\n<td>Rezerv oranı yükseldikçe risk azalır.</td>\n<td>Rezerv oranı, likidite oranları</td>\n</tr>\n</tbody></table>\n<h3>10. Belirsizlik ve günlük maliyetler</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Etki</th>\n<th>Para arzı genişlerse</th>\n<th>Para arzı daralırsa</th>\n<th>Ölçülebilir gösterge</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>PA-32</td>\n<td>Belirsizlik</td>\n<td>Yüksek ve dalgalı enflasyon uzun vadeli planlama ve sözleşme yapmayı zorlaştırır.</td>\n<td>Fiyatlar öngörülebilir olur.</td>\n<td>Enflasyonun oynaklığı</td>\n</tr>\n<tr>\n<td>PA-33</td>\n<td>Etiket maliyetleri</td>\n<td>Firmalar fiyat listelerini, menüleri ve sözleşmeleri sık sık değiştirmek zorunda kalır.</td>\n<td>Bu maliyet azalır.</td>\n<td>Doğrudan ölçülmez</td>\n</tr>\n</tbody></table>\n<hr>\n<h3>Formüle girebilecek göstergeler</h3>\n<table>\n<thead>\n<tr>\n<th>Gösterge</th>\n<th>Avantajı</th>\n<th>Dezavantajı</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>TÜFE enflasyonu</td>\n<td>Herkesin anladığı, aylık açıklanan bir veri.</td>\n<td>Gıda ve enerji yüzünden dalgalı. Para dışı şoklardan etkilenir.</td>\n</tr>\n<tr>\n<td>Çekirdek enflasyon</td>\n<td>Kalıcı eğilimi daha iyi gösterir.</td>\n<td>Halkın hissettiği enflasyonu tam yansıtmaz.</td>\n</tr>\n<tr>\n<td>Reel GSYH büyümesi</td>\n<td>Ekonominin gerçek büyümesini gösterir.</td>\n<td>Üç ayda bir açıklanır, sonradan revize edilir.</td>\n</tr>\n<tr>\n<td>Potansiyel büyüme</td>\n<td>Uzun vadeli kapasiteyi gösterir.</td>\n<td>Doğrudan ölçülemez, tahmin edilir.</td>\n</tr>\n<tr>\n<td>Nominal GSYH</td>\n<td>Fiyat ve üretimi tek sayıda birleştirir. Dolaşım hızı sorununu da kısmen çözer.</td>\n<td>Üç ayda bir açıklanır.</td>\n</tr>\n<tr>\n<td>Dolaşım hızı</td>\n<td>Formülün doğru çalışması için gerekli.</td>\n<td>Kararsızdır, geçmiş ortalaması geleceği iyi göstermeyebilir.</td>\n</tr>\n<tr>\n<td>Kredi büyümesi</td>\n<td>Kısmi rezervle yaratılan parayı doğrudan gösterir.</td>\n<td>Sağlıklı ve sağlıksız krediyi ayırmaz.</td>\n</tr>\n<tr>\n<td>Konut fiyatları</td>\n<td>Varlık balonlarını yakalar.</td>\n<td>Para dışı nedenlerle de değişir (göç, deprem, imar).</td>\n</tr>\n<tr>\n<td>Döviz kuru</td>\n<td>Günlük izlenebilir.</td>\n<td>Dış şoklardan çok etkilenir.</td>\n</tr>\n<tr>\n<td>İşsizlik</td>\n<td>Kısa vadeli zararı gösterir.</td>\n<td>Uzun vadede paradan bağımsızdır.</td>\n</tr>\n</tbody></table>\n<h3>Bilinen para kuralları</h3>\n<p>Bu kuralları kendi formülüne başlangıç noktası olarak kullanabilirsin:</p>\n<table>\n<thead>\n<tr>\n<th>Kural</th>\n<th>Formül</th>\n<th>Açıklama</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Friedman&#39;ın sabit oran kuralı</td>\n<td><span class=\"katex\">< ararlı görmez, çünkü verimlilik artışından gelir.</li>\n<li><strong>Fiyat istikrarı hedefi yanlıştır.</strong> Fiyatları sabit tutmak için büyüyen ekonomiye para basmak, yeni paranın kredi yoluyla girmesine ve faizi yapay olarak düşürmesine yol açar. Bu da yanlış yatırımlara ve krize götürür (bkz. PA-10).</li>\n<li><strong>Dolaşım hızı düşerse para arzı artırılabilir.</strong> Örneğin kriz anında insanlar parayı elinde tutarsa Merkez Bankası bunu dengelemek için para arzını artırabilir.</li>\n</ul>\n<p>Taslak formülle karşılaştırma:</p>\n<table>\n<thead>\n<tr>\n<th>Formül</th>\n<th>Üretim %3 büyürse</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Taslak formül: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>g</mi><mi>M</mi></msub><mo>≤</mo><msub><mi>g</mi><mi>Y</mi></msub><mo>+</mo><msup><mi>π</mi><mo>∗</mo></msup></mrow><annotation encoding=\"application/x-tex\">g_M \\le g_Y + \\pi^*</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8304em;vertical-align:-0.1944em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">g</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3283em;\"><span style=\"top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.10903em;\">M</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">≤</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7778em;vertical-align:-0.1944em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">g</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3283em;\"><span style=\"top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.22222em;\">Y</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6887em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">π</span><span class=\"msupsub\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6887em;\"><span style=\"top:-3.063em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mbin mtight\">∗</span></span></span></span></span></span></span></span></span></span></span></td>\n<td>Para arzı %3 artı hedef enflasyon kadar artabilir. Fiyatlar sabit kalır ya da hedef kadar yükselir.</td>\n</tr>\n<tr>\n<td>Hayek: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>g</mi><mi>M</mi></msub><mo>=</mo><mo>−</mo><msub><mi>g</mi><mi>V</mi></msub></mrow><annotation encoding=\"application/x-tex\">g_M = -g_V</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.625em;vertical-align:-0.1944em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">g</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3283em;\"><span style=\"top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.10903em;\">M</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7778em;vertical-align:-0.1944em;\"></span><span class=\"mord\">−</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">g</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3283em;\"><span style=\"top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.22222em;\">V</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span></span></span></span></td>\n<td>Para arzı artmaz. Fiyatlar yaklaşık %3 düşer.</td>\n</tr>\n</tbody></table>\n<h4>2. Dönem: Paranın millileştirilmemesi (1976)</h4>\n<p><em>Paranın Millileştirilmemesi</em> (<em>Denationalisation of Money</em>, 1976) kitabında Hayek, hiçbir merkez bankasının doğru formülü uygulayacağına güvenmez. Siyasi baskı her zaman para basmaya iter. Önerisi şudur:</p>\n<ul>\n<li>Devletin para basma tekeli kaldırılır.</li>\n<li>Özel bankalar kendi paralarını çıkarır ve birbiriyle rekabet eder.</li>\n<li>İnsanlar değerini en iyi koruyan parayı seçer. Kötü para kendiliğinden piyasadan çekilir.</li>\n</ul>\n<p>Yani son döneminde Hayek&#39;e göre doğru formülü merkez bankası değil, paralar arasındaki rekabet bulur.</p>\n<h4>Kısmi rezerv hakkında</h4>\n<p>Hayek kısmi rezerv bankacılığının krizlere yol açtığını kabul eder, ama %100 rezerv önerisine (Chicago Planı) şüpheyle bakmıştır. Ona göre bankalar yasaklanan para türünün yerine para gibi kullanılan yeni araçlar üretir, bu yüzden yasak kolayca delinir. Bu, kısmi rezervi sınırlarken dikkat edilmesi gereken bir noktadır.</p>\n<blockquote class=\"callout question\"><p class=\"ct\">Liberalizasyon planıyla gerilim</p><p>Planda dijital lirayı tek başına Merkez Bankası çıkarıyor ve nakit tamamen kalkıyor. Bu, Hayek&#39;in ikinci dönem görüşünün, yani devletin para tekelinin kaldırılmasının tam tersidir. Hayek&#39;in birinci dönem kuralı ise bağımsız bir merkez bankasıyla uyumludur. Hangisinin benimseneceğine karar verilmeli.</p>\n</blockquote>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-tahmini-makro-gostergeler\">Tahmini Makro Göstergeler</h2><p>Liberalizasyon planı ve Sendika Sistemi birlikte uygulanırsa makro göstergelerin nasıl seyredebileceğini gösteren bir senaryo.</p>\n<blockquote class=\"callout warning\"><p class=\"ct\">Bu bir tahmin değil</p><p></p>\n<ul>\n<li><strong>Para politikası satırları</strong> (enflasyon, büyüme, işsizlik, faiz, rezerv, kriz): <a href=\"https://claude.ai/artifact/F5az3rnseX8imarEzQNauF\">Para Reformu Simülasyonu</a> varsayılan ayarlarıyla. Hayek kuralı, 4 yıllık geçiş, enflasyon bitince rezervin %80&#39;den %50&#39;ye kademeli indirimi.</li>\n<li><strong>Diğer satırlar:</strong> Benzer reformları yapan ülkelerin deneyimine dayanan değerlendirme.</li>\n<li><strong>Başlangıç sütunu:</strong> Resmi veri değil, varsayım. Güncel TÜİK ve TCMB verileriyle değiştirilmeli.</li>\n</ul>\n<p>&quot;Güven&quot; sütunu tahminin ne kadar sağlam olduğunu gösterir.</p>\n</blockquote>\n<h3>Tablo</h3>\n<table>\n<thead>\n<tr>\n<th>Gösterge</th>\n<th>Başlangıç (varsayım)</th>\n<th>1-2. yıl</th>\n<th>3-4. yıl</th>\n<th>5-7. yıl</th>\n<th>8-10. yıl</th>\n<th>Mevcut sistem sürerse (10. yıl)</th>\n<th>Güven</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Enflasyon (yıllık)</strong></td>\n<td>%30</td>\n<td>%15-25</td>\n<td>%0-5</td>\n<td>−%2 ile −%3</td>\n<td>−%2 ile −%3</td>\n<td>%15-25</td>\n<td>Yüksek</td>\n</tr>\n<tr>\n<td><strong>Reel büyüme (yıllık)</strong></td>\n<td>%3</td>\n<td>%0-1,5</td>\n<td>%2-3</td>\n<td>%2,6-3,6</td>\n<td>%2,6-3,7</td>\n<td>%2-3, kriz yıllarında eksi</td>\n<td>Orta</td>\n</tr>\n<tr>\n<td><strong>İşsizlik</strong></td>\n<td>%9</td>\n<td>%11-13</td>\n<td>%10-12</td>\n<td>%9-10</td>\n<td>%8,5-9,5</td>\n<td>%9-12, krizlerde %15+</td>\n<td>Orta</td>\n</tr>\n<tr>\n<td><strong>Nominal faiz</strong></td>\n<td>%35</td>\n<td>%10-30</td>\n<td>%2-6</td>\n<td>%0-2</td>\n<td>%0-2</td>\n<td>%20-35</td>\n<td>Orta</td>\n</tr>\n<tr>\n<td><strong>Reel faiz</strong></td>\n<td>%3-5</td>\n<td>%5-8</td>\n<td>%3-5</td>\n<td>%2-4</td>\n<td>%2-3</td>\n<td>%0-5, oynak</td>\n<td>Orta</td>\n</tr>\n<tr>\n<td><strong>Yeni mevduatta rezerv oranı</strong></td>\n<td>%10</td>\n<td>%80</td>\n<td>%80</td>\n<td>%80&#39;den %60&#39;a</td>\n<td>%60&#39;tan %50&#39;ye</td>\n<td>%10</td>\n<td>Yüksek</td>\n</tr>\n<tr>\n<td><strong>Kredi faizleri</strong></td>\n<td>Çok yüksek</td>\n<td>Yüksek</td>\n<td>Düşüyor</td>\n<td>Rezerv indirimiyle 0,5-1,5 puan daha düşük</td>\n<td>Düşük</td>\n<td>Yüksek</td>\n<td>Orta</td>\n</tr>\n<tr>\n<td><strong>Bankaların yarattığı para (GSYH&#39;ye oranı)</strong></td>\n<td>Çok yüksek</td>\n<td>Dondurulmuş</td>\n<td>Dondurulmuş</td>\n<td>Artıyor</td>\n<td>%60-65</td>\n<td>Yüksek</td>\n<td>Orta</td>\n</tr>\n<tr>\n<td><strong>Bütçe dengesi (GSYH&#39;ye oranı)</strong></td>\n<td>−%3</td>\n<td>−%3 ile −%5</td>\n<td>−%1 ile −%2</td>\n<td>%0 ile −%1</td>\n<td>%0 ile +%1</td>\n<td>−%3 ile −%5</td>\n<td>Düşük</td>\n</tr>\n<tr>\n<td><strong>Özelleştirme geliri (toplam, GSYH&#39;ye oranı)</strong></td>\n<td>—</td>\n<td>%2-4</td>\n<td>%1-2</td>\n<td>%0,5-1</td>\n<td>Az</td>\n<td>—</td>\n<td>Düşük</td>\n</tr>\n<tr>\n<td><strong>Kamu borcu (GSYH&#39;ye oranı)</strong></td>\n<td>%30</td>\n<td>%30-33</td>\n<td>%26-30</td>\n<td>%22-27</td>\n<td>%18-25</td>\n<td>%30-40</td>\n<td>Düşük</td>\n</tr>\n<tr>\n<td><strong>Cari denge (GSYH&#39;ye oranı)</strong></td>\n<td>−%2</td>\n<td>−%3 ile −%4</td>\n<td>−%2 ile −%3</td>\n<td>−%1 ile −%2</td>\n<td>−%1 ile +%1</td>\n<td>−%2 ile −%5</td>\n<td>Düşük</td>\n</tr>\n<tr>\n<td><strong>TL&#39;nin reel değeri (endeks)</strong></td>\n<td>100</td>\n<td>105-115</td>\n<td>110-120</td>\n<td>110-120</td>\n<td>110-125</td>\n<td>85-100</td>\n<td>Düşük</td>\n</tr>\n<tr>\n<td><strong>Döviz mevduatı payı (dolarizasyon)</strong></td>\n<td>%40</td>\n<td>%30-40</td>\n<td>%20-30</td>\n<td>%12-20</td>\n<td>%8-15</td>\n<td>%40-55</td>\n<td>Orta</td>\n</tr>\n<tr>\n<td><strong>Kayıt dışı istihdam</strong></td>\n<td>%27</td>\n<td>%24-27</td>\n<td>%18-23</td>\n<td>%14-18</td>\n<td>%10-15</td>\n<td>%25-30</td>\n<td>Orta</td>\n</tr>\n<tr>\n<td><strong>Reel ücret değişimi (yıllık)</strong></td>\n<td>—</td>\n<td>−%2 ile 0</td>\n<td>+%1-2</td>\n<td>+%2-3</td>\n<td>+%2-3</td>\n<td>0 ile +%1, oynak</td>\n<td>Orta</td>\n</tr>\n<tr>\n<td><strong>Yatırım (GSYH&#39;ye oranı)</strong></td>\n<td>%25</td>\n<td>%20-23</td>\n<td>%23-25</td>\n<td>%25-28</td>\n<td>%26-29</td>\n<td>%22-26</td>\n<td>Düşük</td>\n</tr>\n<tr>\n<td><strong>Kredi krizi</strong></td>\n<td>—</td>\n<td>—</td>\n<td>—</td>\n<td>—</td>\n<td>Toplam 0-1</td>\n<td>Toplam 2-3</td>\n<td>Düşük</td>\n</tr>\n</tbody></table>\n<h3>Satırların arkasındaki mantık</h3>\n<ul>\n<li><strong>Enflasyon ve faiz:</strong> Merkez Bankası para basmayı kurala bağlayınca enflasyon 3-4 yılda biter. Sonra fiyatlar her yıl verimlilik artışı kadar düşer. Geçişte reel faiz yükselir, bu dezenflasyonun bilinen maliyetidir.</li>\n<li><strong>Büyüme ve işsizlik:</strong> İlk iki yılda dezenflasyon, kapatılan kurumlardan çıkan personel ve satılan şirketlerdeki yeniden yapılanma üst üste biner. 5. yıldan sonra rekabet, azalan krizler ve rezerv indirimiyle ucuzlayan kredi büyümeyi destekler.</li>\n<li><strong>Rezerv indirimi:</strong> Toplam para miktarını değiştirmez, çünkü Merkez Bankası bankaların yarattığı fazla parayı geri çeker. Enflasyon ve işsizlik etkilenmez. Kredi ucuzlar ama kırılganlık artar. Ayrıntılar: <a href=\"#sec-merkez-bankasi\">Merkez Bankası</a></li>\n<li><strong>Bütçe:</strong> Kapatılan kurumlar, biten destekler (YEKDEM, TMO, BOTAŞ zararları) ve zarar eden şirketlerin satışı bütçeyi rahatlatır. Senyoraj kaybı, kıdem tazminatları, geçiş dönemi işsizlik ödemeleri ve süren yap-işlet-devret garantileri ise zorlar.</li>\n<li><strong>Cari denge ve kur:</strong> TL güvenilir hale gelince yabancı sermaye girer ve TL değer kazanır. Cari açık ilk yıllarda büyüyebilir. Simülasyonda dış ticaret olmadığı için bu satırlar en belirsiz olanlar.</li>\n<li><strong>Kayıt dışılık:</strong> Nakdin kalkması ve Kayıt Dışılık Kurulu kayıt dışını azaltır. Güçlü işçi korumaları bazı işverenleri kayıt dışına itebilir, ama nakit olmadığı için ilk etki daha güçlü varsayıldı.</li>\n</ul>\n<h3>İki büyük varsayım</h3>\n<ol>\n<li><strong>Sendikalar reel pazarlık yapıyor:</strong> Fiyatlar düşerken sendikalar her yıl yüksek nominal zam alırsa toplam harcama sabit olduğu için bunu karşılayacak para yoktur. Bu durumda 5-10. yıllarda işsizlik %11-14&#39;e çıkabilir, büyüme 1-2 puan düşebilir. Bu yüzden Selgin kuralı ve Finansman notundaki kazanım payının reel olarak tanımlanması önerilir.</li>\n<li><strong>Reformlar sırayla yapılıyor:</strong> Önce yargı ve bağımsız kurumlar, sonra para reformu, sonra satışlar ve kapatmalar. Hepsi aynı anda başlarsa 1-2. yıldaki işsizlik %14-16&#39;ya çıkabilir.</li>\n</ol>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-para-sistemi-simulasyonu\">Para Sistemi Simülasyonu</h2><p><a href=\"#sec-merkez-bankasi\">Merkez Bankası</a> ve <a href=\"#sec-hazine-ve-maliye-bakanligi\">Hazine ve Maliye Bakanlığı</a> notlarındaki para planı <strong>1 Ocak 2027&#39;de yürürlüğe girmiş gibi</strong> 2027-2031 dönemi için çeyrek çeyrek simüle edildi.</p>\n<blockquote class=\"callout warning\"><p class=\"ct\">Bu bir tahmin değil</p><p>Sonuçlar, Türkiye verileriyle kabaca ayarlanmış basit bir modelden gelir. Sayıların kendisi değil, <strong>yönü ve büyüklük sırası</strong> önemlidir. Model; enflasyon ataleti, ücret katılığı, kur geçişkenliği, dolarizasyon ve kredi daralmasını içerir. Siyasi tepkileri, dış şokları ve bankaların tek tek batmasını içermez.</p>\n</blockquote>\n<hr>\n<h3>Başlangıç noktası (Ekim 2026)</h3>\n<table>\n<thead>\n<tr>\n<th>Gösterge</th>\n<th>Değer</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Yıllık enflasyon (Eylül 2026)</td>\n<td>%29,73</td>\n</tr>\n<tr>\n<td>Aylık enflasyon (Eylül 2026)</td>\n<td>%1,84</td>\n</tr>\n<tr>\n<td>TCMB politika faizi</td>\n<td>%37</td>\n</tr>\n<tr>\n<td>Dolar/TL</td>\n<td>49,17</td>\n</tr>\n<tr>\n<td>Nominal GSYH (2026, varsayım)</td>\n<td>~72 trilyon TL</td>\n</tr>\n<tr>\n<td>İşsizlik (varsayım)</td>\n<td>~%8,5</td>\n</tr>\n<tr>\n<td>Döviz mevduatı / toplam mevduat (varsayım)</td>\n<td>~%39</td>\n</tr>\n<tr>\n<td>Kamu borcu / GSYH (varsayım)</td>\n<td>~%25, yarısı döviz cinsinden</td>\n</tr>\n<tr>\n<td>Takipteki kredi oranı (varsayım)</td>\n<td>~%2,6</td>\n</tr>\n</tbody></table>\n<h3>Açık konularda simülasyon için seçilenler</h3>\n<p>Plan bazı konularda karar vermediği için simülasyonda şu seçimler yapıldı:</p>\n<table>\n<thead>\n<tr>\n<th>Açık konu</th>\n<th>Simülasyondaki seçim</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Hedefin başlangıç seviyesi</td>\n<td>2026&#39;nın son çeyreğindeki yıllıklaştırılmış nominal GSYH. (2026 yıl ortalaması seçilseydi, enflasyon yüzünden hedef ~%12 daha aşağıda kalırdı ve kriz çok daha derin olurdu.)</td>\n</tr>\n<tr>\n<td>Sabit mi, işgücüyle mi büyüyecek?</td>\n<td>Senaryo A: tamamen sabit (Hayek). Senaryo B: kademeli inişle sonunda yılda %3 (Selgin&#39;e yakın).</td>\n</tr>\n<tr>\n<td>Rezerv oranı</td>\n<td>%80, yalnızca yeni mevduata (Mises&#39;in geçişi). Eski karşılıksız tutar donduruldu.</td>\n</tr>\n<tr>\n<td>Rezervlere faiz</td>\n<td>Merkez Bankası rezervlere <strong>faiz ödemiyor</strong>.</td>\n</tr>\n<tr>\n<td>Bağımsızlık</td>\n<td>Ocak 2027&#39;de yasayla tam bağımsızlık, Hazine&#39;ye borç yasağı var.</td>\n</tr>\n<tr>\n<td>Nakdin kalkması</td>\n<td>Darphane Ocak 2027&#39;de durdu. Dijital lira 2027&#39;de pilot, nakit 2028 ortası - 2029 sonu arasında kademeli kalkıyor.</td>\n</tr>\n<tr>\n<td>Özelleştirme gelirleri</td>\n<td>2027-2029 arası yılda GSYH&#39;nin ~%1&#39;i, borç ödemesine gidiyor.</td>\n</tr>\n</tbody></table>\n<hr>\n<h3>Senaryo A: Plan harfiyen uygulanıyor (Hayek&#39;in yansız para kuralı)</h3>\n<p>Merkez Bankası faiz hedeflemeyi bırakır ve <a href=\"#sec-merkez-bankasi\">Hayek&#39;in yansız para kuralını</a> uygular: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mo>×</mo><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">M \\times V</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">M</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">V</span></span></span></span>, yani nominal GSYH, 2026 sonu seviyesinde sabit tutulur. Notta yazdığı gibi:</p>\n<ul>\n<li>Nominal GSYH hedefin <strong>altına</strong> düşerse para çıkarır.</li>\n<li>Nominal GSYH hedefin <strong>üstüne</strong> çıkarsa para geri çeker.</li>\n<li>Ekonomi büyüyorsa para basmaz, fiyatlar düşer.</li>\n</ul>\n<p>Bankaların kısmi rezervle para yaratması da Mises&#39;in geçişi ve %80 rezervle sınırlanır.</p>\n<h4>Çeyrek çeyrek ilk üç yıl</h4>\n<table>\n<thead>\n<tr>\n<th>Dönem</th>\n<th>Enflasyon*</th>\n<th>Reel büyüme*</th>\n<th>Nominal büyüme*</th>\n<th>İşsizlik</th>\n<th>Dolar/TL</th>\n<th>Dolarizasyon</th>\n<th>Takipteki kredi</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>2027 Ç1</td>\n<td>%23,6</td>\n<td>%-6,3</td>\n<td>%16,6</td>\n<td>%9,7</td>\n<td>50,1</td>\n<td>%39,4</td>\n<td>%3,2</td>\n</tr>\n<tr>\n<td>2027 Ç2</td>\n<td>%17,7</td>\n<td>%-13,7</td>\n<td>%3,7</td>\n<td>%11,8</td>\n<td>51,0</td>\n<td>%40,7</td>\n<td>%4,5</td>\n</tr>\n<tr>\n<td>2027 Ç3</td>\n<td>%11,1</td>\n<td>%-15,7</td>\n<td>%-4,6</td>\n<td>%14,1</td>\n<td>53,7</td>\n<td>%41,9</td>\n<td>%6,1</td>\n</tr>\n<tr>\n<td>2027 Ç4</td>\n<td>%3,2</td>\n<td>%-11,5</td>\n<td>%-7,3</td>\n<td>%15,8</td>\n<td>56,2</td>\n<td>%42,8</td>\n<td>%7,3</td>\n</tr>\n<tr>\n<td>2028 Ç1</td>\n<td>%-6,4</td>\n<td>%-0,6</td>\n<td>%-5,6</td>\n<td>%16,1</td>\n<td>57,5</td>\n<td>%43,7</td>\n<td>%7,7</td>\n</tr>\n<tr>\n<td>2028 Ç2</td>\n<td>%-10,3</td>\n<td>%7,5</td>\n<td>%-1,8</td>\n<td>%15,5</td>\n<td>58,0</td>\n<td>%44,8</td>\n<td>%7,6</td>\n</tr>\n<tr>\n<td>2028 Ç3</td>\n<td>%-11,0</td>\n<td>%11,6</td>\n<td>%0,9</td>\n<td>%14,6</td>\n<td>58,0</td>\n<td>%45,8</td>\n<td>%7,5</td>\n</tr>\n<tr>\n<td>2028 Ç4</td>\n<td>%-9,9</td>\n<td>%11,5</td>\n<td>%1,9</td>\n<td>%13,6</td>\n<td>57,7</td>\n<td>%46,7</td>\n<td>%7,4</td>\n</tr>\n<tr>\n<td>2029 Ç1</td>\n<td>%-8,2</td>\n<td>%9,1</td>\n<td>%1,5</td>\n<td>%13,0</td>\n<td>57,3</td>\n<td>%47,5</td>\n<td>%7,3</td>\n</tr>\n<tr>\n<td>2029 Ç2</td>\n<td>%-6,6</td>\n<td>%6,3</td>\n<td>%0,4</td>\n<td>%12,6</td>\n<td>57,0</td>\n<td>%48,2</td>\n<td>%7,1</td>\n</tr>\n<tr>\n<td>2029 Ç3</td>\n<td>%-5,6</td>\n<td>%4,3</td>\n<td>%-0,4</td>\n<td>%12,5</td>\n<td>56,9</td>\n<td>%48,9</td>\n<td>%7,0</td>\n</tr>\n<tr>\n<td>2029 Ç4</td>\n<td>%-5,0</td>\n<td>%3,4</td>\n<td>%0,7</td>\n<td>%12,5</td>\n<td>56,9</td>\n<td>%50,5</td>\n<td>%6,8</td>\n</tr>\n</tbody></table>\n<p>* Çeyreklik değişmenin yıllıklaştırılmış hali.</p>\n<h4>Ne oluyor?</h4>\n<p><strong>Ocak 2027: Yasa günü.</strong> Bankaların karşılıksız mevduatı dondurulur, yeni mevduatın %80&#39;i Merkez Bankası&#39;nda tutulmak zorundadır. Merkez Bankası politika faizini kaldırır. Darphane durur.</p>\n<p><strong>2027 Ç1: Mevduat faizi çöker.</strong> Bankalar yeni gelen her 100 TL&#39;nin yalnızca 20 TL&#39;sini kredi olarak verebilir. Rezervlere faiz ödenmediği için mevduata %37 faiz vermeleri imkansızdır. Mevduat faizi birkaç ay içinde <strong>%37&#39;den ~%5&#39;e</strong> düşer. Enflasyon hâlâ %20&#39;nin üstünde olduğundan mevduat sahibi her yıl ~%15 reel kayıp yaşar. Birikimler dövize, altına, borsaya ve USDT&#39;ye kaçar.</p>\n<p><strong>2027 Ç2-Ç4: Kredi daralması ve derin durgunluk.</strong> Kredi faizi %30&#39;un üstüne çıkar, enflasyon düştükçe reel kredi faizi %13&#39;ü geçer. Ücretler ve kiralar geçmiş enflasyona endeksli olduğu için fiyatlar nominal harcamanın düştüğü hızda düşemez. Aradaki fark üretimden kesilir. 2027&#39;de ekonomi <strong>%12 küçülür</strong>, işsizlik %16&#39;ya yaklaşır. KOBİ iflasları, karşılıksız çekler ve takipteki krediler hızla artar.</p>\n<blockquote class=\"callout danger\"><p class=\"ct\">Kuralın kendisi krizi derinleştiriyor</p><p>İlk çeyrekte eski kredilerin etkisiyle nominal harcama hedefin üstüne çıkar. Kural &quot;hedefin üstündeyse para geri çek&quot; dediği için Merkez Bankası durgunluğun ortasında baz parayı geri çeker. Seviye hedefi bu aşımı geri almayı zorunlu kılar. 2027&#39;nin ikinci yarısında nominal GSYH <strong>küçülür</strong>.</p>\n</blockquote>\n<p><strong>2028: Deflasyon.</strong> Fiyatlar yılda ~%9 düşer. Borçlular için borcun reel değeri artar (PA-24, borç deflasyonu). Takipteki krediler %7,7&#39;yle zirve yapar, birkaç banka sermaye desteğine ihtiyaç duyar. Fiyatlar düştükçe reel harcama toparlanır ve 2028&#39;in ikinci yarısında reel büyüme güçlü döner.</p>\n<p><strong>2028-2029: Nakit kalkıyor, kayıt dışı dövize geçiyor.</strong> Kayıt dışı ekonomi dijital liraya geçmek yerine <strong>dolar nakde, altına ve USDT&#39;ye</strong> geçer. Dolarizasyon %39&#39;dan %50&#39;ye çıkar. Bu, <a href=\"#sec-para-arzinin-etkileri\">Para Arzının Etkileri</a> notunda Hayek&#39;in uyarısının gerçekleşmesidir: Yasaklanan ya da kısıtlanan paranın yerine para gibi kullanılan başka araçlar çıkar.</p>\n<p><strong>2029-2031: Düşük büyüme, kalıcı işsizlik.</strong> Enflasyon her yıl %-4 ile %-6 arasındadır. TL güçlü kalır (dolar/TL ~57). Ama ücretler düşmeye direndiği için işsizlik <strong>%12&#39;nin altına inmez</strong>. Nominal GSYH sabit kaldığı için kamu borcunun GSYH&#39;ye oranı her yıl artar.</p>\n<h4>Yıllık özet</h4>\n<table>\n<thead>\n<tr>\n<th>Yıl</th>\n<th>Enflasyon</th>\n<th>Reel büyüme</th>\n<th>İşsizlik (ort.)</th>\n<th>Dolar/TL (yıl sonu)</th>\n<th>Dolarizasyon</th>\n<th>Kredi faizi</th>\n<th>Mevduat faizi</th>\n<th>Takipteki kredi</th>\n<th>Kamu borcu / GSYH</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>2027</td>\n<td>%13,7</td>\n<td>%-11,9</td>\n<td>%12,8</td>\n<td>56,2</td>\n<td>%42,8</td>\n<td>%29,6</td>\n<td>%4,9</td>\n<td>%7,3</td>\n<td>%31,2</td>\n</tr>\n<tr>\n<td>2028</td>\n<td>%-9,4</td>\n<td>%7,4</td>\n<td>%15,0</td>\n<td>57,7</td>\n<td>%46,7</td>\n<td>%4,0</td>\n<td>%0,0</td>\n<td>%7,4</td>\n<td>%34,1</td>\n</tr>\n<tr>\n<td>2029</td>\n<td>%-6,4</td>\n<td>%5,8</td>\n<td>%12,6</td>\n<td>56,9</td>\n<td>%50,5</td>\n<td>%5,7</td>\n<td>%0,1</td>\n<td>%6,8</td>\n<td>%35,0</td>\n</tr>\n<tr>\n<td>2030</td>\n<td>%-4,7</td>\n<td>%3,3</td>\n<td>%12,5</td>\n<td>56,6</td>\n<td>%53,4</td>\n<td>%5,9</td>\n<td>%0,2</td>\n<td>%6,4</td>\ %3) potansiyel büyümenin (%4) altında olduğu için hafif deflasyon ve %12 civarında işsizlik yine kalır.</li>\n</ul>\n<h3>Senaryo C: Karşılaştırma için bugünkü program</h3>\n<p>Planın hiçbir parçası uygulanmaz. TCMB bugünkü gibi faizle enflasyonu kademeli düşürür ve <strong>başarılı olduğu</strong> varsayılır.</p>\n<table>\n<thead>\n<tr>\n<th>Yıl</th>\n<th>Enflasyon</th>\n<th>Reel büyüme</th>\n<th>İşsizlik (ort.)</th>\n<th>Dolar/TL (yıl sonu)</th>\n<th>Dolarizasyon</th>\n<th>Kredi faizi</th>\n<th>Mevduat faizi</th>\n<th>Takipteki kredi</th>\n<th>Kamu borcu / GSYH</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>2027</td>\n<td>%23,9</td>\n<td>%3,0</td>\n<td>%8,8</td>\n<td>60,0</td>\n<td>%38,9</td>\n<td>%30,9</td>\n<td>%26,0</td>\n<td>%2,2</td>\n<td>%26,7</td>\n</tr>\n<tr>\n<td>2028</td>\n<td>%18,1</td>\n<td>%0,8</td>\n<td>%9,8</td>\n<td>69,7</td>\n<td>%37,6</td>\n<td>%24,2</td>\n<td>%19,9</td>\n<td>%2,4</td>\n<td>%29,0</td>\n</tr>\n<tr>\n<td>2029</td>\n<td>%9,4</td>\n<td>%3,3</td>\n<td>%10,7</td>\n<td>75,0</td>\n<td>%35,1</td>\n<td>%15,8</td>\n<td>%12,1</td>\n<td>%2,0</td>\n<td>%30,6</td>\n</tr>\n<tr>\n<td>2030</td>\n<td>%3,0</td>\n<td>%7,3</td>\n<td>%9,7</td>\n<td>76,1</td>\n<td>%31,7</td>\n<td>%10,3</td>\n<td>%7,2</td>\n<td>%2,0</td>\n<td>%31,1</td>\n</tr>\n<tr>\n<td>2031</td>\n<td>%2,2</td>\n<td>%7,3</td>\n<td>%8,1</td>\n<td>76,5</td>\n<td>%28,1</td>\n<td>%9,5</td>\n<td>%7,0</td>\n<td>%2,0</td>\n<td>%31,2</td>\n</tr>\n</tbody></table>\n<h3>Üç senaryo yan yana</h3>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>A: Hayek, harfiyen</th>\n<th>B: Hayek, kademeli</th>\n<th>C: Bugünkü program</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>En kötü yıl</td>\n<td>2027: %-11,9</td>\n<td>2028: %-4,1</td>\n<td>2028: %+0,8</td>\n</tr>\n<tr>\n<td>En yüksek işsizlik (çeyrek)</td>\n<td>~%16</td>\n<td>~%12</td>\n<td>~%11</td>\n</tr>\n<tr>\n<td>Enflasyon sıfırın altına iniyor</td>\n<td>2028 başı</td>\n<td>2030</td>\n<td>İnmiyor (2031: %2)</td>\n</tr>\n<tr>\n<td>Dolar/TL (2031 sonu)</td>\n<td>56,4</td>\n<td>70,0</td>\n<td>76,5</td>\n</tr>\n<tr>\n<td>Dolarizasyon (2031 sonu)</td>\n<td>%57</td>\n<td>%55</td>\n<td>%28</td>\n</tr>\n<tr>\n<td>Kamu borcu / GSYH (2031)</td>\n<td>%40</td>\n<td>%32</td>\n<td>%31</td>\n</tr>\n<tr>\n<td>TL&#39;nin değeri</td>\n<td>En güçlü</td>\n<td>Orta</td>\n<td>En zayıf</td>\n</tr>\n</tbody></table>\n<hr>\n<h3>Simülasyondan çıkan dersler</h3>\n<blockquote class=\"callout important\"><p class=\"ct\">1. Başlangıç seviyesi en kritik karar</p><p>%30 enflasyonla giren bir ekonomide nominal GSYH&#39;yi bir gecede sabitlemek, toplam harcamada ~%30&#39;luk bir düşüş demektir. Fiyatlar ve ücretler geçmiş enflasyona endeksli olduğu için bu düşüşün büyük kısmı üretime ve istihdama çarpar. Hayek&#39;in kuralı <strong>düşük enflasyonlu bir ekonomide</strong> başlatılmak üzere düşünülmüştür. Türkiye&#39;de ya önce enflasyonun düşürülmesi ya da B&#39;deki gibi bir iniş yolu gerekir.</p>\n</blockquote>\n<blockquote class=\"callout important\"><p class=\"ct\">2. Seviye hedefi mi, büyüme hedefi mi?</p><p>Plan &quot;hedefin üstüne çıkarsa para geri çeker&quot; diyor. Bu bir <strong>seviye hedefi</strong>dir: Geçmişteki aşımlar geri alınır. Geçiş döneminde aşım kaçınılmaz olduğu için kural, durgunluğun ortasında para çekmeye zorlar. Geçiş döneminde büyüme hedefi, sonra seviye hedefi kullanılabilir.</p>\n</blockquote>\n<blockquote class=\"callout important\"><p class=\"ct\">3. %80 rezerv mevduat faizini öldürüyor</p><p>Rezervlere faiz ödenmezse banka mevduata kredi faizinin en fazla beşte biri kadar faiz verebilir. Enflasyon düşene kadar mevduat sahibi her yıl reel kayıp yaşar ve birikimler dövize kaçar. Seçenekler:</p>\n<ul>\n<li>Merkez Bankası rezervlere faiz öder (ama bu para basmaktır ve kurala hesaplanmalıdır).</li>\n<li>%80 oranı enflasyon düşene kadar ertelenir.</li>\n<li>Dondurma tarihinden sonraki <strong>vadeli</strong> mevduat daha düşük rezervle tutulur (bu durumda vadeli mevduat yatırım fonu gibi işler).</li>\n</ul>\n</blockquote>\n<blockquote class=\"callout important\"><p class=\"ct\">4. Hayek&#39;in uyarısı gerçekleşiyor: Dolarizasyon</p><p>Üç senaryodan yalnızca bugünkü programda dolarizasyon düşüyor. Planda TL <strong>değer olarak</strong> güçlenir ama <strong>kullanım olarak</strong> zayıflar: Mevduat faizi düşük, nakit kalkıyor, gizlilik endişesi var. Türkiye&#39;de USDT ve altın zaten yaygın. Nakdin kalkması kayıt dışı ekonomiyi dijital liraya değil dolara ve kriptoya iter. Bu, Merkez Bankası&#39;nın kontrol ettiği para miktarını küçültür ve kuralın etkisini zayıflatır.</p>\n</blockquote>\n<blockquote class=\"callout important\"><p class=\"ct\">5. Sabit nominal GSYH, büyüyen işgücüyle uyuşmuyor</p><p>A ve B&#39;nin ikisinde de işsizlik %12&#39;nin altına inmiyor. Ücretler aşağı yönde katı olduğu için yıllık %4-5&#39;lik deflasyon ücretlerin reel değerini yükseltir ve istihdam toparlanamaz. Bu, <a href=\"#sec-merkez-bankasi\">Merkez Bankası</a> notundaki &quot;nüfus artışı&quot; uyarısının sayısal karşılığıdır ve Selgin&#39;in yorumunu (toplam harcamanın işgücü ve sermaye artışı kadar büyümesi) güçlendirir.</p>\n</blockquote>\n<blockquote class=\"callout important\"><p class=\"ct\">6. Kamu borcu deflasyonda ağırlaşıyor</p><p>Nominal GSYH sabit kalırken devletin faiz ödemeleri ve bütçe açığı sürer. Döviz cinsinden borç da TL karşılığıyla aynı kalır. A&#39;da borç/GSYH %25&#39;ten %40&#39;a çıkar. Özelleştirme gelirleri bunu yavaşlatır ama durduramaz. Enflasyon vergisi ve senyoraj gelirinin kaybı bütçede ayrıca açık yaratır.</p>\n</blockquote>\n<blockquote class=\"callout note\"><p class=\"ct\">Olumlu sonuçlar</p><p></p>\n<ul>\n<li>TL&#39;nin değeri korunur: 2031&#39;de dolar A&#39;da ~56 TL, bugünkü programda ~77 TL.</li>\n<li>Enflasyon vergisi biter. Sabit gelirliler, emekliler ve tasarruf sahipleri artık enflasyonla kaybetmez (PA-23, Cantillon etkisi).</li>\n<li>Krediyle şişen varlık balonları ve yanlış yatırımlar tasfiye olur (PA-10, PA-29).</li>\n<li>Kısmi rezervin payı küçüldüğü için bankalara hücum riski uzun vadede azalır (PA-31).</li>\n<li>Para basma kararı siyasetten ayrılır.</li>\n</ul>\n</blockquote>\n<h3>İkinci çalıştırma: Kural değiştirilirse ne olur?</h3>\n<p>Senaryo A&#39;daki Hayek kuralı korunarak dört değişiklik önce <strong>tek tek</strong>, sonra <strong>birlikte</strong> denendi.</p>\n<table>\n<thead>\n<tr>\n<th>Değişiklik</th>\n<th>Nasıl uygulandı?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Selgin versiyonu</td>\n<td>Nominal GSYH sabit kalmaz, yılda ~%2 (üretim faktörlerinin artışı kadar) büyür.</td>\n</tr>\n<tr>\n<td>Önce enflasyonu düşür</td>\n<td>Bağımsız Merkez Bankası önce faizle enflasyonu tek haneye indirir. Hayek&#39;in kuralı ve %80 rezerv ancak ondan sonra başlar.</td>\n</tr>\n<tr>\n<td>Rezervlere faiz</td>\n<td>Merkez Bankası %80 rezerve beklenen enflasyonun 1 puan üstünde faiz öder.</td>\n</tr>\n<tr>\n<td>Nakdi geç kaldır</td>\n<td>Nakit, dolarizasyon %30&#39;un altına inmeden kaldırılmaz, kaldırılırken de yavaş kaldırılır.</td>\n</tr>\n</tbody></table>\n<h4>Her değişikliğin tek başına etkisi</h4>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>En kötü yıl</th>\n<th>5 yılda toplam reel büyüme</th>\n<th>En yüksek işsizlik</th>\n<th>İşsizlik (2031)</th>\n<th>Enflasyon (2031)</th>\n<th>Dolar/TL (2031)</th>\n<th>Dolarizasyon (2031)</th>\n<th>Kamu borcu / GSYH (2031)</th>\n<th>En yüksek takipteki kredi</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A (ilk çalıştırma)</td>\n<td>%-11,9</td>\n<td>%7,0</td>\n<td>%16,1</td>\n<td>%12,3</td>\n<td>%-4,5</td>\n<td>56,4</td>\n<td>%57</td>\n<td>%40</td>\n<td>%7,7</td>\n</tr>\n<tr>\n<td>A + Selgin</td>\n<td>%-10,5</td>\n<td>%9,9</td>\n<td>%15,6</td>\n<td>%11,6</td>\n<td>%-2,9</td>\n<td>55,3</td>\n<td>%55</td>\n<td>%37</td>\n<td>%7,2</td>\n</tr>\n<tr>\n<td>A + Önce enflasyonu düşür</td>\n<td><strong>%-0,5</strong></td>\n<td>%12,3</td>\n<td>%12,0</td>\n<td>%11,8</td>\n<td>%-3,5</td>\n<td>60,5</td>\n<td>%42</td>\n<td>%30</td>\n<td>%2,6</td>\n</tr>\n<tr>\n<td>A + Rezervlere faiz</td>\n<td>%-11,7</td>\n<td>%7,1</td>\n<td>%15,9</td>\n<td>%12,3</td>\n<td>%-4,5</td>\n<td>56,1</td>\n<td>%56</td>\n<td>%41</td>\n<td>%7,6</td>\n</tr>\n<tr>\n<td>A + Nakdi geç kaldır</td>\n<td>%-11,9</td>\n<td>%7,6</td>\n<td>%16,1</td>\n<td>%12,1</td>\n<td>%-3,7</td>\n<td>54,5</td>\n<td><strong>%47</strong></td>\n<td>%40</td>\n<td>%7,7</td>\n</tr>\n<tr>\n<td><strong>D: Hepsi birlikte</strong></td>\n<td><strong>%+1,6</strong></td>\n<td><strong>%14,6</strong></td>\n<td><strong>%11,1</strong></td>\n<td>%11,0</td>\n<td>%-1,5</td>\n<td>58,2</td>\n<td><strong>%31</strong></td>\n<td><strong>%29</strong></td>\n<td><strong>%2,5</strong></td>\n</tr>\n<tr>\n<td>C: Bugünkü program</td>\n<td>%+0,8</td>\n<td>%23,6</td>\n<td>%10,7</td>\n<td>%8,1</td>\n<td>%+2,2</td>\n<td>76,5</td>\n<td>%28</td>\n<td>%31</td>\n<td>%2,5</td>\n</tr>\n</tbody></table>\n<ul>\n<li><strong>Krizi en çok azaltan değişiklik kuralın zamanlaması.</strong> Kural enflasyon düştükten sonra başlarsa 2027&#39;deki %12&#39;lik küçülme neredeyse tamamen ortadan kalkar. Kural kendi başına sorun değil, %30 enflasyonda başlatılması sorun.</li>\n<li><strong>Selgin versiyonu</strong> deflasyonu ve işsizliği biraz azaltır, ama başlangıç krizini çözmez.</li>\n<li><strong>Rezervlere faiz</strong> tek başına makroekonomiyi pek değiştirmez. Enflasyon yüksekken faizi yine enflasyonun altında kalır. Asıl yararı, kural başladıktan sonra mevduatın bankadan kaçmasını önlemesidir.</li>\n<li><strong>Nakdi geç kaldırmak</strong> dolarizasyonu ~10 puan azaltır.</li>\n</ul>\n<h4>Senaryo D: Dört değişiklik birlikte</h4>\n<table>\n<thead>\n<tr>\n<th>Yıl</th>\n<th>Dönem</th>\n<th>Enflasyon</th>\n<th>Reel büyüme</th>\n<th>İşsizlik (ort.)</th>\n<th>Dolar/TL (yıl sonu)</th>\n<th>Dolarizasyon</th>\n<th>Kredi faizi</th>\n<th>Mevduat faizi</th>\n<th>Kamu borcu / GSYH</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>2027</td>\n<td>Faizle dezenflasyon</td>\n<td>%20,7</td>\n<td>%3,9</td>\n<td>%8,6</td>\n<td>54,6</td>\n<td>%38,8</td>\n<td>%25,9</td>\n<td>%21,0</td>\n<td>%24,7</td>\n</tr>\n<tr>\n<td>2028</td>\n<td>Faizle dezenflasyon</td>\n<td>%12,8</td>\n<td>%1,7</td>\n<td>%9,2</td>\n<td>60,1</td>\n<td>%38,6</td>\n<td>%18,4</td>\n<td>%14,1</td>\n<td>%25,3</td>\n</tr>\n<tr>\n<td>2029</td>\n<td><strong>Ç3&#39;te Hayek&#39;in kuralı başlar</strong></td>\n<td>%4,6</td>\n<td>%2,8</td>\n<td>%9,9</td>\n<td>61,4</td>\n<td>%34,5</td>\n<td>%8,8</td>\n<td>%3,0</td>\n<td>%25,8</td>\n</tr>\n<tr>\n<td>2030</td>\n<td>Kural</td>\n<td>%-1,0</td>\n<td>%1,6</td>\n<td>%10,7</td>\n<td>59,7</td>\n<td>%33,1</td>\n<td>%6,3</td>\n<td>%0,3</td>\n<td>%27,7</td>\n</tr>\n<tr>\n<td>2031</td>\n<td>Kural</td>\n<td>%-1,5</td>\n<td>%3,9</td>\n<td>%11,0</td>\n<td>58,2</td>\n<td>%31,3</td>\n<td>%6,1</td>\n<td>%0,2</td>\n<td>%29,2</td>\n</tr>\n</tbody></table>\n<ul>\n<li>Enflasyon 2029&#39;un ikinci çeyreğinde tek haneye iner, Hayek&#39;in kuralı ve %80 rezerv 2029 Ç3&#39;te başlar.</li>\n<li>Derin kriz yok, takipteki krediler artmıyor, kamu borcu bugünkü programla aynı seviyede.</li>\n<li>TL bugünkü programdan çok daha güçlü: 2031&#39;de dolar 76,5 değil 58,2 TL.</li>\n<li>Fiyatlar yılda ~%1,5 düşer. Bu, Hayek&#39;in &quot;iyi deflasyonu&quot;na yakın, ılımlı bir deflasyondur.</li>\n</ul>\n<blockquote class=\"callout warning\"><p class=\"ct\">Çözülmeyen sorun: İşsizlik</p><p>D&#39;de bile işsizlik kural başladıktan sonra %10&#39;dan %11&#39;e yavaşça çıkıyor. Modelde ücretler aşağı yönde çok katı, bu yüzden hafif deflasyon bile ücretlerin reel değerini artırıyor. Gerçekte ücretlerin ne kadar katı olduğu belirsiz. Ama bu sonuç bir soruyu açıyor: <strong>Nominal GSYH hedefi potansiyel büyümeye (<del>%4) mi yakın olmalı, yoksa faktör artışına (</del>%2) mı?</strong> Ya da iş piyasası ücretlerin düşebileceği kadar esnek mi olacak? Bu konu Sendika Sistemi planıyla da bağlantılı.</p>\n</blockquote>\n<h3>Plana önerilen değişiklikler</h3>\n<p>Simülasyona göre planın daha az maliyetle uygulanabilmesi için:</p>\n<ol>\n<li><strong>İki aşamalı geçiş:</strong> Önce bağımsız Merkez Bankası ve Hazine&#39;ye borç yasağıyla enflasyon tek haneye indirilir. Hayek&#39;in kuralı ondan sonra başlatılır.</li>\n<li><strong>Büyüme hedefiyle başla:</strong> Nominal GSYH büyüme hedefi 3-4 yılda kademeli indirilir. Son hedef sıfır değil, işgücü artışı kadar olur (Selgin).</li>\n<li><strong>Rezerv oranını kademelendir:</strong> %80&#39;e birkaç yılda çıkılır ya da rezervlere faiz ödenir.</li>\n<li><strong>Nakdi en son kaldır:</strong> Nakit, dolarizasyon düşmeden ve dijital liranın gizliliği yasayla güvenceye alınmadan kalkmaz.</li>\n<li><strong>Darphaneyi hemen kapatma:</strong> Nakit kalkana kadar madeni para talebi sürer. Darphane durursa madeni para kıtlığı yaşanır.</li>\n</ol>\n<hr>\n<h3>Model varsayımları</h3>\n<table>\n<thead>\n<tr>\n<th>Parametre</th>\n<th>Değer</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Potansiyel büyüme</td>\n<td>Yılda %4 (uzun durgunlukta bir miktar kalıcı düşüş)</td>\n</tr>\n<tr>\n<td>Enflasyon ataleti</td>\n<td>Geçen çeyreğin enflasyonunun ağırlığı 0,55</td>\n</tr>\n<tr>\n<td>Para politikasının gecikmesi</td>\n<td>Nominal harcamanın ~yarısı geçen çeyreğin hızıyla devam eder</td>\n</tr>\n<tr>\n<td>Ücret katılığı</td>\n<td>Fiyatlar düşerken enflasyon denkleminin ancak %40&#39;ı işler</td>\n</tr>\n<tr>\n<td>Kur geçişkenliği</td>\n<td>Kurdaki fazla değer kaybının %12&#39;si bir çeyrek sonra fiyatlara yansır</td>\n</tr>\n<tr>\n<td>Okun katsayısı</td>\n<td>Üretim açığındaki her 1 puan, işsizliği 0,45 puan değiştirir</td>\n</tr>\n<tr>\n<td>Güvenilirlik</td>\n<td>Bağımsızlıkla her çeyrek artar, derin durgunlukta düşer (siyasi baskı beklentisi)</td>\n</tr>\n<tr>\n<td>Kredi</td>\n<td>Planda kredi büyümesi nominal harcama büyümesinin dörtte biriyle sınırlı</td>\n</tr>\n</tbody></table>\n<p>Kaynaklar: <a href=\"https://www.haberler.com/ekonomi/yillik-enflasyon-yuzde-30-un-altina-indi-tcmb-ye-20299157-haberi/\">Eylül 2026 enflasyonu</a>, <a href=\"https://bigpara.hurriyet.com.tr/haberler/ekonomi-haberleri/son-dakika-merkez-bankasi-eylul-ayi-faiz-kararini-acikladi_ID102245845/\">Eylül 2026 faiz kararı</a>, dolar/TL: Alpha Vantage, 6 Ekim 2026.</p>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n"}];
var app=document.getElementById('app'),filter='Hepsi';
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function md(a){return a.map(function(b){if(b.indexOf('## ')==0)return'<h3>'+esc(b.slice(3))+'</h3>';if(b.indexOf('> ')==0)return'<blockquote>'+esc(b.slice(2))+'</blockquote>';return'<p>'+esc(b)+'</p>'}).join('')}
function ttl(p){return'<h1 class="title" style="--th:'+C[p.th]+'"><span class="l1">'+esc(p.l1)+'</span><span class="l2">'+esc(p.l2)+'</span></h1>'}
function ttl2(p){return'<h3 class="title" style="--th:'+C[p.th]+'"><span class="l1">'+esc(p.l1)+'</span><span class="l2">'+esc(p.l2)+'</span></h3>'}
function home(){
  if(!POSTS.length){app.innerHTML='<div class="post" style="--th:var(--gold);text-align:center;padding:60px 0"><span class="cat">Yakında</span><h1 class="title" style="margin-top:20px"><span class="l1">İlk yazı</span><span class="l2">yolda</span></h1></div>';return}
  var h=POSTS[0],cats=['Hepsi'].concat(POSTS.map(function(p){return p.cat}).filter(function(t,i,a){return a.indexOf(t)==i}));
  var rest=POSTS.slice(1).filter(function(p){return filter=='Hepsi'||p.cat==filter});
  app.innerHTML='<a class="hero" href="#'+h.id+'" style="--th:'+C[h.th]+'"><span class="cat">'+h.cat+'</span>'+ttl(h)+'<p>'+esc(h.lead)+'</p><span class="meta">'+h.sub+' · '+h.date+' · '+h.min+' dk</span>'
   +'<svg class="spark" viewBox="0 0 600 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10 L60 14 L120 22 L180 20 L240 36 L300 44 L360 52 L420 50 L480 70 L540 76 L600 84"/></svg></a>'
   +(POSTS.length>1?'<h2 class="sec">Yazılar</h2><div class="tags" role="group" aria-label="Konu">'+cats.map(function(t){return'<button aria-pressed="'+(t==filter)+'" data-t="'+t+'">'+t+'</button>'}).join('')+'</div>'
   +'<div class="cards" style="margin-top:16px">'+rest.map(function(p){return'<a class="card" href="#'+p.id+'" style="--th:'+C[p.th]+'"><span class="cat" style="align-self:flex-start">'+p.cat+'</span>'+ttl2(p)+'<p>'+esc(p.lead)+'</p><span class="meta">'+p.date+' · '+p.min+' dk</span></a>'}).join('')+'</div>'
   +'':'')+'<div class="bar"><span class="meta">Videolar ve canlı yayınlar için</span><div class="links"><a href="#yazilar">YouTube</a><a href="#yazilar">Kick</a></div></div>';
  app.querySelectorAll('.tags button').forEach(function(b){b.onclick=function(){filter=b.dataset.t;home()}});

function post(p){
  app.innerHTML='<div class="pw" style="--th:'+C[p.th]+'"><div class="toc" id="toc" role="navigation" aria-label="İçindekiler"></div><div class="post"><a class="back" href="#yazilar">← Yazılar</a><span class="cat">'+p.cat+'</span>'+ttl(p)+'<p class="lead">'+p.sub+' · '+p.date+' · '+p.min+' dk okuma</p><div class="rule"></div><div class="prose" id="prose">'+(p.html||md(p.body))+'</div></div></div>';
  buildToc();
}

function buildToc(){
  var pr=document.getElementById('prose'),toc=document.getElementById('toc');if(!pr||!toc)return;
  var hs=[].slice.call(pr.querySelectorAll('h2,h3,h4'));
  if(hs.length<2){toc.remove();document.querySelector('.pw').style.display='block';return}
  var top=Math.min.apply(0,hs.map(function(h){return +h.tagName[1]})),html='',stack=[],links=[];
  hs.forEach(function(h,i){
    if(!h.id)h.id='b'+(i+1);var lv=+h.tagName[1]-top;
    while(stack.length>lv+1){html+='</li></ul>';stack.pop()}
    if(stack.length==lv+1){html+='</li>'}
    while(stack.length<lv+1){html+='<ul>';stack.push(1)}
    html+='<li><a href="#" data-i="'+h.id+'">'+esc(h.textContent)+'</a>';
  });
  while(stack.length){html+='</li></ul>';stack.pop()}
  toc.innerHTML='<div class="toc-h"><b>İçindekiler</b><button type="button" id="tg">gizle</button></div>'+html;
  pr.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="#sec-"]');if(!a)return;e.preventDefault();var t=document.getElementById(a.getAttribute('href').slice(1));if(t)t.scrollIntoView({behavior:'smooth',block:'start'})});
  document.getElementById('tg').onclick=function(){var off=toc.classList.toggle('off');this.textContent=off?'göster':'gizle'};
  [].forEach.call(toc.querySelectorAll('.toc>ul>li'),function(li){if(li.querySelector('ul'))li.classList.add('has')});
  links=[].slice.call(toc.querySelectorAll('a'));
  links.forEach(function(a){a.onclick=function(e){e.preventDefault();var t=document.getElementById(a.dataset.i);t.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}});
  function act(){var cur=hs[0].id;hs.forEach(function(h){if(h.getBoundingClientRect().top<=80)cur=h.id});links.forEach(function(a){a.classList.toggle('on',a.dataset.i==cur)});
    [].forEach.call(toc.querySelectorAll('.toc>ul>li'),function(li){var on=li.querySelector('a.on');li.classList.toggle('open',!!on)})}
  window.removeEventListener('scroll',window._tocAct);window._tocAct=act;window.addEventListener('scroll',act,{passive:true});act();
}
function about(){
  app.innerHTML='<div class="post" style="--th:var(--gold)"><span class="cat">Hakkında</span><h1 class="title"><span class="l1">Ben</span><span class="l2">Ulmocus</span></h1><div class="rule" style="margin-top:20px"></div><div class="prose"><p>Çok yakında.</p></div></div>';
}
function route(){
  var h=location.hash.slice(1)||'yazilar';window.scrollTo(0,0);
  if(h=='yazilar')return home();if(h=='hakkinda')return about();
  var p=POSTS.filter(function(x){return x.id==h})[0];p?post(p):home();
}
window.addEventListener('hashchange',route);route();
</script>
