<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ulmocus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
/* Layout: dark channel-style masthead (gold category box, tall condensed titles cream + theme color), posts as theme-colored cards, single reading column. Dark-first; each post has its own theme color like the thumbnails. */
:root{
  --bg:#0c1311; --surface:#131d1a; --fg:#f1e8d4; --muted:#9aa89f; --line:#243430;
  --gold:#d4a84b; --gold-soft:#2a2414;
  --th-red:#d9483b; --th-green:#4aa86a; --th-blue:#4a86d9;
  --font-t:'Anton','Impact',sans-serif; --font-b:'Inter',system-ui,sans-serif; --font-r:'Newsreader',Georgia,serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3eee1; --surface:#fbf8ef; --fg:#1b2420; --muted:#66716a; --line:#dcd4bf;
  --gold:#8a6414; --gold-soft:#efe3c3;
  --th-red:#b3281c; --th-green:#237a45; --th-blue:#2a5fb0; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3eee1; --surface:#fbf8ef; --fg:#1b2420; --muted:#66716a; --line:#dcd4bf;
  --gold:#8a6414; --gold-soft:#efe3c3;
  --th-red:#b3281c; --th-green:#237a45; --th-blue:#2a5fb0; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:var(--font-t);font-size:28px;letter-spacing:.04em;text-transform:uppercase}
.logo span{color:var(--gold)}
nav{display:flex;gap:4px}
nav a{padding:6px 12px;color:var(--muted);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
nav a:hover{color:var(--gold)}
.cat{display:inline-block;border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:5px 10px}
.meta{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
main{padding:32px 0 8px}
.title{font-family:var(--font-t);font-weight:400;text-transform:uppercase;line-height:1.02;margin:0;text-wrap:balance}
.title .l1{display:block;color:var(--fg)}
.title .l2{display:block;color:var(--th)}
/* hero */
.hero{position:relative;display:block;overflow:hidden;border:1px solid var(--line);background:linear-gradient(120deg,color-mix(in srgb,var(--th) 22%,var(--surface)),var(--surface) 70%);padding:32px 28px 36px;min-height:300px}
.hero .title{font-size:clamp(40px,8vw,78px);margin:16px 0 14px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{font-family:var(--font-r);font-size:20px;max-width:46ch;margin:0 0 14px;color:var(--fg)}
.hero:hover .l2,.card:hover .l2{filter:brightness(1.15)}
.spark{position:absolute;left:0;right:0;bottom:0;height:90px;width:100%;opacity:.35;pointer-events:none}
.spark path{fill:none;stroke:var(--th);stroke-width:3}
.hero>*:not(.spark){position:relative}
h2.sec{font-family:var(--font-t);font-weight:400;font-size:22px;letter-spacing:.08em;text-transform:uppercase;margin:40px 0 14px;display:flex;align-items:center;gap:14px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:12px;min-width:0;border:1px solid var(--line);border-top:3px solid var(--th);background:var(--surface);padding:20px}
.card .title{font-size:30px}
.card p{margin:0;font-family:var(--font-r);font-size:17px;color:var(--muted)}
.card .meta{margin-top:auto}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tags button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.tags button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:40px}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links a{border:1px solid var(--line);padding:8px 14px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.links a:hover{border-color:var(--gold);color:var(--gold)}
/* post */
.post{max-width:680px;margin:0 auto}
.post .title{font-size:clamp(40px,8vw,68px);margin:16px 0 14px}
.post .lead{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 22px}
.post .rule{height:3px;width:72px;background:var(--th);margin-bottom:26px}
.prose{font-family:var(--font-r);font-size:20px;line-height:1.7}
.prose p{margin:0 0 1.1em}
.prose h3{font-family:var(--font-t);font-weight:400;font-size:28px;letter-spacing:.04em;text-transform:uppercase;margin:1.5em 0 .5em}
.prose blockquote{margin:1.4em 0;padding:0 0 0 18px;border-left:3px solid var(--th);color:var(--muted);font-style:italic}
.back{display:inline-block;margin-bottom:22px;color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.back:hover{color:var(--gold)}
footer{margin:56px 0 24px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;letter-spacing:.06em}
</style>

<div class="wrap">
  <header>
    <a class="logo" href="#yazilar">Ulmo<span>cus</span></a>
    <nav aria-label="Ana menü"><a href="#yazilar">Yazılar</a><a href="#hakkinda">Hakkında</a></nav>
  </header>
  <main id="app"></main>
  <footer>ULMOCUS</footer>
</div>

<script>
var C={red:'var(--th-red)',green:'var(--th-green)',blue:'var(--th-blue)'};
var POSTS=[
 {id:"sendika-sistemi",cat:"Ekonomi politikası",th:"blue",l1:"Yeni sendika",l2:"sistemi",sub:"Türkiye için bir tasarım",lead:"Herkese sendika hakkı tanıyan, parayı kazanımdan sonra alan ve işçiyi güçlü kurallarla koruyan bir model.",date:"19 Kasım 2026",min:9,
  body:[
  "Yeri zor doldurulan bir işçinin tek başına pazarlık gücü vardır: o ayrılırsa işveren zor durumda kalır. Yeri kolay doldurulan işçinin bu gücü yoktur. Onu ancak birlikte hareket etmek korur. Bu yazıda anlattığım sistem tam bu fikirden çıkıyor: sendika, pazarlık gücü olmayana güç vermek için vardır.",
  "## Kimler sendika kurabilir?",
  "Her meslekte ve her sektörde sendika kurulabilir. Memurlar dahil bütün çalışanlar üye olabilir. Sendikalaşmanın birimi tek tek meslekler değil, sektörlerdir. Bir sektörde usta da çırak da aynı sendikaya üye olur.",
  "Her sektörün tek bir sendikası vardır, ama bu sadece addır. Sendika kendi içinde marka ve şubelere bölünür. Her şube kendi zam kurulunu ve yönetimini seçer, kendi sözleşmesini yapabilir, kendi başına greve gidebilir. Karar gücü tek merkezde toplanmaz, işyerlerine dağılır.",
  "Sistemin ilk halinde sendika hakkı yalnızca yeri kolay doldurulan işçilerin yoğun olduğu sektörlere tanınıyordu. Bu kuralı kaldırdım. Eşiği geçemeyen sektörlerdeki herkesi, yeri kolay doldurulan işçiler dahil, sendikasız bırakıyordu.",
  "## Sendika parayı nereden bulur?",
  "Finansman üç kaynağa dayanır. Birincisi, sendikanın sabit giderlerini karşılayan küçük bir aidattır: personel, ofis, avukat, toplantı. Aidatı işçi her ay kendisi öder, işveren araya girmez.",
  "İkincisi kazanım payıdır. Üye, sendikanın ona kazandırdığı gerçek artışın yüzde 20'sini öder. Gerçek artış, zammın enflasyonun üstünde kalan kısmıdır. Zam enflasyonun altında kalırsa üye hiçbir şey ödemez. Yani asıl ödemeyi sendika ona gerçekten kazandırdıktan sonra yapar.",
  "Bir örnek: net ücreti 30.000 TL olan Ayşe yüzde 35 zam alıyor, enflasyon yüzde 30. Gerçek kazancı ayda yaklaşık 1.154 TL. Bunun yüzde 20'si, yani 231 TL kazanım payı olarak gidiyor. Kalan yaklaşık 923 TL her ay Ayşe'de kalıyor.",
  "Üçüncüsü giriş katkısıdır: yeni üye, net asgari ücretin yüzde 10'unu üç aya bölerek öder. Kazanım payı ve giriş katkısı sendikanın harcama bütçesine değil, doğrudan grev fonuna gider.",
  "Aidatı ödemeyenin hakları kademeli olarak kısıtlanır. Üç ay ödemeyenin oy hakkı askıya alınır, altı ay ödemeyen grev yardımı alamaz, on iki ay ödemeyenin üyeliği düşer.",
  "## Grevde işçiye ne olur?",
  "Grevde ücret ödenmez. Bu yüzden grev fonu var: grevdeki her üyeye her gün net asgari ücretin yarısı kadar yardım verilir. Fon, bütün üyelere otuz gün yardım verebilecek büyüklükte olmalıdır. Fon hedefe ulaşınca kazanım payı alınmaz, hedefin altına düşünce yeniden alınmaya başlar.",
  "Yardımı yalnızca aidat borcu olmayan üyeler alır. Grev kararından sonra üye olanlar o grevde yardım alamaz. Böylece kimse sadece yardım için son anda üye olamaz.",
  "## Kararlar nasıl alınır?",
  "Grev, toplu sözleşme ve zam talebi aynı kurallarla, üç seviyede alınır. Şubede oy kullananların çoğunluğu evet demeli ve evet oyları, oy hakkı olan tüm üyelerin en az yüzde 40'ı olmalı. Bu ikinci şart sayesinde oy kullanmamak grevi engellemeye yardım etmez. Grevi istemeyen kişi gidip hayır oyu vermelidir.",
  "Marka düzeyinde çifte çoğunluk aranır: şubelerin çoğunluğu ve markanın toplamı şartı sağlamalı. Sektör düzeyinde ise her markanın ağırlığı üye sayısının kareköküdür. Büyük marka daha fazla söz sahibi olur, ama üye sayısıyla orantılı olarak değil. Evet diyen markaların ağırlıklı oranı yüzde 40'a ulaşırsa sektör grevi başlar. Greve yalnızca evet diyen markalar gider.",
  "> Riski göze alanlar kazanımı alır. Başkaları greve gider, biz de kazanırız diye düşünmenin yolu kapanır.",
  "Sözleşmeler katmanlıdır. Sektör sözleşmesi bir taban oluşturur, marka ve şube sözleşmeleri bu tabanın altına inemez, sadece üstüne ekleme yapar. Oylama gizlidir. Cumhurbaşkanının grevi erteleme yetkisi kaldırılır. Hastane, su, elektrik gibi hayati hizmetlerde grev yapılabilir, ama asgari hizmeti sürdürecek kadar işçi çalışır.",
  "Sendikanın yönetimi de aynı şekilde yukarıdan değil üyelerden gelir. Her seviyede yönetimi üyeler doğrudan seçer, her yıl yönetimin yarısı yenilenir. Hesapları bağımsız denetçiler inceler, rapor iş mahkemesine sunulur ve üyelere açıktır.",
  "## İşçi nasıl korunur?",
  "Böyle bir sistemde en büyük tehlike, işverenin sendikalı işçileri kovup yerine başkasını almasıdır. Bunu engellemek için işyerinde ilk sendika üyeliği kaydedildiği andan itibaren üye bir işçiyi çıkarmak, Sendikal Koruma Kurulu'nun onayına bağlıdır. Kurul on beş günde karar verir ve karar verilene kadar işçi işinde kalır.",
  "Sendikal nedenle çıkarıldığı tespit edilen işçi işe geri alınır. İşveren tazminat ödeyerek bundan kurtulamaz. Çıkarmanın sendikal olmadığını da işveren kanıtlamak zorundadır.",
  "Grevdeki işçinin yerine işçi alan, işi başka yere kaydıran ya da başka şubelerden personel getiren işverene, bu şekilde yeri doldurulan her işçi için o işçinin bir yıllık ücreti kadar ceza kesilir. Bu yüzden işveren grevi göze almak yerine anlaşmayı tercih eder ve grevler kısa sürer.",
  "## Kayıt dışılık ve kurullar",
  "Kayıt dışı çalışan işçi istatistiklerde görünmez ve hiçbir korumadan yararlanamaz. Bu yüzden bir şirket hesabından aynı kişiye her ay birbirine yakın tutarlarda para gidiyorsa sistem bunu fark eder ve kişinin SGK kaydını kontrol eder. Kayıtsızsa durum Kayıt Dışılık Kurulu'na bildirilir. Karar otomatik verilmez, kurul inceler. Banka verisine yalnızca bu kurul erişir ve verilerin başka amaçla kullanılmadığını bağımsız bir veri denetçisi izler.",
  "Bütün bu kurulların kendisi de tarafsız olmak zorunda. Başkanlar ve uzman üyeler karşılıklı eleme yöntemiyle seçilir: sendikalar ve işveren örgütleri eşit sayıda aday önerir, her taraf karşı tarafın bazı adaylarını eler, kalanlar arasından kura çekilir. Görev süresi dört yıldır ve yenilenemez. Kurulların parası ortak bir fondan gelir, verdikleri cezalar kendilerine değil İşsizlik Sigortası Fonu'na gider.",
  "## Açık kalan sorular",
  "Sabit aidat oranının formülü hazır, ama kesin oran gerçek bir sendikanın giderleri ve üye sayısı belli olunca hesaplanabilir. Geri çağırma eşiği, görev süresi sınırı ve yönetim koltuklarının dağıtım yöntemi de henüz belirlenmedi. Sistemin uygulanması için Anayasa'nın 53, 54, 90, 139, 140 ve 159. maddeleri ile 6356, 4688, 657, 4857, 5510, 5549 ve 6698 sayılı kanunlarda değişiklik gerekiyor."
  ]}
];
var app=document.getElementById('app'),filter='Hepsi';
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function md(a){return a.map(function(b){if(b.indexOf('## ')==0)return'<h3>'+esc(b.slice(3))+'</h3>';if(b.indexOf('> ')==0)return'<blockquote>'+esc(b.slice(2))+'</blockquote>';return'<p>'+esc(b)+'</p>'}).join('')}
function ttl(p){return'<h1 class="title" style="--th:'+C[p.th]+'"><span class="l1">'+esc(p.l1)+'</span><span class="l2">'+esc(p.l2)+'</span></h1>'}
function ttl2(p){return'<h3 class="title" style="--th:'+C[p.th]+'"><span class="l1">'+esc(p.l1)+'</span><span class="l2">'+esc(p.l2)+'</span></h3>'}
function home(){
  if(!POSTS.length){app.innerHTML='<div class="post" style="--th:var(--gold);text-align:center;padding:60px 0"><span class="cat">Yakında</span><h1 class="title" style="margin-top:20px"><span class="l1">İlk yazı</span><span class="l2">yolda</span></h1></div>';return}
  var h=POSTS[0],cats=['Hepsi'].concat(POSTS.map(function(p){return p.cat}).filter(function(t,i,a){return a.indexOf(t)==i}));
  var rest=POSTS.slice(1).filter(function(p){return filter=='Hepsi'||p.cat==filter});
  app.innerHTML='<a class="hero" href="#'+h.id+'" style="--th:'+C[h.th]+'"><span class="cat">'+h.cat+'</span>'+ttl(h)+'<p>'+esc(h.lead)+'</p><span class="meta">'+h.sub+' · '+h.date+' · '+h.min+' dk</span>'
   +'<svg class="spark" viewBox="0 0 600 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10 L60 14 L120 22 L180 20 L240 36 L300 44 L360 52 L420 50 L480 70 L540 76 L600 84"/></svg></a>'
   +'<h2 class="sec">Yazılar</h2><div class="tags" role="group" aria-label="Konu">'+cats.map(function(t){return'<button aria-pressed="'+(t==filter)+'" data-t="'+t+'">'+t+'</button>'}).join('')+'</div>'
   +'<div class="cards" style="margin-top:16px">'+rest.map(function(p){return'<a class="card" href="#'+p.id+'" style="--th:'+C[p.th]+'"><span class="cat" style="align-self:flex-start">'+p.cat+'</span>'+ttl2(p)+'<p>'+esc(p.lead)+'</p><span class="meta">'+p.date+' · '+p.min+' dk</span></a>'}).join('')+'</div>'
   +'<div class="bar"><span class="meta">Videolar ve canlı yayınlar için</span><div class="links"><a href="#yazilar">YouTube</a><a href="#yazilar">Kick</a></div></div>';
  app.querySelectorAll('.tags button').forEach(function(b){b.onclick=function(){filter=b.dataset.t;home()}});
}
function post(p){
  app.innerHTML='<div class="post" style="--th:'+C[p.th]+'"><a class="back" href="#yazilar">← Yazılar</a><span class="cat">'+p.cat+'</span>'+ttl(p)+'<p class="lead">'+p.sub+' · '+p.date+' · '+p.min+' dk okuma</p><div class="rule"></div><div class="prose">'+md(p.body)+'</div></div>';
}
function about(){
  app.innerHTML='<div class="post" style="--th:var(--gold)"><span class="cat">Hakkında</span><h1 class="title"><span class="l1">Ben</span><span class="l2">Ulmocus</span></h1><div class="rule" style="margin-top:20px"></div><div class="prose"><p>Çok yakında.</p></div></div>';
}
function route(){
  var h=location.hash.slice(1)||'yazilar';window.scrollTo(0,0);
  if(h=='yazilar')return home();if(h=='hakkinda')return about();
  var p=POSTS.filter(function(x){return x.id==h})[0];p?post(p):home();
}
window.addEventListener('hashchange',route);route();
</script>
