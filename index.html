 olmayan miras</td>\n<td>Geleneksel sanatları kayıt altına alır ve destekler.</td>\n</tr>\n<tr>\n<td>KT-16</td>\n<td>Turizm tanıtımı</td>\n<td>Yurt dışında Türkiye reklamı yapar (Türkiye Turizm Tanıtım ve Geliştirme Ajansı).</td>\n</tr>\n<tr>\n<td>KT-17</td>\n<td>Turizm tesis belgeleri</td>\n<td>Otellere belge ve yıldız verir, otelleri denetler.</td>\n</tr>\n<tr>\n<td>KT-18</td>\n<td>Turizm için arazi tahsisi</td>\n<td>Hazine arazilerini turizm yatırımcılarına uzun süreli kiralar.</td>\n</tr>\n<tr>\n<td>KT-19</td>\n<td>Seyahat acenteleri ve rehberlik</td>\n<td>Acentelere ve turist rehberlerine belge verir.</td>\n</tr>\n<tr>\n<td>KT-20</td>\n<td>Yurtdışı Türkler (YTB)</td>\n<td>Yurt dışındaki Türklere hizmet verir, yabancı öğrencilere Türkiye Bursları verir.</td>\n</tr>\n<tr>\n<td>KT-21</td>\n<td>Dış yardım (TİKA)</td>\n<td>Yabancı ülkelerde kalkınma projeleri yapar.</td>\n</tr>\n</tbody></table>\n<h4>Diyanet İşleri Başkanlığı (D)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>D-1</td>\n<td>Cami personeli</td>\n<td>İmam, müezzin ve vaizleri atar, maaşlarını öder.</td>\n</tr>\n<tr>\n<td>D-2</td>\n<td>Hutbeler</td>\n<td>Cuma hutbelerini merkezden hazırlar.</td>\n</tr>\n<tr>\n<td>D-3</td>\n<td>Kuran kursları</td>\n<td>Çocuklar ve yetişkinler için Kuran kursları açar.</td>\n</tr>\n<tr>\n<td>D-4</td>\n<td>Fetva ve din danışmanlığı</td>\n<td>Din İşleri Yüksek Kurulu fetva verir, ALO 190 hattını işletir.</td>\n</tr>\n<tr>\n<td>D-5</td>\n<td>Hac ve umre</td>\n<td>Hac ve umre organizasyonları düzenler.</td>\n</tr>\n<tr>\n<td>D-6</td>\n<td>Yurt dışı din hizmetleri</td>\n<td>Yurt dışındaki camilere imam gönderir (DİTİB vb.).</td>\n</tr>\n<tr>\n<td>D-7</td>\n<td>Yayın ve medya</td>\n<td>Diyanet Yayınları ve Diyanet TV&#39;yi yürütür.</td>\n</tr>\n<tr>\n<td>D-8</td>\n<td>Manevi danışmanlık</td>\n<td>Hastane, cezaevi ve huzurevlerinde manevi danışmanlık verir, aile irşat bürolarını işletir.</td>\n</tr>\n<tr>\n<td>D-9</td>\n<td>Mushaf denetimi</td>\n<td>Basılan Kuranları inceler ve onaylar.</td>\n</tr>\n<tr>\n<td>D-10</td>\n<td>Dini takvim</td>\n<td>Namaz vakitlerini ve dini günleri belirler.</td>\n</tr>\n<tr>\n<td>D-11</td>\n<td>Türkiye Diyanet Vakfı</td>\n<td>Vekaletle kurban, burs ve yardım faaliyetleri yürütür.</td>\n</tr>\n</tbody></table>\n<hr>\n<h3>Bahsetmediğin bakanlıklar</h3>\n<h4>Adalet Bakanlığı (A)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A-1</td>\n<td>Mahkemelerin idaresi</td>\n<td>Adliye binalarını ve personelini yönetir. Hakim atamasını HSK yapar.</td>\n</tr>\n<tr>\n<td>A-2</td>\n<td>Cezaevleri</td>\n<td>Ceza infaz kurumlarını işletir.</td>\n</tr>\n<tr>\n<td>A-3</td>\n<td>Denetimli serbestlik</td>\n<td>Cezaevi dışındaki hükümlüleri takip eder.</td>\n</tr>\n<tr>\n<td>A-4</td>\n<td>Adli Tıp</td>\n<td>Mahkemeler için adli tıp raporları hazırlar.</td>\n</tr>\n<tr>\n<td>A-5</td>\n<td>İcra daireleri</td>\n<td>Borç tahsilatı işlemlerini yürütür.</td>\n</tr>\n<tr>\n<td>A-6</td>\n<td>Arabuluculuk ve uzlaştırma</td>\n<td>Arabulucuları belgelendirir, zorunlu arabuluculuğu yürütür.</td>\n</tr>\n<tr>\n<td>A-7</td>\n<td>Noterlik</td>\n<td>Noterlik sistemini düzenler, noter sayısını sınırlar.</td>\n</tr>\n<tr>\n<td>A-8</td>\n<td>Avukatlık</td>\n<td>Avukatlık mesleğini düzenler.</td>\n</tr>\n<tr>\n<td>A-9</td>\n<td>Bilirkişilik</td>\n<td>Bilirkişileri belgelendirir.</td>\n</tr>\n<tr>\n<td>A-10</td>\n<td>Adli sicil</td>\n<td>Sabıka kayıtlarını tutar.</td>\n</tr>\n<tr>\n<td>A-11</td>\n<td>Adalet Akademisi</td>\n<td>Hakim ve savcı adaylarını eğitir.</td>\n</tr>\n<tr>\n<td>A-12</td>\n<td>UYAP</td>\n<td>Yargının bilişim sistemini işletir.</td>\n</tr>\n<tr>\n<td>A-13</td>\n<td>Uluslararası adli işbirliği</td>\n<td>Suçlu iadesi ve yabancı ülkelerle adli yardımlaşmayı yürütür.</td>\n</tr>\n<tr>\n<td>A-14</td>\n<td>Mevzuat hazırlığı</td>\n<td>Kanun taslaklarını hazırlar.</td>\n</tr>\n</tbody></table>\n<h4>Aile ve Sosyal Hizmetler Bakanlığı (AS)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>AS-1</td>\n<td>Muhtaç ailelere yardım</td>\n<td>Sosyal Yardımlaşma Vakıfları aracılığıyla nakdi ve ayni yardım yapar.</td>\n</tr>\n<tr>\n<td>AS-2</td>\n<td>Engelli aylığı</td>\n<td>Muhtaç engellilere aylık bağlar.</td>\n</tr>\n<tr>\n<td>AS-3</td>\n<td>Evde bakım maaşı</td>\n<td>Engelli yakınına bakanlara maaş öder.</td>\n</tr>\n<tr>\n<td>AS-4</td>\n<td>65 yaş aylığı</td>\n<td>Geliri olmayan yaşlılara aylık bağlar.</td>\n</tr>\n<tr>\n<td>AS-5</td>\n<td>Şartlı nakit transferi</td>\n<td>Çocuğunu okula gönderen ve aşılatan yoksul ailelere ödeme yapar.</td>\n</tr>\n<tr>\n<td>AS-6</td>\n<td>Doğum yardımı</td>\n<td>Doğum yapan annelere tek seferlik ödeme yapar.</td>\n</tr>\n<tr>\n<td>AS-7</td>\n<td>Çocuk koruma</td>\n<td>Sevgi evleri, çocuk evleri, koruyucu aile ve evlat edinme işlerini yürütür.</td>\n</tr>\n<tr>\n<td>AS-8</td>\n<td>Kadın konukevleri ve ŞÖNİM</td>\n<td>Şiddet gören kadınlar için sığınma evleri ve şiddet önleme merkezleri işletir.</td>\n</tr>\n<tr>\n<td>AS-9</td>\n<td>Huzurevleri</td>\n<td>Devlet huzurevlerini işletir.</td>\n</tr>\n<tr>\n<td>AS-10</td>\n<td>Engelli bakım merkezleri</td>\n<td>Devlet bakım merkezlerini işletir, özel bakım merkezlerine para öder.</td>\n</tr>\n<tr>\n<td>AS-11</td>\n<td>Aile eğitimi</td>\n<td>Evlilik öncesi ve aile eğitim programları yürütür.</td>\n</tr>\n<tr>\n<td>AS-12</td>\n<td>Şehit yakınları ve gaziler</td>\n<td>Şehit yakınlarına ve gazilere hak ve hizmet sağlar.</td>\n</tr>\n<tr>\n<td>AS-13</td>\n<td>Erişilebilirlik denetimi</td>\n<td>Binaların engellilere uygunluğunu denetler.</td>\n</tr>\n</tbody></table>\n<h4>Çalışma ve Sosyal Güvenlik Bakanlığı (ÇS)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>ÇS-1</td>\n<td>SGK: emeklilik</td>\n<td>Zorunlu emeklilik sigortasını yürütür, emekli maaşlarını öder.</td>\n</tr>\n<tr>\n<td>ÇS-2</td>\n<td>SGK: genel sağlık sigortası</td>\n<td>Zorunlu sağlık sigortasını yürütür, hastanelere ödeme yapar.</td>\n</tr>\n<tr>\n<td>ÇS-3</td>\n<td>İŞKUR: iş arama</td>\n<td>İş arayanlarla işverenleri buluşturur.</td>\n</tr>\n<tr>\n<td>ÇS-4</td>\n<td>İşsizlik sigortası</td>\n<td>İşini kaybedenlere ödeme yapar.</td>\n</tr>\n<tr>\n<td>ÇS-5</td>\n<td>Meslek kursları ve işbaşı eğitimi</td>\n<td>İşsizlere kurs açar, işbaşı eğitiminde ücretlerini öder.</td>\n</tr>\n<tr>\n<td>ÇS-6</td>\n<td>Toplum Yararına Programlar (TYP)</td>\n<td>İşsizleri geçici olarak kamu işlerinde çalıştırır.</td>\n</tr>\n<tr>\n<td>ÇS-7</td>\n<td>İstihdam teşvikleri</td>\n<td>İşverenlerin SGK primlerinin bir kısmını üstlenir.</td>\n</tr>\n<tr>\n<td>ÇS-8</td>\n<td>Asgari ücret</td>\n<td>Asgari Ücret Tespit Komisyonunu yürütür.</td>\n</tr>\n<tr>\n<td>ÇS-9</td>\n<td>Sendikal ilişkiler</td>\n<td>İşkolu tespiti, sendika üyelik istatistikleri ve toplu sözleşme yetkisi işlerini yürütür. Sendika Sistemi ile bağlantılı.</td>\n</tr>\n<tr>\n<td>ÇS-10</td>\n<td>Memur toplu sözleşmesi</td>\n<td>Kamu görevlileriyle toplu sözleşme pazarlığını yürütür.</td>\n</tr>\n<tr>\n<td>ÇS-11</td>\n<td>İş sağlığı ve güvenliği</td>\n<td>Kuralları koyar, iş güvenliği uzmanlarını belgelendirir.</td>\n</tr>\n<tr>\n<td>ÇS-12</td>\n<td>İş teftişi</td>\n<td>İşyerlerini denetler.</td>\n</tr>\n<tr>\n<td>ÇS-13</td>\n<td>Yabancılara çalışma izni</td>\n<td>Yabancıların Türkiye&#39;de çalışmasına izin verir.</td>\n</tr>\n<tr>\n<td>ÇS-14</td>\n<td>Mesleki Yeterlilik Kurumu</td>\n<td>Bazı meslekler için zorunlu belge verir.</td>\n</tr>\n</tbody></table>\n<h4>Çevre, Şehircilik ve İklim Değişikliği Bakanlığı (ÇŞ)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>ÇŞ-1</td>\n<td>İmar planları</td>\n<td>Belediyelerin imar planlarını onaylar, bazı alanlarda kendisi plan yapar.</td>\n</tr>\n<tr>\n<td>ÇŞ-2</td>\n<td>Yapı denetimi</td>\n<td>Bina inşaatlarının denetim sistemini yürütür.</td>\n</tr>\n<tr>\n<td>ÇŞ-3</td>\n<td>Kentsel dönüşüm</td>\n<td>Riskli yapıları tespit eder, dönüşüm projelerini yürütür ve finanse eder.</td>\n</tr>\n<tr>\n<td>ÇŞ-4</td>\n<td>TOKİ</td>\n<td>Sosyal konut ve gelir paylaşımlı konut projeleri yapar.</td>\n</tr>\n<tr>\n<td>ÇŞ-5</td>\n<td>Afet konutları</td>\n<td>Deprem bölgelerine konut yapar.</td>\n</tr>\n<tr>\n<td>ÇŞ-6</td>\n<td>Milli Emlak</td>\n<td>Hazine arazilerini yönetir, satar ve kiralar.</td>\n</tr>\n<tr>\n<td>ÇŞ-7</td>\n<td>Tapu ve Kadastro</td>\n<td>Tapu kayıtlarını tutar, alım satım işlemlerini yapar.</td>\n</tr>\n<tr>\n<td>ÇŞ-8</td>\n<td>İller Bankası</td>\n<td>Belediyelere altyapı kredisi verir.</td>\n</tr>\n<tr>\n<td>ÇŞ-9</td>\n<td>ÇED ve çevre izinleri</td>\n<td>Projelerin çevresel etki değerlendirmesini yapar.</td>\n</tr>\n<tr>\n<td>ÇŞ-10</td>\n<td>Atık yönetimi</td>\n<td>Sıfır Atık projesini ve atık tesisi izinlerini yürütür.</td>\n</tr>\n<tr>\n<td>ÇŞ-11</td>\n<td>Hava ve su kalitesi</td>\n<td>Kirliliği ölçer ve denetler.</td>\n</tr>\n<tr>\n<td>ÇŞ-12</td>\n<td>İklim politikası</td>\n<td>Emisyon hedeflerini ve karbon piyasası düzenlemelerini hazırlar.</td>\n</tr>\n<tr>\n<td>ÇŞ-13</td>\n<td>Özel çevre koruma bölgeleri</td>\n<td>Bu bölgelerde yapılaşmayı sınırlar.</td>\n</tr>\n<tr>\n<td>ÇŞ-14</td>\n<td>Malzeme ve müteahhit denetimi</td>\n<td>Yapı malzemelerini denetler, müteahhitleri belgelendirir.</td>\n</tr>\n</tbody></table>\n<h4>Dışişleri Bakanlığı (DŞ)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>DŞ-1</td>\n<td>Büyükelçilik ve konsolosluklar</td>\n<td>Yurt dışındaki temsilcilikleri işletir.</td>\n</tr>\n<tr>\n<td>DŞ-2</td>\n<td>Diplomasi ve antlaşmalar</td>\n<td>Yabancı devletlerle ilişkileri yürütür, antlaşmaları müzakere eder.</td>\n</tr>\n<tr>\n<td>DŞ-3</td>\n<td>Konsolosluk hizmetleri</td>\n<td>Yurt dışındaki vatandaşlara hizmet verir, yabancılara vize verir.</td>\n</tr>\n<tr>\n<td>DŞ-4</td>\n<td>Uluslararası Belediyelerin denetimi</td>\n<td>Belediyeleri denetler, kayyum atar.</td>\n</tr>\n<tr>\n<td>İ-9</td>\n<td>Dernekler</td>\n<td>Derneklerin kaydını tutar ve onları denetler.</td>\n</tr>\n<tr>\n<td>İ-10</td>\n<td>Silah ruhsatı ve özel güvenlik</td>\n<td>Silah ruhsatı ve özel güvenlik kimliği verir.</td>\n</tr>\n<tr>\n<td>İ-11</td>\n<td>Terörle mücadele</td>\n<td>Güvenlik operasyonlarını yürütür.</td>\n</tr>\n<tr>\n<td>İ-12</td>\n<td>Trafik denetimi</td>\n<td>Karayollarında trafik denetimi yapar.</td>\n</tr>\n<tr>\n<td>İ-13</td>\n<td>Köy altyapısı</td>\n<td>Valilikler aracılığıyla köylere yol ve su götürür.</td>\n</tr>\n</tbody></table>\n<h4>Milli Eğitim Bakanlığı (ME)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>ME-1</td>\n<td>Devlet okulları</td>\n<td>Okul öncesinden liseye kadar devlet okullarını işletir.</td>\n</tr>\n<tr>\n<td>ME-2</td>\n<td>Öğretmen atama</td>\n<td>Öğretmenleri istihdam eder ve atar.</td>\n</tr>\n<tr>\n<td>ME-3</td>\n<td>Müfredat</td>\n<td>Bütün okullarda zorunlu müfredatı belirler (Talim ve Terbiye Kurulu).</td>\n</tr>\n<tr>\n<td>ME-4</td>\n<td>Ders kitapları</td>\n<td>Ders kitaplarını onaylar, ücretsiz kitap dağıtır.</td>\n</tr>\n<tr>\n<td>ME-5</td>\n<td>Özel okullar</td>\n<td>Özel okulları denetler, özel okul öğrencilerine destek verir.</td>\n</tr>\n<tr>\n<td>ME-6</td>\n<td>Mesleki ve teknik eğitim</td>\n<td>Meslek liselerini işletir.</td>\n</tr>\n<tr>\n<td>ME-7</td>\n<td>Din eğitimi</td>\n<td>İmam hatip okullarını işletir, zorunlu din kültürü dersini yürütür.</td>\n</tr>\n<tr>\n<td>ME-8</td>\n<td>Halk eğitim merkezleri</td>\n<td>Yetişkinlere ücretsiz kurs açar.</td>\n</tr>\n<tr>\n<td>ME-9</td>\n<td>Açık öğretim</td>\n<td>Uzaktan lise eğitimi verir.</td>\n</tr>\n<tr>\n<td>ME-10</td>\n<td>Özel eğitim ve rehberlik</td>\n<td>Engelli öğrencilerin eğitimini ve rehberlik araştırma merkezlerini (RAM) yürütür.</td>\n</tr>\n<tr>\n<td>ME-11</td>\n<td>Yatılılık</td>\n<td>Parasız yatılı okullar ve pansiyonlar işletir.</td>\n</tr>\n<tr>\n<td>ME-12</td>\n<td>Taşımalı eğitim</td>\n<td>Köylerdeki öğrencileri okula taşır.</td>\n</tr>\n<tr>\n<td>ME-13</td>\n<td>Okul binaları</td>\n<td>Okul inşa eder.</td>\n</tr>\n<tr>\n<td>ME-14</td>\n<td>Yurt dışı burslar</td>\n<td>Yurt dışında lisansüstü eğitim için burs verir (YLSY).</td>\n</tr>\n<tr>\n<td>ME-15</td>\n<td>Merkezi sınavlar</td>\n<td>LGS gibi sınavları yapar.</td>\n</tr>\n</tbody></table>\n<blockquote class=\"callout note\"><p class=\"ct\">Not</p><p>Üniversiteler Milli Eğitim Bakanlığına bağlı değildir. YÖK ve ÖSYM ayrı kurumlardır.</p>\n</blockquote>\n<h4>Milli Savunma Bakanlığı (MS)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>MS-1</td>\n<td>Silahlı Kuvvetler</td>\n<td>Kara, Deniz ve Hava Kuvvetlerini yönetir.</td>\n</tr>\n<tr>\n<td>MS-2</td>\n<td>Zorunlu askerlik</td>\n<td>Askerlik yoklamasını, sevkleri ve bedelli askerliği yürütür.</td>\n</tr>\n<tr>\n<td>MS-3</td>\n<td>Askeri okullar</td>\n<td>Milli Savunma Üniversitesi ve askeri liseleri işletir.</td>\n</tr>\n<tr>\n<td>MS-4</td>\n<td>Askeri fabrikalar</td>\n<td>MKE ve ASFAT gibi devlet savunma şirketlerini yönetir.</td>\n</tr>\n<tr>\n<td>MS-5</td>\n<td>Harita Genel Müdürlüğü</td>\n<td>Ülkenin resmi haritalarını üretir.</td>\n</tr>\n<tr>\n<td>MS-6</td>\n<td>Orduevleri ve lojmanlar</td>\n<td>Askeri sosyal tesisleri ve lojmanları işletir.</td>\n</tr>\n<tr>\n<td>MS-7</td>\n<td>Uluslararası askeri işbirliği</td>\n<td>NATO görevlerini ve yurt dışı operasyonları yürütür.</td>\n</tr>\n</tbody></table>\n<h4>Sağlık Bakanlığı (S)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>S-1</td>\n<td>Devlet hastaneleri</td>\n<td>Devlet ve şehir hastanelerini işletir. Şehir hastaneleri kamu-özel işbirliği modeliyle yapılmıştır.</td>\n</tr>\n<tr>\n<td>S-2</td>\n<td>Aile hekimliği</td>\n<td>Birinci basamak sağlık hizmetini verir.</td>\n</tr>\n<tr>\n<td>S-3</td>\n<td>Ağız ve diş sağlığı merkezleri</td>\n<td>Devlet diş kliniklerini işletir.</td>\n</tr>\n<tr>\n<td>S-4</td>\n<td>112 Acil</td>\n<td>Ambulans ve acil hizmetleri yürütür.</td>\n</tr>\n<tr>\n<td>S-5</td>\n<td>Aşı programı</td>\n<td>Zorunlu çocukluk aşılarını yapar.</td>\n</tr>\n<tr>\n<td>S-6</td>\n<td>Halk sağlığı</td>\n<td>Bulaşıcı hastalıklarla mücadele eder, tütün ve alkol kontrol politikalarını yürütür.</td>\n</tr>\n<tr>\n<td>S-7</td>\n<td>İlaç ruhsatı</td>\n<td>İlaç ve tıbbi cihazlara ruhsat verir (TİTCK).</td>\n</tr>\n<tr>\n<td>S-8</td>\n<td>İlaç fiyat kontrolü</td>\n<td>İlaç fiyatlarını belirler.</td>\n</tr>\n<tr>\n<td>S-9</td>\n<td>Kozmetik denetimi</td>\n<td>Kozmetik ürünleri denetler.</td>\n</tr>\n<tr>\n<td>S-10</td>\n<td>Özel hastane izinleri</td>\n<td>Özel hastane açılışına izin verir, kadro sayısını sınırlar.</td>\n</tr>\n<tr>\n<td>S-11</td>\n<td>Sağlık personeli</td>\n<td>Doktor ve hemşireleri atar, zorunlu hizmeti yürütür.</td>\n</tr>\n<tr>\n<td>S-12</td>\n<td>Organ nakli</td>\n<td>Organ bağışı ve nakil sistemini koordine eder.</td>\n</tr>\n<tr>\n<td>S-13</td>\n<td>Sağlık turizmi</td>\n<td>Yabancı hastaları çekmek için teşvik verir.</td>\n</tr>\n<tr>\n<td>S-14</td>\n<td>Sağlık araştırmaları</td>\n<td>Sağlık enstitülerini yürütür (TÜSEB).</td>\n</tr>\n</tbody></table>\n<h4>Sanayi ve Teknoloji Bakanlığı (ST)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>ST-1</td>\n<td>Yatırım teşvikleri</td>\n<td>Teşvik belgesiyle vergi indirimi, arazi ve faiz desteği verir.</td>\n</tr>\n<tr>\n<td>ST-2</td>\n<td>KOSGEB</td>\n<td>Küçük ve orta işletmelere hibe ve kredi desteği verir.</td>\n</tr>\n<tr>\n<td>ST-3</td>\n<td>TÜBİTAK</td>\n<td>Bilimsel araştırmayı finanse eder, araştırma enstitülerini işletir.</td>\n</tr>\n<tr>\n<td>ST-4</td>\n<td>Organize sanayi bölgeleri</td>\n<td>OSB&#39;leri kurar ve destekler.</td>\n</tr>\n<tr>\n<td>ST-5</td>\n<td>Teknoparklar</td>\n<td>Teknoloji geliştirme bölgelerine vergi muafiyeti sağlar.</td>\n</tr>\n<tr>\n<td>ST-6</td>\n<td>Kalkınma ajansları</td>\n<td>Bölgesel hibe programları yürütür.</td>\n</tr>\n<tr>\n<td>ST-7</td>\n<td>Bölgesel kalkınma idareleri</td>\n<td>GAP, DAP, KOP ve DOKAP bölgelerinde kalkınma projeleri yürütür.</td>\n</tr>\n<tr>\n<td>ST-8</td>\n<td>Türk Patent</td>\n<td>Patent ve marka tescili yapar.</td>\n</tr>\n<tr>\n<td>ST-9</td>\n<td>TSE</td>\n<td>Standartları belirler, belgelendirme yapar.</td>\n</tr>\n<tr>\n<td>ST-10</td>\n<td>Piyasa gözetimi</td>\n<td>Ürün güvenliğini denetler.</td>\n</tr>\n<tr>\n<td>ST-11</td>\n<td>Metroloji</td>\n<td>Ölçü aletlerini denetler.</td>\n</tr>\n<tr>\n<td>ST-12</td>\n<td>TÜRKAK</td>\n<td>Akreditasyon yapar.</td>\n</tr>\n<tr>\n<td>ST-13</td>\n<td>Türkiye Uzay Ajansı</td>\n<td>Uzay programını yürütür.</td>\n</tr>\n<tr>\n<td>ST-14</td>\n<td>Stratejik yatırımlar</td>\n<td>Yerli otomobil gibi seçilmiş projelere özel destek verir.</td>\n</tr>\n</tbody></table>\n<h4>Tarım ve Orman Bakanlığı (T)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>T-1</td>\n<td>Tarımsal destekler</td>\n<td>Çiftçilere alan bazlı, mazot, gübre ve hayvan başına destek ödemesi yapar.</td>\n</tr>\n<tr>\n<td>T-2</td>\n<td>TMO</td>\n<td>Buğday ve diğer tahılları alır, alım fiyatlarını belirler, stok tutar.</td>\n</tr>\n<tr>\n<td>T-3</td>\n<td>Et ve Süt Kurumu</td>\n<td>Et ve süt piyasasına müdahale eder.</td>\n</tr>\n<tr>\n<td>T-4</td>\n<td>TİGEM</td>\n<td>Devlet çiftliklerini işletir.</td>\n</tr>\n<tr>\n<td>T-5</td>\n<td>Tarım sigortası (TARSİM)</td>\n<td>Tarım sigortası primlerinin bir kısmını öder.</td>\n</tr>\n<tr>\n<td>T-6</td>\n<td>Kırsal kalkınma hibeleri</td>\n<td>Kırsal yatırımlara hibe verir.</td>\n</tr>\n<tr>\n<td>T-7</td>\n<td>Gıda denetimi</td>\n<td>Gıda üretim ve satışını denetler.</td>\n</tr>\n<tr>\n<td>T-8</td>\n<td>Veteriner hizmetleri</td>\n<td>Hayvan hastalıklarıyla mücadele eder, hayvanları kayıt altına alır.</td>\n</tr>\n<tr>\n<td>T-9</td>\n<td>Tohum ve bitki sağlığı</td>\n<td>Tohum sertifikasyonu ve zirai karantina işlerini yürütür.</td>\n</tr>\n<tr>\n<td>T-10</td>\n<td>Balıkçılık</td>\n<td>Avlanma yasaklarını ve balıkçılık lisanslarını düzenler.</td>\n</tr>\n<tr>\n<td>T-11</td>\n<td>Orman Genel Müdürlüğü</td>\n<td>Devlet ormanlarını işletir, ağaçlandırma ve yangınla mücadele yapar.</td>\n</tr>\n<tr>\n<td>T-12</td>\n<td>Milli parklar</td>\n<td>Milli parkları ve koruma alanlarını yönetir.</td>\n</tr>\n<tr>\n<td>T-13</td>\n<td>Sokak ve yaban hayvanları</td>\n<td>Hayvan hakları ve av düzenlemelerini yapar.</td>\n</tr>\n<tr>\n<td>T-14</td>\n<td>DSİ</td>\n<td>Baraj ve sulama kanalı yapar, su kaynaklarını yönetir.</td>\n</tr>\n<tr>\n<td>T-15</td>\n<td>Meteoroloji</td>\n<td>Hava tahmini yapar.</td>\n</tr>\n<tr>\n<td>T-16</td>\n<td>Tarımsal araştırma</td>\n<td>Tarımsal araştırma enstitülerini işletir (TAGEM).</td>\n</tr>\n</tbody></table>\n<h4>Ticaret Bakanlığı (TC)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>TC-1</td>\n<td>Gümrükler</td>\n<td>Gümrük kapılarını ve gümrük işlemlerini yürütür.</td>\n</tr>\n<tr>\n<td>TC-2</td>\n<td>İthalat düzenlemeleri</td>\n<td>Ek gümrük vergileri, kotalar ve anti-damping önlemleri uygular.</td>\n</tr>\n<tr>\n<td>TC-3</td>\n<td>İhracat destekleri</td>\n<td>İhracatçılara fuar ve tanıtım desteği verir (Turquality).</td>\n</tr>\n<tr>\n<td>TC-4</td>\n<td>Serbest bölgeler</td>\n<td>Vergi muafiyetli serbest bölgeleri yönetir.</td>\n</tr>\n<tr>\n<td>TC-5</td>\n<td>Ticaret müşavirleri</td>\n<td>Yurt dışında ticari temsilcilik yapar.</td>\n</tr>\n<tr>\n<td>TC-6</td>\n<td>Tüketicinin korunması</td>\n<td>Tüketici hakem heyetlerini ve Reklam Kurulunu yürütür.</td>\n</tr>\n<tr>\n<td>TC-7</td>\n<td>Fiyat denetimi</td>\n<td>Haksız fiyat artışlarını denetler ve ceza keser.</td>\n</tr>\n<tr>\n<td>TC-8</td>\n<td>Ticaret sicili</td>\n<td>Şirket kuruluşlarının kaydını tutar (MERSİS).</td>\n</tr>\n<tr>\n<td>TC-9</td>\n<td>Kooperatifler</td>\n<td>Kooperatifleri denetler ve destekler.</td>\n</tr>\n<tr>\n<td>TC-10</td>\n<td>Esnaf ve sanatkarlar</td>\n<td>Esnafa kredi ve destek sağlar.</td>\n</tr>\n<tr>\n<td>TC-11</td>\n<td>Haller</td>\n<td>Toptancı hallerini ve hal kayıt sistemini düzenler.</td>\n</tr>\n<tr>\n<td>TC-12</td>\n<td>Lisanslı depoculuk</td>\n<td>Ürün depolama sistemini düzenler.</td>\n</tr>\n<tr>\n<td>TC-13</td>\n<td>Odalar ve borsalar</td>\n<td>TOBB ve odaları denetler.</td>\n</tr>\n</tbody></table>\n<h4>Ulaştırma ve Altyapı Bakanlığı (U)</h4>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>U-1</td>\n<td>Karayolları</td>\n<td>Otoyol, devlet yolu ve köprü yapar.</td>\n</tr>\n<tr>\n<td>U-2</td>\n<td>Garantili projeler</td>\n<td>Köprü, otoyol ve havalimanı projelerine geçiş ve yolcu garantisi verir.</td>\n</tr>\n<tr>\n<td>U-3</td>\n<td>TCDD</td>\n<td>Demiryolu altyapısını ve tren taşımacılığını yürütür.</td>\n</tr>\n<tr>\n<td>U-4</td>\n<td>DHMİ</td>\n<td>Devlet havalimanlarını işletir, hava trafik kontrolünü yapar.</td>\n</tr>\n<tr>\n<td>U-5</td>\n<td>Sivil havacılık</td>\n<td>Havayollarına ve pilotlara lisans verir.</td>\n</tr>\n<tr>\n<td>U-6</td>\n<td>Denizcilik</td>\n<td>Gemi sicilini, liman ve kılavuzluk işlerini düzenler.</td>\n</tr>\n<tr>\n<td>U-7</td>\n<td>Kıyı Emniyeti</td>\n<td>Deniz güvenliği ve kurtarma işlerini yürütür.</td>\n</tr>\n<tr>\n<td>U-8</td>\n<td>Kara taşımacılığı belgeleri</td>\n<td>Yolcu ve yük taşımacılığı için yetki belgesi verir.</td>\n</tr>\n<tr>\n<td>U-9</td>\n<td>PTT</td>\n<td>Posta, kargo ve bankacılık hizmeti verir.</td>\n</tr>\n<tr>\n<td>U-10</td>\n<td>Türksat</td>\n<td>Uydu hizmeti verir, e-Devlet&#39;i işletir.</td>\n</tr>\n<tr>\n<td>U-11</td>\n<td>Haberleşme altyapısı</td>\n<td>Fiber ve 5G politikasını belirler.</td>\n</tr>\n<tr>\n<td>U-12</td>\n<td>Raylı sistemler</td>\n<td>Bazı şehirlerde metro ve hafif raylı sistem yapar.</td>\n</tr>\n<tr>\n<td>U-13</td>\n<td>Büyük projeler</td>\n<td>Kanal İstanbul gibi büyük projeleri yürütür.</td>\n</tr>\n</tbody></table>\n<hr>\n<h3>Cumhurbaşkanlığına bağlı diğer kurumlar</h3>\n<p>Bunlar bakanlık değildir ama devlet faaliyeti olarak ayrıca değerlendirilebilir:</p>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Kurum</th>\n<th>Ne yapıyor?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>CB-1</td>\n<td>MİT</td>\n<td>İstihbarat</td>\n</tr>\n<tr>\n<td>CB-2</td>\n<td>Savunma Sanayii Başkanlığı</td>\n<td>Silah alımları ve savunma projeleri</td>\n</tr>\n<tr>\n<td>CB-3</td>\n<td>İletişim Başkanlığı</td>\n<td>Devletin iletişimi ve basın kartları</td>\n</tr>\n<tr>\n<td>CB-4</td>\n<td>Strateji ve Bütçe Başkanlığı</td>\n<td>Bütçe hazırlığı ve kalkınma planları</td>\n</tr>\n<tr>\n<td>CB-5</td>\n<td>Devlet Denetleme Kurulu</td>\n<td>Kamu kurumlarını denetler</td>\n</tr>\n<tr>\n<td>CB-6</td>\n<td>Milli Saraylar</td>\n<td>Tarihi sarayları işletir</td>\n</tr>\n<tr>\n<td>CB-7</td>\n<td>Devlet Arşivleri</td>\n<td>Devlet arşivlerini yönetir</td>\n</tr>\n<tr>\n<td>CB-8</td>\n<td>Türkiye Varlık Fonu</td>\n<td>Türk Telekom, THY payları, Ziraat Bankası ve ÇAYKUR gibi devlet şirketlerini ve paylarını elinde tutar</td>\n</tr>\n<tr>\n<td>CB-9</td>\n<td>Ofisler</td>\n<td>Yatırım, Finans, İnsan Kaynakları ve Dijital Dönüşüm ofisleri</td>\n</tr>\n<tr>\n<td>CB-10</td>\n<td>TRT</td>\n<td>Devlet radyo ve televizyonu</td>\n</tr>\n</tbody></table>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-kultur-ve-turizm-bakanligi\">Kültür ve Turizm Bakanlığı</h2><p>Bakanlık <strong>tamamen kapatılır</strong>. Devlet kültür, sanat ve turizm alanından tamamen çekilir. Bakanlığın bütün faaliyetleri sona erer (KT-1 ile KT-21 arası, bkz. <a href=\"#sec-bakanliklarin-calisma-alanlari\">Bakanlıkların Çalışma Alanları</a>).</p>\n<h3>Yapılacaklar</h3>\n<ul>\n<li><strong>Turistik yerler:</strong> Devletin elindeki bütün müzeler, ören yerleri ve turistik yerler özelleştirilir.</li>\n<li><strong>Devlet tiyatroları ve operası:</strong> Satılır.</li>\n<li><strong>Devlet sanatçısı statüsü:</strong> Kaldırılır. Devlet orkestraları ve koroları kapatılır.</li>\n<li><strong>Konser ve etkinlikler:</strong> Devlet ve belediyeler konser, festival ve benzeri etkinlik düzenlemez.</li>\n<li><strong>Destekler:</strong> Sinema, yayın ve çeviri destekleri biter.</li>\n<li><strong>Turizm:</strong> Tanıtım, tesis belgelendirme ve turizm için arazi tahsisi biter.</li>\n<li><strong>Bağlı kurumlar:</strong> YTB (Yurtdışı Türkler) ve TİKA (dış yardım) da kapanır.</li>\n</ul>\n<h3>Gereken Anayasa değişiklikleri</h3>\n<ul>\n<li><strong>Md. 63 (Tarih, kültür ve tabiat varlıklarının korunması):</strong> Devlete bu varlıkları koruma görevi verir. Özelleştirme için bu maddenin değiştirilmesi gerekir.</li>\n<li><strong>Md. 64 (Sanatın ve sanatçının korunması):</strong> Devlete sanatı ve sanatçıyı koruma görevi verir. Devlet sanatının kaldırılması için bu maddenin değiştirilmesi gerekir.</li>\n</ul>\n<h3>Açık konular</h3>\n<blockquote class=\"callout question\"><p class=\"ct\">Henüz karar verilmedi</p><p>Aşağıdaki işler kültür desteği değil, hukuki işlerdir. Bakanlık kapanınca başka bir kuruma mı geçecek, yoksa tamamen mi kalkacak?</p>\n<ul>\n<li><strong>Telif hakları kaydı ve bandrol (KT-12)</strong></li>\n<li><strong>Tarihi eser kaçakçılığıyla mücadele (KT-5)</strong></li>\n<li><strong>Sit alanları ve tescil (KT-3):</strong> Özelleştirilen tarihi yapıları yeni sahibi istediği gibi değiştirebilecek mi?</li>\n</ul>\n</blockquote>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-diyanet-isleri-baskanligi\">Diyanet İşleri Başkanlığı</h2><p>Diyanet&#39;in tek görevi cami personelinin maaşlarını ödemek olur. Diğer bütün faaliyetleri sona erer. Ücretli cami personeli sistemi de zamanla ortadan kaldırılır.</p>\n<blockquote class=\"callout note\"><p class=\"ct\">Not</p><p>Diyanet resmi olarak bir bakanlık değil, Cumhurbaşkanlığına bağlı bir başkanlıktır.</p>\n</blockquote>\n<h3>Gerekçe</h3>\n<p>Cami personelinin devletten aldığı maaş haramdır. Haram maaşla çalışan birinin namaz kıldırmaması gerekir. Cemaat namaz kıldıracak birini arıyorsa içlerinden biri çıkıp kıldırır.</p>\n<h3>Yapılacaklar</h3>\n<ul>\n<li><strong>Ücretli cami personeli (D-1):</strong> Bu sistem ortadan kaldırılır. Namazı cemaatin içinden biri kıldırır.</li>\n<li><strong>Camiler:</strong> Devletten para almaz. Yalnızca halkın bağışlarıyla ayakta kalabilen camiler varlığını sürdürür.</li>\n<li><strong>Diğer bütün faaliyetler:</strong> Hutbeler, Kuran kursları, fetva, hac ve umre, yurt dışı din hizmetleri, yayınlar, manevi danışmanlık, mushaf denetimi, dini takvim ve Diyanet Vakfı faaliyetleri (D-2 ile D-11 arası) sona erer. Din işleri tamamen halka bırakılır.</li>\n</ul>\n<h3>Gereken Anayasa değişiklikleri</h3>\n<ul>\n<li><strong>Md. 136 (Diyanet İşleri Başkanlığı):</strong> Diyanet bir Anayasa kurumudur. Kapatılması için bu maddenin kaldırılması gerekir.</li>\n</ul>\n<h3>Açık konular</h3>\n<blockquote class=\"callout question\"><p class=\"ct\">Henüz karar verilmedi</p><p></p>\n<ul>\n<li><strong>Maaşlar ve geçiş:</strong> Diyanet&#39;in &quot;yalnızca maaş ödemesi&quot; ile &quot;cami personelinin kaldırılması&quot; nasıl birleşiyor? Örneğin mevcut personelin maaşı belli bir süre ödenip yeni personel alınmayabilir. Geçiş ne kadar sürecek?</li>\n<li><strong>Mevcut personel:</strong> İşini kaybeden imam ve müezzinlere ne olacak?</li>\n</ul>\n</blockquote>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-genclik-ve-spor-bakanligi\">Gençlik ve Spor Bakanlığı</h2><p>Yalnızca öğrencilerle ilgili faaliyetler kalır, diğerleri kapatılır. Devlet gençlik ve spor alanından çekilir.</p>\n<h3>Kalacaklar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>GS-1</td>\n<td>Öğrenci yurtları (KYK)</td>\n</tr>\n<tr>\n<td>GS-2</td>\n<td>Burs ve öğrenim kredisi (KYK)</td>\n</tr>\n</tbody></table>\n<h3>Kapatılacaklar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>GS-3</td>\n<td>Gençlik merkezleri</td>\n</tr>\n<tr>\n<td>GS-4</td>\n<td>Gençlik kampları</td>\n</tr>\n<tr>\n<td>GS-5</td>\n<td>Gençlik projelerine hibe</td>\n</tr>\n<tr>\n<td>GS-6</td>\n<td>Gençlik politikası ve araştırmaları</td>\n</tr>\n<tr>\n<td>GS-7</td>\n<td>Spor tesisleri</td>\n</tr>\n<tr>\n<td>GS-8</td>\n<td>Federasyonlara mali destek</td>\n</tr>\n<tr>\n<td>GS-9</td>\n<td>Milli takımlar ve olimpiyat hazırlığı</td>\n</tr>\n<tr>\n<td>GS-11</td>\n<td>Antrenör eğitimi ve belgelendirme</td>\n</tr>\n<tr>\n<td>GS-12</td>\n<td>Başarılı sporculara ödül</td>\n</tr>\n<tr>\n<td>GS-13</td>\n<td>Uluslararası organizasyonlar</td>\n</tr>\n<tr>\n<td>GS-14</td>\n<td>Sporda şiddetin önlenmesi</td>\n</tr>\n<tr>\n<td>GS-15</td>\n<td>Doping kontrolü</td>\n</tr>\n<tr>\n<td>GS-16</td>\n<td>Spor Toto</td>\n</tr>\n</tbody></table>\n<h3>Gereken Anayasa değişiklikleri</h3>\n<ul>\n<li><strong>Md. 58 (Gençliğin korunması):</strong> Devlete gençliğin yetiştirilmesi ve korunması için tedbir alma görevi verir.</li>\n<li><strong>Md. 59 (Sporun geliştirilmesi):</strong> Devlete sporu geliştirme ve başarılı sporcuyu koruma görevi verir.</li>\n</ul>\n<h3>Açık konular</h3>\n<blockquote class=\"callout question\"><p class=\"ct\">Henüz karar verilmedi</p><p></p>\n<ul>\n<li><strong>Yetenek taraması (GS-10):</strong> Okullarda yapıldığı için öğrencilerle ilgili sayılabilir. Kalacak mı?</li>\n<li><strong>Kalan kısmın yeri:</strong> Geriye yalnızca KYK kalıyor. Bakanlık olarak mı devam edecek, yoksa KYK ayrı bir kurum olarak mı yaşayacak?</li>\n<li><strong>Spor tesisleri (GS-7):</strong> Kapatılacak mı, satılacak mı, belediyelere mi devredilecek?</li>\n<li><strong>Sporda şiddet ve doping (GS-14, GS-15):</strong> Bunlar destek değil, kural koyma işleri. Federasyonlara mı bırakılacak?</li>\n</ul>\n</blockquote>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-aile-ve-sosyal-hizmetler-bakanligi\">Aile ve Sosyal Hizmetler Bakanlığı</h2><p>Bakanlık kalır. İki faaliyeti kapatılır.</p>\n<h3>Kapatılacaklar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>AS-11</td>\n<td>Aile eğitimi (evlilik öncesi ve aile eğitim programları)</td>\n</tr>\n<tr>\n<td>AS-13</td>\n<td>Erişilebilirlik denetimi</td>\n</tr>\n</tbody></table>\n<p>Diğer faaliyetler (sosyal yardımlar, aylıklar, çocuk koruma, konukevleri, huzurevleri vb.) devam eder.</p>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-calisma-ve-sosyal-guvenlik-bakanligi\">Çalışma ve Sosyal Güvenlik Bakanlığı</h2><p>Bakanlık kalır. Sendikalarla ilgili iki görevi kaldırılır.</p>\n<h3>Kapatılacaklar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Gerekçe</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>ÇS-9</td>\n<td>Sendikal ilişkiler</td>\n<td>Sendika Sistemi mahkemeler ve Ölçüm Kurulu üzerinden işler. Bakanlığa gerek kalmaz.</td>\n</tr>\n<tr>\n<td>ÇS-10</td>\n<td>Memur toplu sözleşmesi</td>\n<td>Memurların sendika düzeni Memurlar notundaki kurallarla işler.</td>\n</tr>\n</tbody></table>\n<p>Diğer faaliyetler (SGK, İŞKUR, işsizlik sigortası, iş güvenliği, iş teftişi vb.) devam eder.</p>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-cevre-sehircilik-ve-iklim-degisikligi-bakanligi\">Çevre, Şehircilik ve İklim Değişikliği Bakanlığı</h2><p>Bakanlık kalır. Bütün denetim görevleri bakanlıktan alınır ve <strong>bağımsız kuruluşlara</strong> bırakılır.</p>\n<h3>Bağımsız kuruluşlara devredilecekler</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>ÇŞ-2</td>\n<td>Yapı denetimi</td>\n</tr>\n<tr>\n<td>ÇŞ-11</td>\n<td>Hava ve su kalitesi denetimi</td>\n</tr>\n<tr>\n<td>ÇŞ-14</td>\n<td>Yapı malzemesi ve müteahhit denetimi</td>\n</tr>\n</tbody></table>\n<p>Diğer faaliyetler devam eder.</p>\n<h3>Açık konular</h3>\n<blockquote class=\"callout question\"><p class=\"ct\">Henüz karar verilmedi</p><p></p>\n<ul>\n<li><strong>ÇED (ÇŞ-9):</strong> Çevresel etki değerlendirmesi de bir tür denetimdir. Bağımsız kuruluşlara mı geçecek?</li>\n<li><strong>Bağımsız kuruluşların yapısı:</strong> Bu kuruluşları kim kuracak, kim seçecek, bağımsızlıkları nasıl sağlanacak? Ölçüm Kurulu ve Yargı Bağımsızlığı notlarındaki model kullanılabilir. Bu soru <a href=\"#sec-liberalizasyon\">Liberalizasyon</a> ana notunda ortak açık konu olarak duruyor.</li>\n</ul>\n</blockquote>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-enerji-ve-tabii-kaynaklar-bakanligi\">Enerji ve Tabii Kaynaklar Bakanlığı</h2><p>Bakanlık kalır. Devlet şirketlerinin bir kısmı satılır, yenilenebilir enerji desteği biter.</p>\n<h3>Yapılacaklar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Karar</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>E-3</td>\n<td>EÜAŞ (devlet elektrik santralleri)</td>\n<td>Satılır.</td>\n</tr>\n<tr>\n<td>E-5</td>\n<td>Eti Maden (bor)</td>\n<td>%40&#39;ı özelleştirilir.</td>\n</tr>\n<tr>\n<td>E-6</td>\n<td>Türkiye Taşkömürü Kurumu</td>\n<td>Satılır.</td>\n</tr>\n<tr>\n<td>E-10</td>\n<td>Yenilenebilir enerji teşvikleri</td>\n<td>Biter.</td>\n</tr>\n</tbody></table>\n<p>Diğer faaliyetler devam eder.</p>\n<h3>Gereken Anayasa değişiklikleri</h3>\n<ul>\n<li><strong>Md. 168 (Tabii servetler ve kaynaklar):</strong> Madenler devletin hüküm ve tasarrufu altındadır. Devlet işletme hakkını süreli olarak devredebilir ama mülkiyeti devredemez. Eti Maden ve TTK&#39;nın satışında bu sınır göz önünde tutulmalı.</li>\n</ul>\n<h3>Açık konular</h3>\n<blockquote class=\"callout question\"><p class=\"ct\">Henüz karar verilmedi</p><p></p>\n<ul>\n<li><strong>Bor tekeli:</strong> Eti Maden&#39;in %40&#39;ı özelleştirilince bor üzerindeki devlet tekeli devam edecek mi, yoksa başka şirketler de bor çıkarabilecek mi?</li>\n</ul>\n</blockquote>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-hazine-ve-maliye-bakanligi\">Hazine ve Maliye Bakanlığı</h2><p>Bakanlık kalır. Darphanenin faaliyeti durdurulur. Türk lirası kademeli olarak dijitalleştirilir.</p>\n<h3>Yapılacaklar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Karar</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>HM-9</td>\n<td>Darphane</td>\n<td>Geçiş döneminde faaliyeti durdurulur, şimdilik para basılmaz. Nakit tamamen kalkınca satılır.</td>\n</tr>\n</tbody></table>\n<p>Diğer faaliyetler devam eder.</p>\n<h3>Türk lirasının dijitalleşmesi</h3>\n<p>Türk lirası kademeli olarak dijitalleştirilir ve sonunda <strong>nakit tamamen kaldırılır</strong>. Dijital lirayı <a href=\"#sec-merkez-bankasi\">Merkez Bankası</a> çıkarır.</p>\n<ol>\n<li><strong>Geçiş dönemi:</strong> Para basmak gerektiğinde mümkün olduğunca az nakit basılır. Bu kural hem madeni para (Darphane) hem kağıt para (Merkez Bankası) için geçerlidir.</li>\n<li><strong>Son durum:</strong> Nakit tamamen kalkar. Bütün ödemeler dijital olarak yapılır.</li>\n</ol>\n<h3>Açık konular</h3>\n<blockquote class=\"callout question\"><p class=\"ct\">Henüz karar verilmedi</p><p></p>\n<ul>\n<li><strong>Gizlilik:</strong> Nakit kalkınca bütün ödemeler kayıt altına girer. Devletin bütün harcamaları görebilmesi, devletin küçülmesi fikriyle çelişebilir. Gizlilik nasıl korunacak? (Bkz. <a href=\"#sec-merkez-bankasi\">Merkez Bankası</a>)</li>\n<li><strong>Geçiş süresi:</strong> Nakit ne kadar sürede tamamen kalkacak?</li>\n<li><strong>Erişim:</strong> Banka hesabı ya da telefonu olmayanlar, yaşlılar, deprem ve elektrik kesintisi gibi durumlarda ödemeler nasıl yapılacak?\nAna harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></li>\n</ul>\n</blockquote>\n<h2 id=\"sec-saglik-bakanligi\">Sağlık Bakanlığı</h2><p>Bakanlık kalır. Piyasaya yapılan bazı müdahaleler kaldırılır.</p>\n<h3>Yapılacaklar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Karar</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>S-8</td>\n<td>İlaç fiyat kontrolü</td>\n<td>Bazı temel ve basit ilaçlarda fiyat kontrolü kaldırılır.</td>\n</tr>\n<tr>\n<td>S-9</td>\n<td>Kozmetik denetimi</td>\n<td>Biter.</td>\n</tr>\n<tr>\n<td>S-10</td>\n<td>Özel hastane izinleri</td>\n<td>Özel hastanelerdeki kadro sınırlaması kaldırılır.</td>\n</tr>\n<tr>\n<td>S-13</td>\n<td>Sağlık turizmi</td>\n<td>Teşvikler biter.</td>\n</tr>\n</tbody></table>\n<p>Diğer faaliyetler devam eder.</p>\n<h3>Açık konular</h3>\n<blockquote class=\"callout question\"><p class=\"ct\">Henüz karar verilmedi</p><p></p>\n<ul>\n<li><strong>Hangi ilaçlar:</strong> Fiyat kontrolü kalkacak &quot;temel ve basit ilaçlar&quot; nasıl belirlenecek? Örneğin reçetesiz satılan ilaçlar olabilir.</li>\n</ul>\n</blockquote>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-sanayi-ve-teknoloji-bakanligi\">Sanayi ve Teknoloji Bakanlığı</h2><p>Bakanlık kalır. Metroloji faaliyeti kapatılır.</p>\n<h3>Kapatılacaklar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>ST-11</td>\n<td>Metroloji (ölçü aletlerinin denetimi)</td>\n</tr>\n</tbody></table>\n<p>Diğer faaliyetler devam eder.</p>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-tarim-ve-orman-bakanligi\">Tarım ve Orman Bakanlığı</h2><p>Bakanlık kalır. Devletin tarım piyasasına müdahalesi azalır, bazı görevler bağımsız kuruluşlara geçer.</p>\n<h3>Yapılacaklar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Karar</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>T-2</td>\n<td>TMO</td>\n<td>Kapatılır.</td>\n</tr>\n<tr>\n<td>T-4</td>\n<td>TİGEM (devlet çiftlikleri)</td>\n<td>Satılır.</td>\n</tr>\n<tr>\n<td>T-12</td>\n<td>Milli parklar</td>\n<td>Bağımsız kuruluşlara bırakılır.</td>\n</tr>\n<tr>\n<td>T-14</td>\n<td>DSİ (su kaynakları)</td>\n<td>Su kaynaklarının yönetiminin yaklaşık %35&#39;i özelleştirilir.</td>\n</tr>\n<tr>\n<td>T-15</td>\n<td>Meteoroloji</td>\n<td>Bağımsız kuruluşlara bırakılır.</td>\n</tr>\n</tbody></table>\n<p>Diğer faaliyetler devam eder.</p>\n<h3>Gereken Anayasa değişiklikleri</h3>\n<ul>\n<li><strong>Md. 169 (Ormanların korunması):</strong> Devlet ormanlarının mülkiyeti devredilemez. Milli parklarda orman varsa bağımsız kuruluşlara yalnızca yönetim devredilebilir, mülkiyet devredilemez.</li>\n</ul>\n<h3>Açık konular</h3>\n<blockquote class=\"callout question\"><p class=\"ct\">Henüz karar verilmedi</p><p></p>\n<ul>\n<li><strong>Su özelleştirmesi:</strong> %35 neyi kapsayacak? Sulama kanalları, barajlar, içme suyu ya da hidroelektrik santralleri olabilir.</li>\n</ul>\n</blockquote>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-ticaret-bakanligi\">Ticaret Bakanlığı</h2><p>Bakanlık kalır. Fiyatlara ve depolamaya yapılan müdahaleler kaldırılır.</p>\n<h3>Kapatılacaklar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Gerekçe</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>TC-7</td>\n<td>Fiyat denetimi</td>\n<td>Serbest piyasada &quot;haksız fiyat artışı&quot; diye bir şey yoktur. Fiyatı arz ve talep belirler.</td>\n</tr>\n<tr>\n<td>TC-12</td>\n<td>Lisanslı depoculuk denetimi</td>\n<td>Kaldırılır.</td>\n</tr>\n</tbody></table>\n<p>Diğer faaliyetler devam eder.</p>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-ulastirma-ve-altyapi-bakanligi\">Ulaştırma ve Altyapı Bakanlığı</h2><p>Bakanlık kalır. Devlet şirketleri satılır, ulaştırma ve haberleşme piyasaları özel girişime açılır.</p>\n<h3>Yapılacaklar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Alan</th>\n<th>Karar</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>U-2</td>\n<td>Garantili projeler</td>\n<td>Yap-işlet-devret politikaları sona erer.</td>\n</tr>\n<tr>\n<td>U-3</td>\n<td>TCDD</td>\n<td>Stratejik sayılmayan hatlarda demiryolları özelleştirilir. Devlet bu hatlarda yalnızca üst fiyat sınırı koyar.</td>\n</tr>\n<tr>\n<td>U-4</td>\n<td>DHMİ (devlet havalimanları)</td>\n<td>Havalimanları tamamen satılır.</td>\n</tr>\n<tr>\n<td>U-6</td>\n<td>Denizcilik</td>\n<td>Özel girişimin önündeki engeller kaldırılır.</td>\n</tr>\n<tr>\n<td>U-9</td>\n<td>PTT</td>\n<td>Satılır.</td>\n</tr>\n<tr>\n<td>U-10</td>\n<td>Uydu hizmetleri</td>\n<td>Yabancı şirketlerin girişine sınırsız izin verilir.</td>\n</tr>\n</tbody></table>\n<p>Diğer faaliyetler devam eder.</p>\n<h3>Açık konular</h3>\n<blockquote class=\"callout question\"><p class=\"ct\">Henüz karar verilmedi</p><p></p>\n<ul>\n<li><strong>Stratejik hatlar:</strong> Hangi demiryolu hatları stratejik sayılacak, buna kim karar verecek?</li>\n<li><strong>Hava trafik kontrolü:</strong> DHMİ havalimanlarını işletmenin yanında hava trafik kontrolünü de yapar. Havalimanları satılınca hava trafik kontrolü devlette mi kalacak?</li>\n<li><strong>Türksat:</strong> Yabancı şirketlere piyasa açılınca Türksat devlette mi kalacak, satılacak mı?</li>\n<li><strong>Mevcut yap-işlet-devret sözleşmeleri:</strong> Yeni proje yapılmayacağı açık. Mevcut garantili sözleşmelere (köprüler, otoyollar, şehir hastaneleri) ne olacak?</li>\n</ul>\n</blockquote>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-cumhurbaskanligina-bagli-kurumlar\">Cumhurbaşkanlığına Bağlı Kurumlar</h2><p>Bakanlık olmayan ama Cumhurbaşkanlığına bağlı çalışan kurumlarla ilgili kararlar.</p>\n<h3>Yapılacaklar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Kurum</th>\n<th>Karar</th>\n<th>Gerekçe</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>CB-3</td>\n<td>İletişim Başkanlığı</td>\n<td>Kaldırılır.</td>\n<td></td>\n</tr>\n<tr>\n<td>CB-5</td>\n<td>Devlet Denetleme Kurulu</td>\n<td>Kaldırılır.</td>\n<td>Kurul Cumhurbaşkanlığına bağlıdır. Yürütmenin kendi kendini denetlemesi anlamsızdır.</td>\n</tr>\n<tr>\n<td>CB-6</td>\n<td>Milli Saraylar</td>\n<td>Tarihi saraylar derneklere bırakılır.</td>\n<td></td>\n</tr>\n<tr>\n<td>CB-10</td>\n<td>TRT</td>\n<td>Satılır.</td>\n<td></td>\n</tr>\n</tbody></table>\n<h3>Gereken Anayasa değişiklikleri</h3>\n<ul>\n<li><strong>Md. 108 (Devlet Denetleme Kurulu):</strong> Kurul bir Anayasa kurumudur. Kaldırılması için bu maddenin kaldırılması gerekir.</li>\n<li><strong>Md. 133 (Radyo ve televizyon):</strong> Devletin kamu tüzel kişiliği olarak kurduğu tek radyo ve televizyon kurumundan (TRT) söz eder. Satış için bu maddenin değiştirilmesi gerekir.</li>\n<li><strong>Md. 63 (Kültür varlıklarının korunması):</strong> Tarihi saraylar kültür varlığıdır. Derneklere devri için bu maddenin değiştirilmesi gerekir. Aynı değişiklik <a href=\"#sec-kultur-ve-turizm-bakanligi\">Kültür ve Turizm Bakanlığı</a> için de gerekiyor.</li>\n</ul>\n<h3>Açık konular</h3>\n<blockquote class=\"callout question\"><p class=\"ct\">Henüz karar verilmedi</p><p></p>\n<ul>\n<li><strong>Saraylar hangi derneklere:</strong> Saraylar hangi derneklere, hangi şartlarla bırakılacak? Mülkiyet mi devredilecek, yoksa yalnızca işletme mi?</li>\n</ul>\n</blockquote>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-merkez-bankasi\">Merkez Bankası</h2><p>Merkez Bankası&#39;nın <strong>tamamen bağımsız</strong> hale getirilmesi düşünülüyor. Dijital Türk lirasını Merkez Bankası çıkarır.</p>\n<blockquote class=\"callout note\"><p class=\"ct\">Durum</p><p>Bağımsızlık fikri henüz taslak aşamasında. Kesin karar verilmedi.</p>\n</blockquote>\n<h3>Görevleri</h3>\n<ul>\n<li><strong>Dijital Türk lirası:</strong> Dijital lirayı Merkez Bankası çıkarır. Geçiş ve nakdin kaldırılması <a href=\"#sec-hazine-ve-maliye-bakanligi\">Hazine ve Maliye Bakanlığı</a> notunda yazılıdır.</li>\n</ul>\n<h3>Bugünkü durum</h3>\n<p>Merkez Bankası başkanını bugün Cumhurbaşkanı atar ve görevden alabilir. Bu yüzden faiz ve para basma kararları siyasi baskıya açıktır.</p>\n<h3>Para arzı kuralı</h3>\n<p>Para arzı iki araçla yönetilir:</p>\n<table>\n<thead>\n<tr>\n<th>Araç</th>\n<th>Görevi</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Yüksek rezerv + Mises&#39;in geçişi</td>\n<td>Bankaların <strong>kısmi rezerv bankacılığıyla</strong> kendi başına para yaratmasını sınırlar.</td>\n</tr>\n<tr>\n<td>Hayek&#39;in yansız para kuralı</td>\n<td>Merkez Bankası&#39;nın ne zaman ve ne kadar para çıkaracağını belirler.</td>\n</tr>\n</tbody></table>\n<p>Böylece para arzı ne bankaların kâr isteğine ne de siyasetçilerin isteğine bağlı olur. Tek bir ölçüye bağlıdır: Toplam harcama sabit kalıyor mu?</p>\n<h4>Kısmi rezerv bankacılığı nedir?</h4>\n<p>Bankalar, kendilerine yatırılan paranın yalnızca küçük bir kısmını kasada tutar (rezerv), kalanını kredi olarak verir. Verilen kredi başka bir bankaya yatırılır ve o banka da aynı şeyi yapar. Böylece Merkez Bankası&#39;nın çıkardığı her 1 TL, bankacılık sistemi içinde katlanarak çok daha fazla paraya dönüşür. Para arzının büyük kısmını Merkez Bankası değil, bankalar yaratır.</p>\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>M</mi><mo>=</mo><mfrac><mn>1</mn><mi>r</mi></mfrac><mo>×</mo><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">M = \\frac{1}{r} \\times B</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">M</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:2.0074em;vertical-align:-0.686em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.3214em;\"><span style=\"top:-2.314em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.02778em;\">r</span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.677em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\">1</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.686em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.05017em;\">B</span></span></span></span></span>\n<table>\n<thead>\n<tr>\n<th>Sembol</th>\n<th>Anlamı</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">M</span></span></span></span></td>\n<td>Toplam para arzı (İngilizce <em>money</em>)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.05017em;\">B</span></span></span></span></td>\n<td>Merkez Bankası&#39;nın çıkardığı para, yani <strong>b</strong>az para (parasal taban)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.4306em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.02778em;\">r</span></span></span></span></td>\n<td>Bankaların tutmak zorunda olduğu <strong>r</strong>ezerv oranı</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1</mn><mi>r</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">\\frac{1}{r}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1.1901em;vertical-align:-0.345em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8451em;\"><span style=\"top:-2.655em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.02778em;\">r</span></span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.394em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">1</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.345em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span></span></span></span></td>\n<td>Para çarpanı: 1 TL baz paranın kaç TL&#39;ye dönüştüğü</td>\n</tr>\n</tbody></table>\n<p>Örneğin rezerv oranı %10 ise ($r = 0{,}10$) her 1 TL baz para en fazla 10 TL&#39;ye dönüşebilir. Rezerv oranı %50&#39;ye çıkarsa bu sayı 2 TL&#39;ye düşer.</p>\n<blockquote class=\"callout note\"><p class=\"ct\">Not</p><p>Bu basitleştirilmiş bir formüldür. Gerçekte insanların elde tuttuğu para ve bankaların fazladan tuttuğu rezervler yüzünden çarpan daha küçüktür. Ama mantık aynıdır: Rezerv oranı yükseldikçe bankaların yaratabileceği para azalır.</p>\n</blockquote>\n<h4>Hayek&#39;in yansız para kuralı</h4>\n<blockquote class=\"callout info\"><p class=\"ct\">Envanter</p><p>Para arzının etkilediği her şey ve formüle girebilecek göstergeler → <a href=\"#sec-para-arzinin-etkileri\">Para Arzının Etkileri</a></p>\n</blockquote>\n<p>Ekonomideki <strong>toplam harcama sabit tutulur</strong>:</p>\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>M</mi><mo>×</mo><mi>V</mi><mo>=</mo><mtext>sabit</mtext></mrow><annotation encoding=\"application/x-tex\">M \\times V = \\text{sabit}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">M</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">V</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6944em;\"></span><span class=\"mord text\"><span class=\"mord\">sabit</span></span></span></span></span></span>\n<table>\n<thead>\n<tr>\n<th>Sembol</th>\n<th>Anlamı</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">M</span></span></span></span></td>\n<td>Ekonomideki para miktarı (İngilizce <em>money</em>)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">V</span></span></span></span></td>\n<td>Dolaşım hızı: 1 TL&#39;nin bir yılda kaç kez el değiştirdiği (İngilizce <em>velocity</em>)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mo>×</mo><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">M \\times V</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">M</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">V</span></span></span></span></td>\n<td>Toplam harcama: Ekonomide bir yılda el değiştiren paranın toplamı</td>\n</tr>\n</tbody></table>\n<p>Para miktarı yalnızca dolaşım hızındaki değişmeyi dengelemek için değiştirilir:</p>\n<table>\n<thead>\n<tr>\n<th>Durum</th>\n<th>Ne yapılır?</th>\n<th>Neden?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Ekonomi büyüyor</td>\n<td><strong>Hiçbir şey.</strong> Para basılmaz.</td>\n<td>Aynı para daha çok malı dolaştırır, fiyatlar düşer. Bu iyi deflasyondur, çünkü verimlilikten gelir.</td>\n</tr>\n<tr>\n<td>İnsanlar parayı harcamayıp elinde tutuyor (dolaşım hızı düşüyor)</td>\n<td><strong>Para çıkarılır</strong>, düşüşü dengeleyecek kadar.</td>\n<td>Yoksa toplam harcama çöker. Bu kötü deflasyondur: iflaslar, işsizlik, kriz.</td>\n</tr>\n<tr>\n<td>İnsanlar parayı hızla harcıyor (dolaşım hızı artıyor)</td>\n<td><strong>Para geri çekilir</strong>, artışı dengeleyecek kadar.</td>\n<td>Yoksa toplam harcama şişer, enflasyon ve balon oluşur.</td>\n</tr>\n</tbody></table>\n<h5>Kriz örneği</h5>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Normal yıl</th>\n<th>Kriz yılı (kural yok)</th>\n<th>Kriz yılı (Hayek&#39;in kuralı)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Para miktarı ($M$)</td>\n<td>100 TL</td>\n<td>100 TL</td>\n<td><strong>125 TL</strong></td>\n</tr>\n<tr>\n<td>Dolaşım hızı ($V$)</td>\n<td>5</td>\n<td>4 (insanlar korkup parayı tutuyor)</td>\n<td>4</td>\n</tr>\n<tr>\n<td>Toplam harcama</td>\n<td>500 TL</td>\n<td><strong>400 TL</strong> (%20 çöküş)</td>\n<td><strong>500 TL</strong> (sabit)</td>\n</tr>\n</tbody></table>\n<p>Kural olmadan toplam harcama %20 çöker. Kuralla Merkez Bankası 25 TL çıkarır ve harcama eski seviyesinde kalır. Kriz geçip dolaşım hızı 5&#39;e döndüğünde bu 25 TL geri çekilir.</p>\n<h5>Uygulamada ölçüm: Nominal GSYH</h5>\n<p>Dolaşım hızı doğrudan ölçülemez. Ama toplam harcama zaten ölçülür: <strong>Nominal GSYH</strong>, yani ekonomide bir yılda üretilen her şeyin o yılın fiyatlarıyla toplam değeri. TÜİK bunu her üç ayda bir açıklar.</p>\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>M</mi><mo>×</mo><mi>V</mi><mo>=</mo><mi>P</mi><mo>×</mo><mi>Y</mi><mo>=</mo><mtext>Nominal GSYH</mtext></mrow><annotation encoding=\"application/x-tex\">M \\times V = P \\times Y = \\text{Nominal GSYH}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">M</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">V</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">P</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">Y</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6944em;\"></span><span class=\"mord text\"><span class=\"mord\">Nominal GSYH</span></span></span></span></span></span>\n<p>Merkez Bankası&#39;nın tek görevi şudur:</p>\n<ul>\n<li>Nominal GSYH hedefin <strong>altına</strong> düşerse para çıkarır.</li>\n<li>Nominal GSYH hedefin <strong>üstüne</strong> çıkarsa para geri çeker.</li>\n<li>Hedefteyse hiçbir şey yapmaz.</li>\n</ul>\n<blockquote class=\"callout note\"><p class=\"ct\">Dikkat edilmesi gereken iki nokta</p><p></p>\n<ul>\n<li><strong>Nüfus artışı:</strong> İşgücü büyürken toplam harcama tamamen sabit kalırsa kişi başına maaşların düşmesi gerekir. Maaşlar kolay düşmediği için bu işsizlik yaratabilir. George Selgin&#39;in yorumunda (verimlilik normu) toplam harcama işgücü artışı kadar büyüyebilir, fiyatlar yine verimlilik artışı kadar düşer.</li>\n<li><strong>Gecikme:</strong> Nominal GSYH üç ayda bir ve gecikmeyle açıklanır. Merkez Bankası krize birkaç ay geç tepki verebilir.</li>\n</ul>\n</blockquote>\n<h4>Sınırlama araçları</h4>\n<p>Bankaların yarattığı parayı sınırlamak için birkaç yol vardır:</p>\n<table>\n<thead>\n<tr>\n<th>Araç</th>\n<th>Nasıl işler?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Zorunlu karşılık oranını yükseltmek</td>\n<td>Bankaların kasada tutması gereken pay artar, para çarpanı küçülür.</td>\n</tr>\n<tr>\n<td>Kredi büyüme tavanı</td>\n<td>Bankaların kredi hacmi belli bir oranın üstünde büyüyemez.</td>\n</tr>\n<tr>\n<td>Tam rezerv bankacılığı</td>\n<td>Vadesiz mevduatın tamamı rezervde tutulur, bankalar yalnızca vadeli mevduatla ya da kendi sermayeleriyle kredi verir. Kısmi rezervi sınırlamak değil, kaldırmak anlamına gelir.</td>\n</tr>\n</tbody></table>\n<h4>Seçilen yöntem: Mises&#39;in geçişi</h4>\n<p>Kısmi rezerv, Mises&#39;in önerdiği yöntemle sınırlanır. Chicago Planı&#39;ndaki gibi bankalara bir kerelik rezerv verilmez, mevcut sistem bir anda bozulmaz.</p>\n<ol>\n<li><strong>Mevcut tutar dondurulur:</strong> Yasanın çıktığı gün bankaların kısmi rezervle yarattığı para (karşılıksız mevduat) o seviyede sabitlenir. Bu tutar azaltılmaz, ama bir daha artırılamaz.</li>\n<li><strong>Yeni mevduat yüksek rezervle tutulur:</strong> Bu tarihten sonra gelen her yeni mevduat için yüksek bir rezerv oranı uygulanır.</li>\n<li><strong>Zamanla dengelenir:</strong> Ekonomi büyüdükçe yeni mevduat çoğalır. Dondurulmuş karşılıksız tutarın toplam içindeki payı küçülür ve sistem kendiliğinden yeni orana yaklaşır.</li>\n</ol>\n<blockquote class=\"callout warning\"><p class=\"ct\">Dondurma, azaltma değil</p><p>Mevcut karşılıksız tutar dondurulmalı, azaltılmamalıdır. Eski hesaplar kapanıp yeni hesaplara geçerken yeni oran bu paraya da uygulanırsa para arzı yıllar içinde hızla daralır ve kötü deflasyon çıkar.</p>\n</blockquote>\n<h4>Başlangıç rezerv oranı</h4>\n<p>Yeni mevduatın <strong>%80&#39;i</strong> kasada tutulur, <strong>%20&#39;si</strong> kredi olarak verilebilir. Tam rezerv yerine bu oranın seçilmesinin amacı, sabit arzın yol açacağı önlenemeyen deflasyonu engellemek için küçük bir esneklik payı bırakmaktır.</p>\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>M</mi><mtext>en fazla</mtext></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>80</mn></mrow></mfrac><mo>×</mo><mi>B</mi><mo>=</mo><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>25</mn><mo>×</mo><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">M_{\\text{en fazla}} = \\frac{1}{0{,}80} \\times B = 1{,}25 \\times B</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">M</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.109em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord text mtight\"><span class=\"mord mtight\">en fazla</span></span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:2.2019em;vertical-align:-0.8804em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.3214em;\"><span style=\"top:-2.314em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\">0</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">80</span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.677em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\">1</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8804em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.05017em;\">B</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">1</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">25</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.05017em;\">B</span></span></span></span></span>\n<p>Yani her 1 TL baz para, bankacılık sisteminde en fazla 1,25 TL&#39;ye dönüşebilir. Bugünkü sistemde bu sayı 10 TL ve üstüdür.</p>\n<blockquote class=\"callout note\"><p class=\"ct\">Not</p><p>%80 rezerv, para arzının her yıl %20 artabileceği anlamına gelmez. Bu oran bir kerelik bir üst sınır koyar: Bankalar bu sınıra ulaştıktan sonra para arzı ancak baz para artarsa büyüyebilir. Deflasyona karşı esnekliği bu pay değil, [[#Hayek&#39;in yansız para kuralı]] sağlar.</p>\n</blockquote>\n<h4>Rezerv indirimi: %80&#39;den %50&#39;ye</h4>\n<p>Enflasyon kontrol altına alındıktan sonra yeni mevduattaki rezerv oranı kademeli olarak <strong>%80&#39;den %50&#39;ye</strong> düşürülür.</p>\n<table>\n<thead>\n<tr>\n<th>Kural</th>\n<th>Ayrıntı</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Ne zaman başlar?</td>\n<td>Yıllık enflasyon %2&#39;nin altına indiğinde</td>\n</tr>\n<tr>\n<td>Hızı</td>\n<td>Yılda en fazla 10 puan</td>\n</tr>\n<tr>\n<td>Ne zaman durur?</td>\n<td>Bankaların kredi hacmi son iki yılda nominal GSYH&#39;den yılda 2 puandan fazla hızlı büyüdüyse. Kredi büyümesi yavaşlayınca indirim kaldığı yerden devam eder.</td>\n</tr>\n<tr>\n<td>Hedef</td>\n<td>%50</td>\n</tr>\n</tbody></table>\n<p><strong>Neden?</strong> Rezerv düşünce bankalar daha fazla kredi verebilir, kredi faizleri düşer ve büyüme biraz hızlanır.</p>\n<p><strong>Toplam para miktarı değişmez.</strong> Hayek&#39;in kuralında Merkez Bankası toplam harcamayı sabit tutar. Bankalar daha fazla para yaratınca Merkez Bankası o kadar parayı geri çeker. Enflasyon ve işsizlik etkilenmez. Değişen şey, paranın ne kadarını bankaların yarattığıdır.</p>\n<p><strong>Bedeli:</strong></p>\n<ul>\n<li><strong>Kırılganlık:</strong> Kredi gelirden hızlı büyüdükçe kriz riski artar. Simülasyonda en yüksek kırılganlık 3,7&#39;den 9,4&#39;e çıktı. Varsayılan kriz eşiği (12) aşılmadı ama eşik 8 alındığında bir kriz çıktı.</li>\n<li><strong>Para basma kârı:</strong> Parayı Merkez Bankası değil bankalar yarattığında bundan doğan faiz kârı kamudan bankalara geçer. Faizler sıfıra yakın olduğu için kayıp küçüktür: GSYH&#39;nin yaklaşık %0,1-0,3&#39;ü.</li>\n<li><strong>Felsefe:</strong> Bu adım Mises&#39;in &quot;kısmi rezervi sınırla&quot; çizgisinden, kısmi rezervi kabul edip etkisini Merkez Bankası&#39;na dengeleten Hayek&#39;in 1930&#39;lardaki çizgisine doğru bir kayıştır.</li>\n</ul>\n<blockquote class=\"callout note\"><p class=\"ct\">Simülasyondan çıkan ders</p><p>Durdurma eşiği indirimi yavaşlatır ve krizi geciktirir, ama tamamen önlemez. Kriz riskini asıl belirleyen, hedef oranın kendisidir. Simülasyonda kriz eşiği 8 alındığında hedef %60 ve üstünde kriz çıkmadı, %50&#39;de bir kriz çıktı. Kırılganlık izlenmeli, gerekirse hedef oran %60 civarında tutulmalıdır.</p>\n</blockquote>\n<blockquote class=\"callout tip\"><p class=\"ct\">Dijital lirayla bağlantı</p><p>İnsanlar paralarını Merkez Bankası&#39;nın çıkardığı dijital lira olarak tutarsa bankalardaki mevduat azalır. Bankaların kredi olarak verebileceği para da azalır. Yani dijital lira, kısmi rezervle para yaratılmasını kendiliğinden de sınırlayabilir.</p>\n</blockquote>\n<h3>Açık konular</h3>\n<blockquote class=\"callout question\"><p class=\"ct\">Henüz karar verilmedi</p><p></p>\n<ul>\n<li><strong>Atama:</strong> Başkanı ve para politikası kurulunu kim seçecek? Seçilenler hangi koşullarda görevden alınabilecek? Yargı Bağımsızlığı ve Ölçüm Kurulu notlarındaki modeller kullanılabilir.</li>\n<li><strong>Görev süresi:</strong> Başkanın görev süresi ne kadar olacak? Seçim dönemlerinden uzun ve yenilenemez olması bağımsızlığı güçlendirir.</li>\n<li><strong>Hazineye borç yasağı:</strong> Merkez Bankası&#39;nın devlete doğrudan para vermesi (bütçe açığını para basarak kapatması) yasaklanacak mı?</li>\n<li><strong>Hesap verme:</strong> Bağımsız banka kime ve nasıl hesap verecek? Örneğin düzenli olarak Meclis&#39;e rapor sunabilir.</li>\n<li><strong>Sabit mi, işgücüyle mi büyüyecek?</strong> Nominal GSYH hedefi tamamen sabit mi kalacak (Hayek), yoksa işgücü artışı kadar mı büyüyecek (Selgin)?</li>\n<li><strong>Hedefin başlangıç seviyesi:</strong> Hedef, kuralın başladığı yılın nominal GSYH&#39;si mi olacak? O yıl olağandışı bir yılsa (kriz ya da yüksek enflasyon) ne yapılacak?</li>\n<li><strong>Tepki hızı:</strong> Merkez Bankası her çeyrek açıklanan veriye göre mi hareket edecek, yoksa daha sık açıklanan göstergeleri (vergi gelirleri, kart harcamaları) de kullanacak mı? Dijital lira, toplam harcamanın anlık ölçülmesini mümkün kılabilir.</li>\n<li><strong>Sapma payı:</strong> Merkez Bankası hedeften ne kadar sapmaya izin verip müdahale etmeyecek? Örneğin ±%1.</li>\n<li><strong>Rezerv indiriminin sınırı:</strong> Hedef %50&#39;de mi kalacak, yoksa kırılganlık izlenerek %60 civarında mı durdurulacak? Kırılganlığı resmi olarak kim ölçecek?</li>\n<li><strong>Dijital paranın gizliliği:</strong> Dijital lirayı Merkez Bankası çıkaracağı için harcama kayıtları da Merkez Bankası&#39;nda toplanır. Bu kayıtlara hükümet ya da başka kurumlar hangi koşulda erişebilecek?</li>\n</ul>\n</blockquote>\n<p>Ana harita → <a href=\"#sec-liberalizasyon\">Liberalizasyon</a></p>\n<h2 id=\"sec-para-arzinin-etkileri\">Para Arzının Etkileri</h2><p>Bu not, <a href=\"#sec-merkez-bankasi\">Merkez Bankası</a> için para arzı formülünü belirlemek üzere hazırlanmış bir envanterdir. Para arzının genişlemesinin ya da daralmasının etkilediği her şeyi listeler. Her maddenin bir kodu vardır (örneğin <strong>PA-3</strong>).</p>\n<hr>\n<h3>Temel denklem: Miktar denklemi</h3>\n<p>Para arzıyla ekonomi arasındaki ilişkinin temeli şu denklemdir:</p>\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>M</mi><mo>×</mo><mi>V</mi><mo>=</mo><mi>P</mi><mo>×</mo><mi>Y</mi></mrow><annotation encoding=\"application/x-tex\">M \\times V = P \\times Y</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">M</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">V</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">P</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">Y</span></span></span></span></span>\n<table>\n<thead>\n<tr>\n<th>Sembol</th>\n<th>Anlamı</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">M</span></span></span></span></td>\n<td>Para arzı (İngilizce <em>money</em>)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">V</span></span></span></span></td>\n<td>Paranın dolaşım hızı: 1 TL&#39;nin bir yılda kaç kez el değiştirdiği (İngilizce <em>velocity</em>)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">P</span></span></span></span></td>\n<td>Genel fiyat düzeyi (İngilizce <em>price</em>)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Y</mi></mrow><annotation encoding=\"application/x-tex\">Y</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">Y</span></span></span></span></td>\n<td>Reel milli gelir, yani üretilen mal ve hizmet miktarı</td>\n</tr>\n</tbody></table>\n<p>Büyüme oranlarıyla yazıldığında:</p>\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>g</mi><mi>M</mi></msub><mo>+</mo><msub><mi>g</mi><mi>V</mi></msub><mo>=</mo><mi>π</mi><mo>+</mo><msub><mi>g</mi><mi>Y</mi></msub></mrow><annotation encoding=\"application/x-tex\">g_M + g_V = \\pi + g_Y</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7778em;vertical-align:-0.1944em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">g</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3283em;\"><span style=\"top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.10903em;\">M</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.625em;vertical-align:-0.1944em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">g</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3283em;\"><span style=\"top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.22222em;\">V</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">π</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.625em;vertical-align:-0.1944em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">g</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3283em;\"><span style=\"top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.22222em;\">Y</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span></span></span></span></span>\n<p>Yani para arzının büyümesi ($g_M$) ve dolaşım hızındaki değişme ($g_V$) toplamı, enflasyon ($\\pi$) ile reel büyümenin ($g_Y$) toplamına eşittir. Para arzı, üretimden ve dolaşım hızındaki değişmeden daha hızlı artarsa fark enflasyon olarak ortaya çıkar.</p>\n<blockquote class=\"callout note\"><p class=\"ct\">Not</p><p><a href=\"#sec-merkez-bankasi\">Merkez Bankası</a> için Hayek&#39;in yansız para kuralı seçildi: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mo>×</mo><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">M \\times V</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">M</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">V</span></span></span></span> sabit tutulur. Bu kural dolaşım hızındaki değişmeleri (PA-25) doğrudan hesaba katar.</p>\n</blockquote>\n<hr>\n<h3>Kısa vade ve uzun vade</h3>\n<p>Para arzının etkileri zamana göre değişir. Bu, formül kurarken en önemli noktadır.</p>\n<table>\n<thead>\n<tr>\n<th>Dönem</th>\n<th>Ne olur?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Kısa vade (0-2 yıl)</strong></td>\n<td>Para arzındaki değişme önce üretimi, istihdamı ve faizi etkiler. Fiyatlar yavaş tepki verir.</td>\n</tr>\n<tr>\n<td><strong>Uzun vade (2+ yıl)</strong></td>\n<td>Üretim ve istihdam eski seyrine döner. Para arzındaki değişmenin neredeyse tamamı fiyatlara yansır. Buna <strong>paranın yansızlığı</strong> denir.</td>\n</tr>\n</tbody></table>\n<p>Bu yüzden para arzını artırarak kalıcı büyüme sağlanamaz. Kısa vadede sağlanan büyüme, uzun vadede enflasyon olarak geri döner.</p>\n<hr>\n<h3>1. Fiyatlar</h3>\n<table>\n<thead>\n<tr>\n<th>Kod</th>\n<th>Etki</th>\n<th>Para arzı genişlerse</th>\n<th>Para arzı daralırsa</th>\n<th>Ölçülebilir gösterge</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>PA-1</td>\n<td>Tüketici enflasyonu</td>\n<td>Yükselir (1-2 yıl gecikmeyle).</td>\n<td>Düşer. Aşırı daralmada fiyatlar düşmeye başlar (deflasyon).</td>\n<td>TÜFE (TÜİK)</td>\n</tr>\n<tr>\n<td>PA-2</td>\n<td>Çekirdek enflasyon</
