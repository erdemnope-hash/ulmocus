<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ulmocus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
/* Layout: dark channel-style masthead (gold category box, tall condensed titles cream + theme color), posts as theme-colored cards, single reading column. Dark-first; each post has its own theme color like the thumbnails. */
:root{
  --bg:#0c1311; --surface:#131d1a; --fg:#f1e8d4; --muted:#9aa89f; --line:#243430;
  --gold:#d4a84b; --gold-soft:#2a2414;
  --th-red:#d9483b; --th-green:#4aa86a; --th-blue:#4a86d9;
  --font-t:'Anton','Impact',sans-serif; --font-b:'Inter',system-ui,sans-serif; --font-r:'Newsreader',Georgia,serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3eee1; --surface:#fbf8ef; --fg:#1b2420; --muted:#66716a; --line:#dcd4bf;
  --gold:#8a6414; --gold-soft:#efe3c3;
  --th-red:#b3281c; --th-green:#237a45; --th-blue:#2a5fb0; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3eee1; --surface:#fbf8ef; --fg:#1b2420; --muted:#66716a; --line:#dcd4bf;
  --gold:#8a6414; --gold-soft:#efe3c3;
  --th-red:#b3281c; --th-green:#237a45; --th-blue:#2a5fb0; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:var(--font-t);font-size:28px;letter-spacing:.04em;text-transform:uppercase}
.logo span{color:var(--gold)}
nav{display:flex;gap:4px}
nav a{padding:6px 12px;color:var(--muted);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
nav a:hover{color:var(--gold)}
.cat{display:inline-block;border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:5px 10px}
.meta{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
main{padding:32px 0 8px}
.title{font-family:var(--font-t);font-weight:400;text-transform:uppercase;line-height:1.02;margin:0;text-wrap:balance}
.title .l1{display:block;color:var(--fg)}
.title .l2{display:block;color:var(--th)}
/* hero */
.hero{position:relative;display:block;overflow:hidden;border:1px solid var(--line);background:linear-gradient(120deg,color-mix(in srgb,var(--th) 22%,var(--surface)),var(--surface) 70%);padding:32px 28px 36px;min-height:300px}
.hero .title{font-size:clamp(40px,8vw,78px);margin:16px 0 14px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{font-family:var(--font-r);font-size:20px;max-width:46ch;margin:0 0 14px;color:var(--fg)}
.hero:hover .l2,.card:hover .l2{filter:brightness(1.15)}
.spark{position:absolute;left:0;right:0;bottom:0;height:90px;width:100%;opacity:.35;pointer-events:none}
.spark path{fill:none;stroke:var(--th);stroke-width:3}
.hero>*:not(.spark){position:relative}
h2.sec{font-family:var(--font-t);font-weight:400;font-size:22px;letter-spacing:.08em;text-transform:uppercase;margin:40px 0 14px;display:flex;align-items:center;gap:14px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:12px;min-width:0;border:1px solid var(--line);border-top:3px solid var(--th);background:var(--surface);padding:20px}
.card .title{font-size:30px}
.card p{margin:0;font-family:var(--font-r);font-size:17px;color:var(--muted)}
.card .meta{margin-top:auto}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tags button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.tags button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:40px}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links a{border:1px solid var(--line);padding:8px 14px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.links a:hover{border-color:var(--gold);color:var(--gold)}
/* post */
.post{max-width:680px;margin:0 auto}
.post .title{font-size:clamp(40px,8vw,68px);margin:16px 0 14px}
.post .lead{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 22px}
.post .rule{height:3px;width:72px;background:var(--th);margin-bottom:26px}
.prose{font-family:var(--font-r);font-size:20px;line-height:1.7}
.prose p{margin:0 0 1.1em}
.prose h3{font-family:var(--font-t);font-weight:400;font-size:28px;letter-spacing:.04em;text-transform:uppercase;margin:1.5em 0 .5em}
.prose blockquote{margin:1.4em 0;padding:0 0 0 18px;border-left:3px solid var(--th);color:var(--muted);font-style:italic}
.back{display:inline-block;margin-bottom:22px;color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.back:hover{color:var(--gold)}

.prose table{width:100%;border-collapse:collapse;font-family:var(--font-b);font-size:15px;line-height:1.45;margin:0 0 1.2em;display:block;overflow-x:auto}
.prose th,.prose td{text-align:left;padding:8px 12px;border:1px solid var(--line);vertical-align:top}
.prose th{background:var(--surface);color:var(--gold);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.prose ul,.prose ol{margin:0 0 1.1em;padding-left:1.4em}.prose li{margin-bottom:.3em}
.prose h2{font-family:var(--font-t);font-weight:400;font-size:34px;letter-spacing:.03em;text-transform:uppercase;margin:1.8em 0 .5em;color:var(--fg)}
.prose h3{font-size:26px;color:var(--th)}
.prose h5{font-family:var(--font-b);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:1.4em 0 .4em}
.prose h4{font-family:var(--font-b);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:1.6em 0 .5em}
.prose a{color:var(--gold);border-bottom:1px solid var(--line)}
.prose a:hover{border-color:var(--gold)}
.prose code{font-family:ui-monospace,Consolas,monospace;font-size:.82em;background:var(--surface);padding:1px 5px}
.prose pre{background:var(--surface);border:1px solid var(--line);padding:14px 16px;overflow-x:auto;font-size:14px;line-height:1.5;margin:0 0 1.2em}
.prose pre code{background:none;padding:0}
.prose hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.prose .katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 0}
.prose blockquote.callout{font-style:normal;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);padding:12px 16px;font-family:var(--font-b);font-size:15px;line-height:1.55}
.prose blockquote.callout p{margin:0 0 .5em}.prose blockquote.callout p:empty{display:none}
.prose blockquote.callout .ct{font-weight:600;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.prose blockquote.warning,.prose blockquote.danger{border-left-color:var(--th-red)}
.prose blockquote.info,.prose blockquote.tip{border-left-color:var(--th-blue)}

.pw{display:grid;grid-template-columns:230px minmax(0,680px);gap:48px;justify-content:center;align-items:start}
.pw .post{margin:0;max-width:none;min-width:0}
.toc{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;overflow-x:hidden;font-size:14px;padding:0 0 16px;border-right:1px solid var(--line);padding-right:14px}
.toc-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.toc-h b{font-family:var(--font-t);font-weight:400;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.toc-h button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.toc ul{list-style:none;margin:0;padding:0}
.toc li ul{padding-left:14px}
.toc a{display:block;padding:4px 8px;color:var(--muted);line-height:1.35;border-left:2px solid transparent}
.toc a:hover{color:var(--gold)}
.toc a.on{color:var(--fg);font-weight:600;border-left-color:var(--gold)}
.toc.off ul{display:none}
.toc a{overflow-wrap:anywhere;word-break:break-word}
.toc>ul>li>ul{display:none}
.toc>ul>li.open>ul{display:block}
.toc>ul>li.has>a::before{content:"A";display:inline-block;width:12px;margin-right:2px;transition:transform .15s}
.toc>ul>li.has.open>a::before{transform:rotate(90deg)}
.toc>ul>li:not(.has)>a{padding-left:22px}
.tocbtn{display:none}
@media(max-width:900px){
  .pw{grid-template-columns:minmax(0,1fr);gap:0}
  .toc{position:static;max-height:none;border:1px solid var(--line);background:var(--surface);padding:12px 14px;margin-bottom:24px}
}
.prose h2,.prose h3,.prose h4{scroll-margin-top:16px}
footer{margin:56px 0 24px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;letter-spacing:.06em}
</style>

    <nav aria-label="Ana menü"><a href="#yazilar">Yazılar</a><a href="#hakkinda">Hakkında</a></nav>

<script>
var C={red:'var(--th-red)',green:'var(--th-green)',blue:'var(--th-blue)'};
var POSTS=[{"id":"sendika-sistemi","cat":"Sendika sistemi","th":"blue","l1":"Sendika","l2":"sistemi","sub":"Türkiye için bir tasarım","lead":"Her meslekte ve her sektörde kurulabilen, işyerine kadar bölünen, üyelerinin doğrudan yönettiği ve işçiyi güçlü kurallarla koruyan bir sendika düzeni.","date":"19 Kasım 2026","min":54,"html":"<h2 id=\"sec-sendika-sistemi\">Genel bakış</h2><p>Her meslekte ve her sektörde kurulabilen, işyerine kadar bölünen, üyelerinin doğrudan yönettiği ve işçiyi güçlü kurallarla koruyan bir sendika düzeni.</p>\n<h3>Temel fikir</h3>\n<p>Yeri zor doldurulan işçinin tek başına pazarlık gücü vardır: ayrılırsa işveren zor durumda kalır. Yeri kolay doldurulan işçinin bu gücü yoktur, onu ancak birlikte hareket etmek korur. Bu yüzden sistem herkese sendika hakkı tanır ve sendikalı işçiyi işten çıkarmaya ve grevi kırmaya karşı güçlü kurallarla korur.</p>\n<blockquote class=\"callout tip\"><p class=\"ct\">Hızlı başlangıç</p><p>Bütün sistemi tek sayfada görmek için → <a href=\"#sec-ozet\">Özet</a></p>\n</blockquote>\n<h3>Bölümler</h3>\n<ol>\n<li><a href=\"#sec-sendika-hakki\">Sendika Hakkı</a>: Kim sendika kurabilir, sendika nasıl örgütlenir?</li>\n<li><a href=\"#sec-olcum-kurulu\">Ölçüm Kurulu</a>: Üye sayılarını kim ölçer, teknik kararları kim verir?</li>\n<li><a href=\"#sec-iscinin-korunmasi\">İşçinin Korunması</a>: İşveren sendikalı işçiyi nasıl kovamaz?</li>\n<li><a href=\"#sec-finansman\">Finansman</a>: Sendika parasını nereden bulur?</li>\n<li><a href=\"#sec-grev-fonu\">Grev Fonu</a>: Grevdeki işçiye nasıl destek olunur?</li>\n<li><a href=\"#sec-grev-ve-yonetim\">Grev ve Yönetim</a>: Grev kararı, zam talebi, sendikanın yönetimi ve denetimi</li>\n<li><a href=\"#sec-kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a>: Kayıtsız çalıştırılan işçiler nasıl tespit edilir?</li>\n<li><a href=\"#sec-yargi-bagimsizligi\">Yargı Bağımsızlığı</a>: Sistemin dayandığı mahkemeler nasıl bağımsız olur?</li>\n<li><a href=\"#sec-gereken-anayasa-degisiklikleri\">Gereken Anayasa Değişiklikleri</a>: Sistemin uygulanması için hangi Anayasa maddeleri, kanunlar ve antlaşmalar değişmeli?</li>\n<li><a href=\"#sec-memurlar\">Memurlar</a>: Sistem kamu çalışanlarına nasıl uygulanır?</li>\n<li><a href=\"#sec-kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a>: Bağımsız kurulların parası nereden gelir, başlarına kim gelir?</li>\n</ol>\n<h3>Sistemin akışı</h3>\n<ol>\n<li>Her sektörde, işyerlerine kadar şubelere bölünen tek bir sendika vardır (<a href=\"#sec-sendika-hakki\">Sendika Hakkı</a>).</li>\n<li>Üyeler giriş katkısı ve düşük bir sabit aidat öder (<a href=\"#sec-finansman\">Finansman</a>).</li>\n<li>Şube, marka ya da sektör düzeyinde toplu sözleşme talebi oylanır ve pazarlığa oturulur (<a href=\"#sec-grev-ve-yonetim\">Grev ve Yönetim</a>).</li>\n<li>Zam enflasyonun üstündeyse üyeler gerçek kazançlarının bir kısmını <a href=\"#sec-grev-fonu\">Grev Fonu</a>na öder.</li>\n<li>Anlaşma olmazsa üyeler grev kararı alır. Grevde işçiler <a href=\"#sec-iscinin-korunmasi\">İşçinin Korunması</a> kurallarıyla güvence altındadır.</li>\n</ol>\n<h3>Yeni sisteme geçiş</h3>\n<p>Mevcut sendikaların parası işçilere hizmet etmeye devam eder: Bir sektördeki mevcut sendikaların parası yeni sektör sendikasına geçer ve <a href=\"#sec-grev-fonu\">Grev Fonu</a>nun başlangıç sermayesi olur.</p>\n<h3>Açık konular</h3>\n<blockquote class=\"callout question\"><p class=\"ct\">Henüz karar verilmedi</p><p></p>\n<ul>\n<li><strong>Sabit aidat oranı:</strong> Formül belirlendi (<a href=\"#sec-finansman\">Finansman</a>). Kesin oran, sendikanın gerçek giderleri belli olunca hesaplanacak.</li>\n<li><strong>Kurulların fonu:</strong> SGK prim payının oranı ve Hazine taban güvencesinin formülü (<a href=\"#sec-kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a>).</li>\n<li><strong>Seçim kurallarının sayıları:</strong> Geri çağırma eşiği, güven oylaması kuralı, görev süresi sınırı ve nispi temsilde koltuk dağıtım yöntemi (<a href=\"#sec-grev-ve-yonetim\">Grev ve Yönetim</a>).</li>\n</ul>\n</blockquote>\n<h2 id=\"sec-ozet\">Tek sayfada özet</h2><p>Bu not, bütün sistemi tek sayfada anlatır. Ayrıntılar için her başlıktaki bağlantıya tıkla.</p>\n<h3>Temel fikir</h3>\n<p>Yeri zor doldurulan işçinin tek başına pazarlık gücü vardır. Yeri kolay doldurulan işçinin bu gücü yoktur, onu ancak birlikte hareket etmek korur. Bu yüzden sistem <strong>herkese sendika hakkı tanır</strong> ve sendikalı işçiyi işten çıkarmaya ve grevi kırmaya karşı güçlü kurallarla korur.</p>\n<h3>1. Kimin sendika hakkı var? → <a href=\"#sec-sendika-hakki\">Sendika Hakkı</a></h3>\n<ul>\n<li><strong>Her meslekte ve her sektörde</strong> sendika kurulabilir. Bütün çalışanlar ve memurlar üye olabilir.</li>\n<li>Her sektörün <strong>tek bir sendikası</strong> vardır. Sendika <strong>marka</strong> ve <strong>şube</strong> olarak bölünür. Karar gücü işyerlerine dağıldığı için bu bir tekel değildir, sadece ad olarak tek sendikadır.</li>\n<li>Kurallar memurlara da uygulanır. Kamuda seviyeler kamu geneli, hizmet kolu, kurum ve birimdir → <a href=\"#sec-memurlar\">Memurlar</a></li>\n</ul>\n<h3>2. Sayıları kim ölçer? → <a href=\"#sec-olcum-kurulu\">Ölçüm Kurulu</a></h3>\n<ul>\n<li>Kurul üye sayılarını 6 ayda bir ölçer, sektör grevleri için ağırlık tablosunu yayınlar, işyerlerinin hangi sektöre ve markaya ait olduğuna ve hangi işlerin hayati hizmet sayılacağına karar verir.</li>\n<li>TÜİK veriyi sağlar. İşçi ve işveren temsilcileri eşit oy kullanır. Eşitlikte kurul başkanı karar verir.</li>\n<li>Kurul kararlarına itiraz edilebilir, ama itiraz hiçbir şeyi durdurmaz ve 30 günde sonuçlanır.</li>\n</ul>\n<h3>3. Sendika parasını nereden bulur? → <a href=\"#sec-finansman\">Finansman</a></h3>\n<table>\n<thead>\n<tr>\n<th>Kaynak</th>\n<th>Ne kadar</th>\n<th>Nereye gider</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Sabit aidat</strong></td>\n<td>Brüt ücretin küçük bir yüzdesi, işçi her ay kendisi öder</td>\n<td>Sendikanın sabit giderleri</td>\n</tr>\n<tr>\n<td><strong>Kazanım payı</strong></td>\n<td>Zammın enflasyonun <strong>üstündeki</strong> kısmının %20&#39;si</td>\n<td>Grev fonu</td>\n</tr>\n<tr>\n<td><strong>Giriş katkısı</strong></td>\n<td>Net asgari ücretin %10&#39;u, 3 aya bölünür</td>\n<td>Grev fonu</td>\n</tr>\n</tbody></table>\n<ul>\n<li>Zam enflasyonun altında kalırsa üye kazanım payı ödemez. Yani üye asıl ödemeyi, sendika ona <strong>gerçekten kazandırdıktan sonra</strong> yapar.</li>\n<li>Aidatını 3 ay ödemeyen oy hakkını, 6 ay ödemeyen grev yardımı hakkını kaybeder. 12 ay ödemeyenin üyeliği düşer.</li>\n</ul>\n<h3>4. Grevde işçiye nasıl destek olunur? → <a href=\"#sec-grev-fonu\">Grev Fonu</a></h3>\n<ul>\n<li>Grevdeki her üyeye her gün <strong>net asgari ücretin yarısı</strong> kadar yardım verilir.</li>\n<li>Fon, bütün üyelere <strong>30 gün</strong> yardım verebilecek büyüklükte olmalıdır. Fon dolunca kazanım payı alınmaz.</li>\n<li>Yeni sisteme geçerken bir sektördeki bütün mevcut sendikaların parası yeni sektör sendikasının grev fonuna geçer.</li>\n</ul>\n<h3>5. Kararlar nasıl alınır? → <a href=\"#sec-grev-ve-yonetim\">Grev ve Yönetim</a></h3>\n<p>Grev, toplu sözleşme ve zam talebi kararları aynı kurallarla, üç seviyede alınır:</p>\n<table>\n<thead>\n<tr>\n<th>Seviye</th>\n<th>Gereken</th>\n<th>Kim katılır</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Şube</strong></td>\n<td>Oy kullananların çoğunluğu evet <strong>ve</strong> evetler üyelerin en az %40&#39;ı</td>\n<td>O şube</td>\n</tr>\n<tr>\n<td><strong>Marka</strong></td>\n<td>Şubelerin çoğunluğu <strong>ve</strong> markanın toplamı bu şartı sağlamalı</td>\n<td>Markanın bütün şubeleri</td>\n</tr>\n<tr>\n<td><strong>Sektör</strong></td>\n<td>Evet diyen markaların ağırlıklı oranı en az %40 (her markanın ağırlığı = üye sayısının karekökü)</td>\n<td>Sadece evet diyen markalar</td>\n</tr>\n</tbody></table>\n<ul>\n<li>Oylama gizlidir. Oy kullanmamak grevi engellemez, karşı olan hayır oyu vermelidir.</li>\n<li>Sözleşmeler katmanlıdır: Üst seviye taban oluşturur, alt seviye üstüne ekler. Sektör sözleşmesi sadece talebe evet diyen markaları bağlar.</li>\n<li>Her seviyenin kendi zam kurulu ve yönetimi vardır. Yönetimin yarısı her yıl yenilenir.</li>\n<li>Delege sistemi yoktur: Başkanı ve yönetimi üyeler doğrudan seçer. Yönetim, listelerin oy oranına göre dağıtılır (nispi temsil). Üyeler imza toplayarak yönetimi güven oylamasına götürebilir. Görev süresi sınırı vardır.</li>\n<li>Oy gizliliği teknik olarak korunur: Kimin ne oy verdiği ve kimin oy kullanıp kullanmadığı görülemez. Oylama elektronik yapılabilir.</li>\n<li>Hesapları bağımsız denetçiler inceler, raporlar iş mahkemesine sunulur ve üyelere açıktır.</li>\n<li>Cumhurbaşkanının grevi erteleme yetkisi kaldırılır. Hayati hizmetlerde asgari hizmet sürdürülür.</li>\n</ul>\n<h3>6. İşçi nasıl korunur? → <a href=\"#sec-iscinin-korunmasi\">İşçinin Korunması</a></h3>\n<ul>\n<li>İşyerinde ilk sendika üyeliği kaydedildiği andan itibaren üye işçiyi çıkarmak için <strong>Sendikal Koruma Kurulu</strong>&#39;nun onayı gerekir. Kurul 15 günde karar verir.</li>\n<li>Sendikal nedenle çıkarılan işçi işe geri alınır. İşveren tazminat ödeyerek kurtulamaz.</li>\n<li>Çıkarmanın sendikal olmadığını işveren kanıtlar.</li>\n<li>Grevdeki işçinin yerine işçi alan, işi başka yere kaydıran ya da diğer şubelerden personel getiren işveren, <strong>her işçi için bir yıllık ücret</strong> kadar ceza öder.</li>\n<li>Memurlar için sürgün yasağı vardır.</li>\n</ul>\n<h3>7. Kayıt dışılıkla nasıl mücadele edilir? → <a href=\"#sec-kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a></h3>\n<ul>\n<li>Şirket hesabından aynı kişiye düzenli ve benzer tutarlarda ödeme yapılıyorsa, kişinin SGK kaydı otomatik kontrol edilir.</li>\n<li>Kayıtsızsa <strong>Kayıt Dışılık Kurulu</strong> inceler ve ceza keser. Banka verisine sadece bu kurul erişir.</li>\n<li><strong>Bağımsız Veri Denetçisi</strong>, verilerin sadece bu amaçla kullanıldığını denetler.</li>\n</ul>\n<h3>8. Sistemin güvenceleri → <a href=\"#sec-yargi-bagimsizligi\">Yargı Bağımsızlığı</a>, <a href=\"#sec-kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a></h3>\n<ul>\n<li>Bütün kurulların başkanları ve uzman üyeleri <strong>karşılıklı eleme yöntemiyle</strong> seçilir: Sendikalar ve işveren örgütleri eşit sayıda aday önerir, her taraf karşı tarafın bazı adaylarını eler, kalanlar arasından kura çekilir. Görev süresi 4 yıldır ve yenilenemez → <a href=\"#sec-kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a></li>\n<li>Kurulların parası ortak bir fondan gelir: Ana kaynak SGK primine eklenen küçük bir pay. Bütçe kanuni bir tabanın altına düşerse Hazine farkı kapatır. Cezalar kurullara değil İşsizlik Sigortası Fonu&#39;na gider.</li>\n<li>Kurullar mahkemelere bağlı değildir. Mahkemeler sadece kurul kararlarına yapılan itirazlara bakar.</li>\n<li>Kurul kararları ve verileri kamuya açıktır.</li>\n<li>Hâkim ve Savcılar Kurulu&#39;nun yeniden yapılandırılması gibi genel yargı reformları önerilir.</li>\n</ul>\n<h3>9. Ne değişmeli? → <a href=\"#sec-gereken-anayasa-degisiklikleri\">Gereken Anayasa Değişiklikleri</a></h3>\n<ul>\n<li>Anayasa&#39;nın 53, 54, 90, 139–140 ve 159. maddeleri değişmeli, kurulların bağımsızlığı için yeni bir madde eklenmeli.</li>\n<li>6356, 4688, 657, 4857, 5510, 5549 ve 6698 sayılı kanunlar değişmeli.</li>\n<li>Sendika hakkı herkese tanındığı için kararların büyük çoğunluğu uluslararası standartlarla uyumlu. Kalan iki çatışma, yani tek sendika ve iç yönetimin kanunla belirlenmesi, bilinçli tercihler.</li>\n</ul>\n<blockquote class=\"callout important\"><p class=\"ct\">Temel ilke</p><p>Ne olursa olsun, hangi engel olursa olsun, kendi işçimizden ve memurumuzdan önemlisi yoktur.</p>\n</blockquote>\n<h3>Açık konular</h3>\n<ul>\n<li><strong>Sabit aidat oranı:</strong> Formül hazır. Kesin oran, gerçek bir sendikanın giderleri ve üye sayısı belli olunca hesaplanacak.</li>\n<li><strong>Seçim kurallarının sayıları:</strong> Geri çağırma eşiği, görev süresi sınırı ve nispi temsilde koltuk dağıtım yöntemi.</li>\n</ul>\n<p>Ana harita → <a href=\"#sec-sendika-sistemi\">Sendika Sistemi</a></p>\n<h2 id=\"sec-sendika-hakki\">Sendika Hakkı</h2><p><strong>Her meslekte ve her sektörde sendika kurulabilir.</strong> Bütün çalışanlar, memurlar da dahil, sendikaya üye olabilir. Sendikalaşmanın birimi tek tek meslekler değil, <strong>sektörlerdir (işkolu)</strong>. Bir sektördeki herkes, usta da çırak da, uzman da, o sektörün sendikasına üye olabilir.</p>\n<h3>Sendikanın yapısı</h3>\n<p>Her sektörün <strong>tek bir sendikası</strong> vardır. Sendika kendi içinde <strong>marka</strong> ve <strong>şube</strong> olarak bölünür. Her şube bir alt kademe sendika gibi hareket eder ve kendi içinde karar alabilir. Grev, toplu sözleşme ve zam talebi kararlarının bu seviyelerde nasıl alındığı <a href=\"#sec-grev-ve-yonetim\">Grev ve Yönetim</a> notunda yazılıdır.</p>\n<h4>Tek sendika neden tekel değildir?</h4>\n<p>Sektördeki tek sendika sadece <strong>ad olarak</strong> tektir. Sendika şube şube ayrılabilen parçalı bir yapıdır: Her şube kendi kararını alır, kendi zam kurulunu ve yönetimini seçer, kendi sözleşmesini yapabilir ve kendi başına greve gidebilir. Sektör düzeyinde bile greve sadece evet diyen markalar katılır. Yani karar gücü tek bir merkezde toplanmaz, işyerlerine dağılır.</p>\n<h3>Değerlendirilip kaldırılan kural: Yerine konabilirlik ölçütü</h3>\n<p>Sistemin önceki halinde sendika hakkı sadece yeri kolay doldurulan işçilerin yoğun olduğu sektörlere tanınıyordu:</p>\n<ul>\n<li>Bir işçi dört kriterden en az üçünü sağlıyorsa yeri kolay doldurulur sayılıyordu: öğrenme süresi 3 aydan kısa, belge şartı yok, aday bol, yeri 2 haftadan kısa sürede doluyor.</li>\n<li>Bu işçilerin oranı en az %35 olan sektörler sendika hakkı kazanıyordu.</li>\n</ul>\n<p>Bu kural <strong>kaldırıldı.</strong> Kuralın en büyük yan etkisi, eşiği geçemeyen sektörlerdeki herkesi, yeri kolay doldurulan işçiler de dahil, sendikasız bırakmasıydı. Kural kalkınca sistemin uluslararası sözleşmelerle en büyük çatışması da ortadan kalktı.</p>\n<h3>Bağlantılı bölümler</h3>\n<ul>\n<li><a href=\"#sec-grev-ve-yonetim\">Grev ve Yönetim</a>: Sektör, marka ve şube seviyelerinde kararların nasıl alındığı</li>\n<li><a href=\"#sec-olcum-kurulu\">Ölçüm Kurulu</a>: Sektörlerin ve markaların üye sayılarını ölçer.</li>\n<li><a href=\"#sec-iscinin-korunmasi\">İşçinin Korunması</a>: Sendikalı işçinin işten çıkarılmasına ve grev kırıcılığına karşı korumalar</li>\n<li><a href=\"#sec-kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a>: Kayıt dışı çalışan işçi sendikaya üye olamaz ve korumalardan yararlanamaz.</li>\n<li><a href=\"#sec-memurlar\">Memurlar</a>: Sistemin kamu çalışanlarına uygulanışı</li>\n<li><a href=\"#sec-gereken-anayasa-degisiklikleri\">Gereken Anayasa Değişiklikleri</a>: Tek sendika ve kanunla belirlenen iç yönetim kuralları için gereken değişiklikler</li>\n</ul>\n<p>Ana harita → <a href=\"#sec-sendika-sistemi\">Sendika Sistemi</a></p>\n<h2 id=\"sec-olcum-kurulu\">Ölçüm Kurulu</h2><p>Sistemin işlemesi için gereken sayıları ölçen ve teknik kararları veren kurul.</p>\n<h3>Görevleri</h3>\n<table>\n<thead>\n<tr>\n<th>Görev</th>\n<th>Açıklama</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Üye sayılarını ölçmek</strong></td>\n<td>Her sektörün, markanın ve şubenin oy hakkı olan üye sayısını ölçer. Bu sayılar oylamalarda ve grev fonu hedefinin hesaplanmasında kullanılır.</td>\n</tr>\n<tr>\n<td><strong>Sektör grevi ağırlık tablosu</strong></td>\n<td>Her sektör grevi oylamasından önce her markanın üye sayısını ve kare kök ağırlığını bir tabloda yayınlar (bkz. <a href=\"#sec-grev-ve-yonetim\">Grev ve Yönetim</a>).</td>\n</tr>\n<tr>\n<td><strong>Marka ve şube sınırları</strong></td>\n<td>Bir işyerinin hangi sektöre ve markaya ait olduğuna karar verir. Aynı şirket grubuna ait markaları tek marka olarak sayar. Franchise şubeleri markanın parçası olarak kaydeder.</td>\n</tr>\n<tr>\n<td><strong>Hayati hizmetler</strong></td>\n<td>Hangi işlerin hayati hizmet sayılacağına karar verir. Bu işlerde grev sırasında asgari hizmet sürdürülür (bkz. <a href=\"#sec-grev-ve-yonetim\">Grev ve Yönetim</a>).</td>\n</tr>\n</tbody></table>\n<h3>Yapısı</h3>\n<table>\n<thead>\n<tr>\n<th>Üye</th>\n<th>Rolü</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>TÜİK</td>\n<td>Veriyi sağlar, oy kullanmaz.</td>\n</tr>\n<tr>\n<td>İşçi temsilcileri</td>\n<td>Oy kullanır.</td>\n</tr>\n<tr>\n<td>İşveren temsilcileri</td>\n<td>İşçi temsilcileriyle eşit sayıda oy kullanır.</td>\n</tr>\n<tr>\n<td>Başkan</td>\n<td>Oylarda eşitlik olursa eşitliği bozar. <strong>Karşılıklı eleme yöntemiyle</strong> seçilir (bkz. <a href=\"#sec-kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a>).</td>\n</tr>\n</tbody></table>\n<p>İşçi temsilcilerini sektör sendikaları, işveren temsilcilerini işveren örgütleri kendi aralarında seçer. Temsilcilerin görev süresi <strong>2 yıldır</strong> ve yenilenemez.</p>\n<p>Kurulun kararları, gerekçeleri ve kullandığı veriler <strong>kamuya açıktır</strong>.</p>\n<h3>Ölçüm sıklığı</h3>\n<ul>\n<li>Üye sayıları <strong>6 ayda bir</strong> güncellenir.</li>\n<li>Sektör grevi oylamalarından önce ağırlık tablosu ayrıca güncellenir.</li>\n</ul>\n<h3>İtiraz</h3>\n<ul>\n<li>Kurul kararlarına itiraz edilebilir.</li>\n<li>İtiraz <strong>hiçbir şeyi durdurmaz.</strong> İtiraz sürerken sendika çalışmaya, toplu sözleşme görüşmeleri de devam eder.</li>\n<li>İtirazlar <strong>30 gün içinde</strong> karara bağlanır.</li>\n</ul>\n<h3>Bağlantılı bölümler</h3>\n<ul>\n<li><a href=\"#sec-grev-ve-yonetim\">Grev ve Yönetim</a>: Kurulun ölçtüğü üye sayıları oylamalarda kullanılır. Kurulun belirlediği hayati hizmetlerde grevde asgari hizmet sürdürülür.</li>\n<li><a href=\"#sec-grev-fonu\">Grev Fonu</a>: Fon hedefi üye sayısına bağlıdır.</li>\n<li><a href=\"#sec-kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a>: Kurulun bütçesi ve başkanının seçimi</li>\n<li><a href=\"#sec-yargi-bagimsizligi\">Yargı Bağımsızlığı</a>: Kurul kararlarına yapılan itirazlara iş mahkemeleri bakar.</li>\n<li><a href=\"#sec-kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a>: Kayıt dışı işçiler tespit edilmezse üye sayıları eksik kalır.</li>\n</ul>\n<p>Ana harita → <a href=\"#sec-sendika-sistemi\">Sendika Sistemi</a></p>\n<h2 id=\"sec-grev-ve-yonetim\">Grev ve Yönetim</h2><blockquote class=\"callout info\"><p class=\"ct\">Kanunla zorunlu</p><p>Bu nottaki zam kurulu, yönetimin yenilenmesi, seçim ve denetim kuralları kanunla <strong>bütün sendikalar için zorunludur.</strong> Sendikalar tüzükleriyle bu kuralları değiştiremez. Böylece sistem her sendikada aynı işler ve gelecekte sendika yönetimine gelenler bu kuralları <strong>keyfi olarak değiştiremez.</strong> Bu, bilerek konmuş bir engeldir. Karar ILO 87 md. 3 ile çatışır (bkz. <a href=\"#sec-gereken-anayasa-degisiklikleri\">Gereken Anayasa Değişiklikleri</a>).</p>\n</blockquote>\n<h3>Toplu sözleşme</h3>\n<h4>Hangi seviyede yapılır?</h4>\n<p>Toplu sözleşme, <strong>talebi başlatan birimin</strong> seviyesinde yapılır: şube, marka ya da sektör. Görüşmeler başarısız olursa grev de aynı seviyede yapılır.</p>\n<p>Talebi başlatmak için grevdeki oylama kuralları kullanılır (aşağıda):</p>\n<table>\n<thead>\n<tr>\n<th>Seviye</th>\n<th>Talebi başlatmak için gereken</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Şube</td>\n<td>Şubede temel kural: oy kullananların çoğunluğu evet ve evetler üyelerin en az %40&#39;ı</td>\n</tr>\n<tr>\n<td>Marka</td>\n<td>Çifte çoğunluk</td>\n</tr>\n<tr>\n<td>Sektör</td>\n<td>Evet diyen markaların kare kök ağırlıklı oranı en az %40</td>\n</tr>\n</tbody></table>\n<h4>Katmanlı sözleşme</h4>\n<p>Bir işçi aynı anda sektör, marka ve şube sözleşmelerinin kapsamında olabilir. Üst seviyedeki sözleşme bir <strong>taban</strong> oluşturur. Alt seviyedeki sözleşme bu tabanın altına inemez, sadece üstüne ekleme yapabilir.</p>\n<table>\n<thead>\n<tr>\n<th>Seviye</th>\n<th>Neyi düzenler</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Sektör sözleşmesi</strong></td>\n<td>Talebe evet diyen markalarda asgari ücret ve çalışma koşulları</td>\n</tr>\n<tr>\n<td><strong>Marka sözleşmesi</strong></td>\n<td>Markaya özel ek zam ve haklar</td>\n</tr>\n<tr>\n<td><strong>Şube sözleşmesi</strong></td>\n<td>Vardiya düzeni, dinlenme alanı gibi işyerine özel konular</td>\n</tr>\n</tbody></table>\n<p>Kazanım payı <strong>her sözleşme için ayrı</strong> hesaplanır. Alt seviyedeki sözleşme, üst seviyenin zammını taban kabul eder ve sadece kendi eklediği gerçek kazançtan pay alır (bkz. <a href=\"#sec-finansman\">Finansman</a>).</p>\n<h4>Sektör sözleşmesi kimi bağlar?</h4>\n<p>Sektör sözleşmesi <strong>sadece talebe evet diyen markaları</strong> bağlar. Görüşmeler grevsiz biterse de aynı markalar bağlanır. Grev olursa greve de bu markalar katılır. Yani riski göze alanlar kazanımı alır. Böylece markaların &quot;nasılsa başkaları greve gider, biz de kazanırız&quot; diye düşünmesi engellenir.</p>\n<h4>Bir olasılık olarak: Asgari ücretin toplu sözleşmelere bırakılması</h4>\n<blockquote class=\"callout note\"><p class=\"ct\">Sadece olasılık</p><p>Bu fikir tartışma sırasında <strong>sadece bir olasılık olarak</strong> dile getirildi. Desteklenen ya da savunulan bir fikir değildir ve sistemin parçası değildir.</p>\n</blockquote>\n<p>Fikir şu: Uzun vadede asgari ücret ve zam belirleme devletten alınıp tamamen toplu sözleşmelere bırakılabilir. Danimarka, İsveç, Norveç, Finlandiya ve Avusturya&#39;da yasal asgari ücret yoktur, ücretleri toplu sözleşmeler belirler. Bunun ön koşulu, yüksek sendikalaşma oranı ve toplu sözleşmelerin çalışanların büyük çoğunluğunu kapsamasıdır.</p>\n<p>Sistemimizde grev yardımı, giriş katkısı ve grev fonu hedefi asgari ücrete bağlı olduğu için, bu olasılık ileride gündeme gelirse bu formüller için başka bir ölçü belirlemek gerekir.</p>\n<h3>Grev kararı</h3>\n<p>Her sektörün tek bir sendikası vardır. Sendika kendi içinde <strong>marka</strong> ve <strong>şube</strong> olarak bölünür. Her şube, bir alt kademe sendika gibi hareket eder. Grev kararı, grevin kapsamına göre üç seviyede alınır.</p>\n<pre><code>Sektör sendikası\n├── Marka A\n│   ├── Şube 1\n│   ├── Şube 2\n│   └── Şube 3\n└── Marka B\n    ├── Şube 1\n    └── Şube 2\n</code></pre>\n<p><strong>Oy kullananlar:</strong> Sadece sendika üyeleri. 3 aydır aidat ödemeyenlerin oy hakkı askıdadır.</p>\n<p><strong>Temel kural (evet oyu şartı):</strong> Bir birimin evet demiş sayılması için iki şart birlikte sağlanmalıdır:</p>\n<ol>\n<li>Oy kullananların çoğunluğu evet demeli.</li>\n<li>Evet oyları, o birimde oy hakkı olan <strong>tüm üyelerin en az %40&#39;ı</strong> olmalı.</li>\n</ol>\n<p>Bu kural sayesinde oy kullanmamak grevi engellemeye yardım etmez. Grevi istemeyen biri için en etkili yol, gidip hayır oyu vermektir. İşverenin işçileri oy kullanmamaya teşvik etmesi de sonuç vermez.</p>\n<table>\n<thead>\n<tr>\n<th>Seviye</th>\n<th>Grev için gereken</th>\n<th>Kim greve gider</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Şube</strong></td>\n<td>Şubede temel kural sağlanmalı</td>\n<td>O şube</td>\n</tr>\n<tr>\n<td><strong>Marka</strong></td>\n<td>Şubelerin salt çoğunluğunda temel kural sağlanmalı <strong>ve</strong> markanın toplamında temel kural sağlanmalı (çifte çoğunluk)</td>\n<td>Markanın bütün şubeleri</td>\n</tr>\n<tr>\n<td><strong>Sektör</strong></td>\n<td>Kendi içinde evet diyen markaların kare kök ağırlıklı oranı en az %40</td>\n<td>Sadece evet diyen markalar</td>\n</tr>\n</tbody></table>\n<h4>1. Şube grevi</h4>\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>E</mi><mover accent=\"true\"><mi>s</mi><mo>\\c</mo></mover></msub><mo>&gt;</mo><msub><mi>H</mi><mover accent=\"true\"><mi>s</mi><mo>\\c</mo></mover></msub><mspace width=\"2em\"/><mtext>ve</mtext><mspace width=\"2em\"/><msub><mi>E</mi><mover accent=\"true\"><mi>s</mi><mo>\\c</mo></mover></msub><mo>≥</mo><mn>0</mn><mo separator=\"true\" lspace=\"0em\ cirin ağırlığı: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>500</mn></msqrt><mo>≈</mo><mn>22</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt{500} \\approx 22{,}4</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1.04em;vertical-align:-0.1328em;\"></span><span class=\"mord sqrt\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.9072em;\"><span class=\"svg-align\" style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\" style=\"padding-left:0.833em;\"><span class=\"mord\">500</span></span></span><span style=\"top:-2.8672em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"hide-tail\" style=\"min-width:0.853em;height:1.08em;\"><svg xmlns=\"http://www.w3.org/2000/svg\" width='400em' height='1.08em' viewBox='0 0 400000 1080' preserveAspectRatio='xMinYMin slice'><path d='M95,702\nc-2.7,0,-7.17,-2.7,-13.5,-8c-5.8,-5.3,-9.5,-10,-9.5,-14\nc0,-2,0.3,-3.3,1,-4c1.3,-2.7,23.83,-20.7,67.5,-54\nc44.2,-33.3,65.8,-50.3,66.5,-51c1.3,-1.3,3,-2,5,-2c4.7,0,8.7,3.3,12,10\ns173,378,173,378c0.7,0,35.3,-71,104,-213c68.7,-142,137.5,-285,206.5,-429\nc69,-144,104.5,-217.7,106.5,-221\nl0 -0\nc5.3,-9.3,12,-14,20,-14\nH400000v40H845.2724\ns-225.272,467,-225.272,467s-235,486,-235,486c-2.7,4.7,-9,7,-19,7\nc-6,0,-10,-1,-12,-3s-194,-422,-194,-422s-65,47,-65,47z\nM834 80h400000v40h-400000z'/></svg></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.1328em;\"><span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">≈</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">22</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">4</span></span></span></span>. Büyük zincirin ağırlığı: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>10.000</mn></msqrt><mo>=</mo><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt{10.000} = 100</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1.04em;vertical-align:-0.1328em;\"></span><span class=\"mord sqrt\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.9072em;\"><span class=\"svg-align\" style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\" style=\"padding-left:0.833em;\"><span class=\"mord\">10.000</span></span></span><span style=\"top:-2.8672em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"hide-tail\" style=\"min-width:0.853em;height:1.08em;\"><svg xmlns=\"http://www.w3.org/2000/svg\" width='400em' height='1.08em' viewBox='0 0 400000 1080' preserveAspectRatio='xMinYMin slice'><path d='M95,702\nc-2.7,0,-7.17,-2.7,-13.5,-8c-5.8,-5.3,-9.5,-10,-9.5,-14\nc0,-2,0.3,-3.3,1,-4c1.3,-2.7,23.83,-20.7,67.5,-54\nc44.2,-33.3,65.8,-50.3,66.5,-51c1.3,-1.3,3,-2,5,-2c4.7,0,8.7,3.3,12,10\ns173,378,173,378c0.7,0,35.3,-71,104,-213c68.7,-142,137.5,-285,206.5,-429\nc69,-144,104.5,-217.7,106.5,-221\nl0 -0\nc5.3,-9.3,12,-14,20,-14\nH400000v40H845.2724\ns-225.272,467,-225.272,467s-235,486,-235,486c-2.7,4.7,-9,7,-19,7\nc-6,0,-10,-1,-12,-3s-194,-422,-194,-422s-65,47,-65,47z\nM834 80h400000v40h-400000z'/></svg></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.1328em;\"><span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">100</span></span></span></span></li>\n<li>Bütün markaların toplam ağırlığı: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo>×</mo><mn>22</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>4</mn><mo>+</mo><mn>6</mn><mo>×</mo><mn>100</mn><mo>≈</mo><mn>689</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4 \\times 22{,}4 + 6 \\times 100 \\approx 689{,}4</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">4</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">22</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">4</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">6</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">100</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">≈</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">689</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">4</span></span></span></span></li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Senaryo</th>\n<th>Evet diyenlerin ağırlığı</th>\n<th>Oran</th>\n<th>Sonuç</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>4 küçük zincir evet</td>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo>×</mo><mn>22</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>4</mn><mo>≈</mo><mn>89</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4 \\times 22{,}4 \\approx 89{,}4</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">4</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">22</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">4</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">≈</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">89</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">4</span></span></span></span></td>\n<td>%13,0</td>\n<td>Sektör grevi yok</td>\n</tr>\n<tr>\n<td>3 büyük zincir evet</td>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mo>×</mo><mn>100</mn><mo>=</mo><mn>300</mn></mrow><annotation encoding=\"application/x-tex\">3 \\times 100 = 300</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">3</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">100</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">300</span></span></span></span></td>\n<td>%43,5</td>\n<td>Sektör grevi var, sadece bu 3 zincir greve gider</td>\n</tr>\n</tbody></table>\n<h4>Oylama kuralları</h4>\n<ul>\n<li><strong>Gizli oy:</strong> Oylama her zaman gizli yapılır. Kimlik doğrulama ile oy kaydı birbirinden <strong>ayrı tutulur.</strong> İşveren de sendika yönetimi de kimin ne oy verdiğini, hatta kimin oy kullanıp kullanmadığını göremez. Böylece küçük şubelerde bile baskı yapılamaz.</li>\n<li><strong>Elektronik oylama:</strong> Oylamalar e-Devlet benzeri bir altyapıyla elektronik olarak yapılabilir. Maliyet ve zorluk, üyelerin doğrudan oy kullanmasından vazgeçmek için gerekçe sayılmaz. Mobil uygulama ve mesai saati içinde oy kullanma gibi kolaylıklar, kimseyi zorlamadan katılımın önündeki engelleri azaltır. Sistem kapıyı açık tutar, katılıp katılmamak üyenin sorumluluğudur.</li>\n<li><strong>Çok küçük şubeler:</strong> 5&#39;ten az üyesi olan şubeler, aynı ilçedeki aynı markanın diğer küçük şubeleriyle birleşerek tek birim gibi oy kullanır.</li>\n<li><strong>Franchise şubeler:</strong> Franchise sahibinin işçisi olan şubeler de markanın bir parçası sayılır. Böylece işveren franchise yapısını sendikayı bölmek için kullanamaz.</li>\n<li><strong>Şirket grupları:</strong> Aynı şirkete veya şirket grubuna ait bütün markalar <strong>tek marka</strong> sayılır. Böylece işveren, ağırlığı değiştirmek için markasını bölemez.</li>\n<li><strong>Ağırlık tablosu:</strong> <a href=\"#sec-olcum-kurulu\">Ölçüm Kurulu</a> her sektör oylamasından önce her markanın üye sayısını ve ağırlığını bir tabloda yayınlar. Üyeler kendi markalarının ağırlığını hesaplamadan tablodan görür.</li>\n</ul>\n<h3>Grev ertelemesi</h3>\n<ul>\n<li>Cumhurbaşkanının grevi erteleme yetkisi <strong>kaldırılır.</strong> Bu yetki 6356 sayılı Kanun md. 63&#39;te düzenlendiği için kanun değişikliği yeterlidir, Anayasa değişikliği gerekmez.</li>\n<li>Hayati hizmetlerde (hastaneler, su, elektrik gibi) grev yapılabilir, ama bu hizmetleri sürdürecek kadar işçi çalışmaya devam eder (<strong>asgari hizmet</strong>). Hangi işlerin hayati olduğuna <a href=\"#sec-olcum-kurulu\">Ölçüm Kurulu</a> karar verir.</li>\n</ul>\n<h3>Zam talebi</h3>\n<p>Şube, marka ve sektör seviyesinin <strong>her birinin kendi zam kurulu</strong> vardır. Her seviyede talebi o seviyenin kurulu hazırlar, ama son sözü üyeler söyler. Onay kuralları, grev ve sözleşme başlatma kurallarıyla aynıdır.</p>\n<table>\n<thead>\n<tr>\n<th>Seviye</th>\n<th>Kurulu kim seçer</th>\n<th>Kurulun talebini kim onaylar</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Şube</strong></td>\n<td>Şubenin üyeleri</td>\n<td>Şubede temel kural: oy kullananların çoğunluğu evet ve evetler üyelerin en az %40&#39;ı</td>\n</tr>\n<tr>\n<td><strong>Marka</strong></td>\n<td>Markanın üyeleri</td>\n<td>Çifte çoğunluk</td>\n</tr>\n<tr>\n<td><strong>Sektör</strong></td>\n<td>Sektörün üyeleri</td>\n<td>Evet diyen markaların kare kök ağırlıklı oranı en az %40</td>\n</tr>\n</tbody></table>\n<ul>\n<li><strong>Birleşen küçük şubeler:</strong> 5&#39;ten az üyesi olduğu için birleşen şubeler tek bir ortak zam kurulu seçer.</li>\n<li><strong>Kurullar arası uyum:</strong> Alt seviyedeki kurul, üst seviyedeki sözleşmeyi taban kabul ederek talep hazırlar. Örneğin şube kurulu, sektör sözleşmesinin altında bir talepte bulunamaz (bkz. katmanlı sözleşme).</li>\n</ul>\n<h3>Sendika yönetimi</h3>\n<ul>\n<li>Şube, marka ve sektör seviyelerinin <strong>her birinin kendi yönetimi</strong> vardır.</li>\n<li>Her seviyede her yıl seçim yapılır ve yönetimin <strong>yarısı yenilenir.</strong></li>\n<li>Böylece her yönetici 2 yıl görev yapar. Hem sürekli yenilenme olur, hem de pazarlığın ortasında yönetimin tamamen değişmesi ve deneyimin kaybolması önlenir.</li>\n</ul>\n<h4>Seçim kuralları</h4>\n<p>Amaç, sendika yönetimlerinin siyasi bloklara bölünmesini ve küçük bir grubun yönetimi elinde tutmasını <strong>yasaklarla değil, seçim kurallarıyla</strong> önlemektir.</p>\n<table>\n<thead>\n<tr>\n<th>Kural</th>\n<th>Nasıl işler</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Delege sistemi yok</strong></td>\n<td>Sendikanın büyüklüğü ne olursa olsun, her seviyenin başkanını ve yönetimini o seviyenin üyeleri <strong>doğrudan</strong> seçer. Sektör sendikasının genel başkanını da bütün sektör üyeleri seçer. Bugünkü sistemde üyeler genel başkanı şubelerde seçtikleri delegeler üzerinden seçiyor ve bu, küçük bir grubun koltuğu elinde tutmasını kolaylaştırıyor.</td>\n</tr>\n<tr>\n<td><strong>Nispi temsil</strong></td>\n<td>Yönetim kurulu üyelikleri, listelerin aldığı oy oranında dağıtılır. Hiçbir liste yönetimin tamamını ele geçiremez ve farklı gruplar birbirini denetler. Her yıl yenilenen yarı da bu şekilde dağıtılır.</td>\n</tr>\n<tr>\n<td><strong>Geri çağırma</strong></td>\n<td>Belli sayıda üye imza toplarsa yönetim, görev süresi dolmadan <strong>güven oylamasına</strong> gider.</td>\n</tr>\n<tr>\n<td><strong>Görev süresi sınırı</strong></td>\n<td>Bir kişi aynı görevde belli bir dönem sayısından fazla bulunamaz.</td>\n</tr>\n<tr>\n<td><strong>Şeffaf mali denetim</strong></td>\n<td>Aşağıdaki denetim kuralları uygulanır.</td>\n</tr>\n</tbody></table>\n<blockquote class=\"callout question\"><p class=\"ct\">Açık konular</p><p></p>\n<ul>\n<li>Geri çağırma için kaç imza ya da üyelerin yüzde kaçı gerekecek?</li>\n<li>Güven oylamasında yönetimin düşmesi için hangi oy kuralı aranacak?</li>\n<li>Görev süresi sınırı kaç dönem olacak?</li>\n<li>Nispi temsilde koltuklar hangi yöntemle dağıtılacak?</li>\n</ul>\n</blockquote>\n<h4>Değerlendirilip alınmayan fikir: Siyasi yasaklar</h4>\n<p>Adaylara siyasi söylem yasağı, son 5 yılda siyasi söylemde bulunmamış olma şartı ve seçme-seçilme hakkının askıya alınması düşünüldü, ama sisteme alınmadı:</p>\n<ul>\n<li><strong>Hukuken:</strong> Seçme ve seçilme hakkı Anayasa&#39;nın 67. maddesiyle, ifade ve sendika özgürlüğü de ILO 87 sayılı Sözleşme ile güvence altında.</li>\n<li><strong>Pratikte:</strong> Siyaset kaybolmaz, perde arkasına geçer. Bloklar &quot;tarafsız&quot; görünen vekil adaylar çıkarır.</li>\n<li><strong>Tarihte:</strong> 1982 Anayasası&#39;ndaki sendikalara siyaset yasağı 1995&#39;te kaldırıldı.</li>\n</ul>\n<h3>Denetim</h3>\n<ul>\n<li>Sendikanın hesaplarını <strong>bağımsız denetçiler</strong> inceler. Denetçiler kayıtlı denetçiler arasından <strong>kurayla</strong> atanır ve ücretlerini sendikadan değil, kurulların ortak fonundan alır. Böylece sendika kendi denetçisini ne seçebilir ne de ona para verebilir (bkz. <a href=\"#sec-kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a>).</li>\n<li>Denetçiler raporlarını <strong>iş mahkemesine</strong> sunar. Usulsüzlük varsa mahkeme karar verir.</li>\n<li>Denetim raporları <strong>üyelere açıktır.</strong></li>\n</ul>\n<h3>Bağlantılı bölümler</h3>\n<ul>\n<li><a href=\"#sec-grev-fonu\">Grev Fonu</a>: Grev kararı alınınca fon devreye girer.</li>\n<li><a href=\"#sec-finansman\">Finansman</a>: Aidat ödemeyenlerin oy hakkı askıya alınır. Zam talebi, üyelerin ödeyeceği kazanım payını belirler.</li>\n<li><a href=\"#sec-olcum-kurulu\">Ölçüm Kurulu</a>: Hayati hizmetlerin hangileri olduğuna karar verir.</li>\n<li><a href=\"#sec-iscinin-korunmasi\">İşçinin Korunması</a>: Grevdeki işçilerin işten çıkarılmasını ve yerine başkasının alınmasını engeller.</li>\n<li><a href=\"#sec-yargi-bagimsizligi\">Yargı Bağımsızlığı</a>: Sendikanın denetimini yapan iş mahkemelerinin tarafsızlığı buna bağlıdır.</li>\n<li><a href=\"#sec-memurlar\">Memurlar</a>: Grev kararı ve asgari hizmet kuralları memurlar için de geçerlidir. Asker, polis ve jandarma grev yapamaz.</li>\n</ul>\n<p>Ana harita → <a href=\"#sec-sendika-sistemi\">Sendika Sistemi</a></p>\n<h2 id=\"sec-finansman\">Finansman</h2><p>Sendika <strong>karma model</strong> ile finanse edilir: düşük bir sabit aidat, artı sözleşmeden sonra kazanılan gerçek zammın bir payı. Üye asıl ödemeyi, sendika ona gerçekten kazandırdıktan sonra yapar.</p>\n<blockquote class=\"callout info\"><p class=\"ct\">Kanunla zorunlu</p><p>Bu nottaki kurallar ve oranlar (kazanım payı %20, giriş katkısı %10, aidat ödemeyenlere yaptırımlar) kanunla <strong>bütün sendikalar için zorunludur.</strong> Sendikalar tüzükleriyle bunları değiştiremez. Böylece gelecekte sendika yönetimine gelenler bu oranları keyfi olarak değiştiremez. Bu karar ILO 87 md. 3 ile çatışır (bkz. <a href=\"#sec-gereken-anayasa-degisiklikleri\">Gereken Anayasa Değişiklikleri</a>).</p>\n</blockquote>\n<h3>1. Sabit aidat</h3>\n<p>Sabit aidat yalnızca sendikanın sabit giderlerini karşılar: personel, ofis, avukatlar, toplantılar. Grev fonu bu aidattan beslenmez.</p>\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>A</mi><mo>=</mo><mi>a</mi><mo>×</mo><msub><mi>W</mi><mrow><mi>b</mi><mi>r</mi><mover accent=\"true\"><mi>u</mi><mo>¨</mo></mover><mi>t</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">A = a \\times <span></span></span></span></span></span></span></span></span></span></span>\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>a</mi><mo>=</mo><mfrac><msub><mi>G</mi><mrow><mi>s</mi><mi>a</mi><mi>b</mi><mi>i</mi><mi>t</mi></mrow></msub><mrow><mi>N</mi><mo>×</mo><mi>t</mi><mo>×</mo><mn>12</mn><mo>×</mo><msub><mover accent=\"true\"><mi>W</mi><mo stretchy=\"true\">‾</mo></mover><mrow><mi>b</mi><mi>r</mi><mover accent=\"true\"><mi>u</mi><mo>¨</mo></mover><mi>t</mi></mrow></msub></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">a = \\frac{G_{sabit}}{N \\times t \\times 12 \\times \\overline{W}_{brüt}}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.4306em;\"></span><span class=\"mord mathnormal\">a</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:2.2837em;vertical-align:-0.9233em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.3603em;\"><span style=\"top:-2.2267em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">N</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mord mathnormal\">t</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mord\">12</span><span class=\"mspace\" style=\"margin-righ n class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\"><span class=\"mord mathnormal\">G</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">s</span><span class=\"mord mathnormal mtight\">abi</span><span class=\"mord mathnormal mtight\">t</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.9233em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span></span></span></span></span>\n<table>\n<thead>\n<tr>\n<th>Sembol</th>\n<th>Anlamı</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\">A</span></span></span></span></td>\n<td>Üyenin aylık <strong>a</strong>idatı (TL)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.4306em;\"></span><span class=\"mord mathnormal\">a</span></span></span></span></td>\n<td>Aidat oranı</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>W</mi><mrow><mi>b</mi><mi>r</mi><mover accent=\"true\"><mi>u</mi><mo>¨</mo></mover><mi>t</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">W_{brüt}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">W</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">b</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.02778em;\">r</span><span class=\"mord accent mtight\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6679em;\"><span style=\"top:-2.7em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"mord mathnormal mtight\">u</span></span><span style=\"top:-2.7em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"accent-body\" style=\"left:-0.2222em;\"><span class=\"mord mtight\">¨</span></span></span></span></span></span></span><span class=\"mord mathnormal mtight\">t</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span></span></span></span></td>\n<td>Üyenin brüt aylık ücreti</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>G</mi><mrow><mi>s</mi><mi>a</mi><mi>b</mi><mi>i</mi><mi>t</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">G_{sabit}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\">G</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">s</span><span class=\"mord mathnormal mtight\">abi</span><span class=\"mord mathnormal mtight\">t</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span></span></span></span></td>\n<td>Sendikanın yıllık sabit <strong>g</strong>iderleri (TL)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">N</span></span></span></span></td>\n<td>Üye sayısı (İngilizce <em>number</em>)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6151em;\"></span><span class=\"mord mathnormal\">t</span></span></span></span></td>\n<td><strong>T</strong>ahsilat oranı: aidatını düzenli ödeyen üyelerin payı. Aidat elle ödendiği için bazı üyeler ödemeyi aksatır, bu yüzden <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6151em;\"></span><span class=\"mord mathnormal\">t</span></span></span></span> 1&#39;den küçüktür. Oran, ödemeyenlerin açığını kapatacak kadar yükselir.</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">12</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">12</span></span></span></span></td>\n<td>Yıldaki ay sayısı</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover accent=\"true\"><mi>W</mi><mo stretchy=\"true\">‾</mo></mover><mrow><mi>b</mi><mi>r</mi><mover accent=\"true\"><mi>u</mi><mo>¨</mo></mover><mi>t</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">\\overline{W}_{brüt}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1.0333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord overline\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8833em;\"><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">W</span></span></span><span style=\"top:-3.8033em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"overline-line\" style=\"border-bottom-width:0.04em;\"></span></span></span></span></span></span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">b</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.02778em;\">r</span><span class=\"mord accent mtight\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6679em;\"><span style=\"top:-2.7em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"mord mathnormal mtight\">u</span></span><span style=\"top:-2.7em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"accent-body\" style=\"left:-0.2222em;\"><span class=\"mord mtight\">¨</span></span></span></span></span></span></span><span class=\"mord mathnormal mtight\">t</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span></span></span></span></td>\n<td>Üyelerin ortalama brüt aylık ücreti. Harfin üstündeki çizgi &quot;ortalama&quot; demektir.</td>\n</tr>\n</tbody></table>\n<blockquote class=\"callout question\"><p class=\"ct\">Açık konu</p><p>Kesin aidat oranı, sendikanın gerçek giderleri ve üye sayısı belli olunca bu formülle hesaplanacak.</p>\n</blockquote>\n<p><strong>Ödeme şekli:</strong> Aidatı işçi her ay kendisi, elle öder. İşveren aracılık etmez, otomatik ödeme talimatı yoktur.</p>\n<p><strong>Aidat ödemeyen üye:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Ödenmeyen süre</th>\n<th>Sonuç</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1 ay</td>\n<td>Hatırlatma yapılır.</td>\n</tr>\n<tr>\n<td>3 ay</td>\n<td>Seçimler, grev, toplu sözleşme ve zam talebi oylamaları dahil <strong>bütün oylamalarda</strong> oy hakkı askıya alınır. Borç ödenince geri gelir.</td>\n</tr>\n<tr>\n<td>6 ay</td>\n<td>Grev fonundan yardım alma hakkı kaybedilir. Borç ödendikten 3 ay sonra geri kazanılır.</td>\n</tr>\n<tr>\n<td>12 ay</td>\n<td>Üyelik düşer.</td>\n</tr>\n</tbody></table>\n<h3>2. Kazanım payı</h3>\n<p>Üye, sendikanın ona kazandırdığı <strong>gerçek</strong> artışın %20&#39;sini öder. Gerçek artış, zammın enflasyonun üstündeki kısmıdır.</p>\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>K</mi><mrow><mi>r</mi><mi>e</mi><mi>e</mi><mi>l</mi></mrow></msub><mo>=</mo><msub><mi>W</mi><mrow><mi>n</mi><mi>e</mi><mi>t</mi></mrow></msub><mo>×</mo><mrow><mo fence=\"true\">(</mo><mfrac><mrow><mn>1</mn><mo>+</mo><mi mathvariant=\"normal\">Δ</mi><mi>W</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>π</mi></mrow></mfrac><mo>−</mo><mn>1</mn><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">K_{reel} = W_{net} \\times \\left( \\frac{1 + \\Delta W}{1 + \\pi} - 1 \\right)</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.07153em;\">K</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">ree</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.01968em;\">l</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">W</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2806em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">n</span><span class=\"mord mathnormal mtight\">e</span><span class=\"mord mathnormal mtight\">t</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:2.4em;vertical-align:-0.95em;\"></span><span class=\"minner\"><span class=\"mopen delimcenter\" style=\"top:0em;\"><span class=\"delimsizing size3\">(</span></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.3603em;\"><span style=\"top:-2.314em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\">1</span><span class=\"mspace\" style=\"ma 07153em;\">K</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">ree</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.01968em;\">l</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span></span></span></span></td>\n<td>Üyenin aylık gerçek <strong>k</strong>azancı (TL). &quot;Reel&quot;, enflasyondan arındırılmış demektir.</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>W</mi><mrow><mi>n</mi><mi>e</mi><mi>t</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">W_{net}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">W</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2806em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">n</span><span class=\"mord mathnormal mtight\">e</span><span class=\"mord mathnormal mtight\">t</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span></span></span></span></td>\n<td>Üyenin zamdan önceki aylık net ücreti</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta W</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord\">Δ</span><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">W</span></span></span></span></td>\n<td>Sözleşmeyle alınan zam oranı. <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord\">Δ</span></span></span></span> (delta) &quot;değişim&quot; demektir. İşçi birden fazla sözleşmenin kapsamındaysa hesap aşağıdaki &quot;Birden fazla sözleşme&quot; bölümüne göre yapılır.</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.4306em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">π</span></span></span></span></td>\n<td>TÜİK&#39;in açıkladığı gerçekleşen enflasyon. Ekonomide enflasyon için standart harftir (pi).</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">P</span></span></span></span></td>\n<td>Üyenin her ay ödediği kazanım <strong>p</strong>ayı (TL)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>20</mn></mrow><annotation encoding=\"application/x-tex\">0{,}20</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">0</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">20</span></span></span></span></td>\n<td>Pay oranı: %20</td>\n</tr>\n</tbody></table>\n<p><strong>Zamanlama:</strong> Sözleşmenin ilk yarısında gerçek enflasyon ölçülür. İkinci yarısında üye, ilk yarıda gerçekten kazandığından payı öder. 2 yıllık sözleşmede ödeme 12 ay sürer. Zam enflasyonun altında kaldıysa üye hiç ödemez.</p>\n<p><strong>Kullanım:</strong> Kazanım payının tamamı <a href=\"#sec-grev-fonu\">Grev Fonu</a>na gider. Fon hedefe ulaşınca pay alınmaz. Fon hedefin altına düşerse pay yeniden alınmaya başlar.</p>\n<h4>Örnek: Ayşe</h4>\n<ul>\n<li>Net ücret 30.000 TL, zam %35, enflasyon %30</li>\n<li>Gerçek kazanç: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>30.000</mn><mo>×</mo><mrow><mo fence=\"true\">(</mo><mfrac><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>35</mn></mrow><mrow><mn>1</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>30</mn></mrow></mfrac><mo>−</mo><mn>1</mn><mo fence=\"true\">)</mo></mrow><mo>≈</mo><mn>1.154</mn></mrow><annotation encoding=\"application/x-tex\">30.000 \\times \\left(\\frac{1{,}35}{1{,}30} - 1\\right) \\approx 1.154</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">30.000</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1.8em;vertical-align:-0.65em;\"></span><span class=\"minner\"><span class=\"mopen delimcenter\" style=\"top:0em;\"><span class=\"delimsizing size2\">(</span></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8972em;\"><span style=\"top:-2.655em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">1</span><span class=\"mord mtight\"><span class=\"mpunct mtight\">,</span></span><span class=\"mord mtight\">30</span></span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.4461em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">1</span><span class=\"mord mtight\"><span class=\"mpunct mtight\">,</span></span><span class=\"mord mtight\">35</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.4811em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span cla
