 ücretin <strong>yarısını</strong> alır.</td>\n</tr>\n</tbody></table>\n<h3>Kimler yardım alır?</h3>\n<ul>\n<li>Grev yardımını sadece <strong>aidat borcu olmayan üyeler</strong> alır. 6 ay aidat ödemeyen üye yardım hakkını kaybeder (bkz. <a href=\"#finansman\">Finansman</a>).</li>\n<li>Grev kararından <strong>sonra</strong> üye olanlar o grevde yardım alamaz. Böylece kimse sadece grev yardımı almak için son anda üye olamaz.</li>\n<li>Grevdeki işyerinde çalışan ama üye olmayan işçiler yardım almaz.</li>\n</ul>\n<h2>Fon hedefi</h2>\n<p>Fon, tüm üyelere <strong>30 gün</strong> boyunca yardım verebilecek büyüklükte olmalıdır.</p>\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>F</mi><mrow><mi>h</mi><mi>e</mi><mi>d</mi><mi>e</mi><mi>f</mi></mrow></msub><mo>=</mo><mi>N</mi><mo>×</mo><msub><mi>Y</mi><mi>g</mi></msub><mo>×</mo><mn>30</mn><mo>=</mo><mi>N</mi><mo>×</mo><mfrac><mrow><mi>A</mi><msub><mover accent=\"true\"><mi>U</mi><mo>¨</mo></mover><mrow><mi>n</mi><mi>e</mi><mi>t</mi></mrow></msub></mrow><mn>2</mn></mfrac></mrow><annotation encoding=\"application/x-tex\">F_{hedef} = N \\times Y_g \\times 30 = N \\times \\frac{AÜ_{net}}{2}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">F</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">h</span><span class=\"mord mathnormal mtight\">e</span><span class=\"mord mathnormal mtight\">d</span><span class=\"mord mathnormal mtight\">e</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.10764em;\">f</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2861em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">N</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">Y</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.1514em;\"><span style=\"top:-2.55em;margin-left:-0.2222em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.03588em;\">g</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2861em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">30</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">N</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:2.2832em;vertical-align:-0.686em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.5972em;\"><span style=\"top:-2.314em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\">2</span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.677em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\">A</span><span class=\"mord\"><span class=\"mord accent\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.9202em;\"><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">U</span></span><span style=\"top:-3.2523em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"accent-body\" style=\"left:-0.2222em;\"><span class=\"mord\">¨</span></span></span></span></span></span></span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2806em;\"><span style=\"top:-2.55em;margin-left:-0.109em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">n</span><span class=\"mord mathnormal mtight\">e</span><span class=\"mord mathnormal mtight\">t</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.686em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span></span></span></span></span>\n<table>\n<thead>\n<tr>\n<th>Sembol</th>\n<th>Anlamı</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mrow><mi>h</mi><mi>e</mi><mi>d</mi><mi>e</mi><mi>f</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">F_{hedef}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">F</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">h</span><span class=\"mord mathnormal mtight\">e</span><span class=\"mord mathnormal mtight\">d</span><span class=\"mord mathnormal mtight\">e</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.10764em;\">f</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2861em;\"><span></span></span></span></span></span></span></span></span></span></td>\n<td>Grev <strong>f</strong>onunun hedef büyüklüğü (TL)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">N</span></span></span></span></td>\n<td>Üye sayısı</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>30</mn></mrow><annotation encoding=\"application/x-tex\">30</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">30</span></span></span></span></td>\n<td>Fonun karşılaması gereken grev günü</td>\n</tr>\n</tbody></table>\n<p>Yani her üye için <strong>yarım aylık net asgari ücret</strong> biriktirilir. Hedef üye sayısına bağlı olduğu için sendika büyüdükçe hedef de kendiliğinden büyür.</p>\n<h3>Örnek</h3>\n<p>Aylık net asgari ücret 30.000 TL, 2.000 üye:</p>\n<ul>\n<li>Günlük yardım: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>30.000</mn><mi mathvariant=\"normal\">/</mi><mn>60</mn><mo>=</mo><mn>500</mn></mrow><annotation encoding=\"application/x-tex\">30.000 / 60 = 500</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\">30.000/60</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">500</span></span></span></span> TL</li>\n<li>Üye başına hedef: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>500</mn><mo>×</mo><mn>30</mn><mo>=</mo><mn>15.000</mn></mrow><annotation encoding=\"application/x-tex\">500 \\times 30 = 15.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">500</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">30</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">15.000</span></span></span></span> TL</li>\n<li>Toplam hedef: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.000</mn><mo>×</mo><mn>15.000</mn><mo>=</mo><mn>30.000.000</mn></mrow><annotation encoding=\"application/x-tex\">2.000 \\times 15.000 = 30.000.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">2.000</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">15.000</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">30.000.000</span></span></span></span> TL</li>\n</ul>\n<h2>Fon nasıl dolar?</h2>\n<table>\n<thead>\n<tr>\n<th>Kaynak</th>\n<th>Açıklama</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Başlangıç sermayesi</td>\n<td>Mevcut sendikanın birikimi, geçiş kuralıyla yeni sendikaya geçer (aşağıda).</td>\n</tr>\n<tr>\n<td>Giriş katkısı</td>\n<td>Her yeni üyeden asgari ücretin %10&#39;u (<a href=\"#finansman\">Finansman</a>)</td>\n</tr>\n<tr>\n<td>Kazanım payı</td>\n<td>Gerçek kazancın %20&#39;si, fon hedefin altındayken (<a href=\"#finansman\">Finansman</a>)</td>\n</tr>\n</tbody></table>\n<p>Başlangıç sermayesi olmadan, Ayşe örneğindeki varsayımlarla, yani her dönemde enflasyonun yaklaşık 4 puan üstünde zam alınırsa, fon yaklaşık <strong>4,6 sözleşme döneminde</strong> dolar. 2 yıllık sözleşmelerle bu yaklaşık 9 yıl eder. Başlangıç sermayesi bu süreyi kısaltır.</p>\n<blockquote class=\"callout warning\"><p class=\"ct\">Risk</p><p>Zam enflasyonun altında kalan dönemlerde kazanım payı alınmaz ve fon büyümez. Bu durumda fonun dolması daha uzun sürer.</p>\n</blockquote>\n<h2>Geçiş kuralı</h2>\n<p>Yeni sisteme geçerken mevcut sendikaların parası işçilere hizmet etmeye devam eder:</p>\n<p>Bugün bir sektörde birden fazla sendika olabiliyor. Yeni sistemde her sektörün tek sendikası olacağı için, sektördeki <strong>bütün mevcut sendikaların parası</strong> yeni sektör sendikasına geçer ve grev fonunun <strong>başlangıç sermayesi</strong> olur.</p>\n<h2>Caydırıcılık</h2>\n<p>Sistem, işverenin grev karşısındaki maliyetini çok artırır:</p>\n<ul>\n<li>Grevdeki işçinin yerine kimseyi alamaz, işi başka yere kaydıramaz, diğer şubelerden personel getiremez (<a href=\"#iscinin-korunmasi\">İşçinin Korunması</a>).</li>\n<li>Grev kırıcılığının cezası her işçi için bir yıllık ücrettir (<a href=\"#iscinin-korunmasi\">İşçinin Korunması</a>).</li>\n<li>Cumhurbaşkanı ertelemesi olmadığı için grevin devlet tarafından durdurulmasını bekleyemez (<a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>).</li>\n</ul>\n<p>Bu yüzden işveren grevi göze almak yerine anlaşmayı tercih eder ve grevler daha kısa sürer. Ama caydırıcılık, işverenin sendikanın gerçekten greve gidebileceğine inanmasına bağlıdır. Fon boşsa işveren &quot;İşçiler gelirsiz kalınca birkaç günde pes eder&quot; diye düşünebilir. Bu yüzden fon gereklidir, ama korumalar sayesinde çok uzun bir grevi karşılaması gerekmez.</p>\n<h2>Bağlantılı bölümler</h2>\n<ul>\n<li><a href=\"#finansman\">Finansman</a>: Fonu besleyen giriş katkısı ve kazanım payı</li>\n<li><a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>: Fonu devreye sokan grev kararı</li>\n<li><a href=\"#iscinin-korunmasi\">İşçinin Korunması</a>: Grevlerin kısa sürmesini sağlayan korumalar</li>\n<li><a href=\"#sendika-hakki\">Sendika Hakkı</a>: Her sektörün tek sendikası olduğu için geçişte mevcut sendikaların parası birleşir.</li>\n</ul>\n<p>Ana harita → <a href=\"#sendika-sistemi\">Sendika Sistemi</a></p>\n"},{"id":"kurullarin-finansmani-ve-secimi","cat":"Para","th":"green","l1":"Kurulların","l2":"finansmanı ve seçimi","sub":"Bağımsız kurulların parası ve başkanları","lead":"Sistemdeki bağımsız kurullar şunlardır: Ölçüm Kurulu, Kayıt Dışılıkla Mücadele, İşçinin Korunması ve Kayıt Dışılıkla Mücadele. Bu not, bu kurulların parasının nereden geldiğini ve…","date":"19 Kasım 2026","min":4,"html":"<p>Sistemdeki bağımsız kurullar şunlardır: <a href=\"#olcum-kurulu\">Ölçüm Kurulu</a>, <a href=\"#kayit-disilikla-mucadele\">Kayıt Dışılık Kurulu</a>, <a href=\"#iscinin-korunmasi\">Sendikal Koruma Kurulu</a> ve <a href=\"#kayit-disilikla-mucadele\">Bağımsız Veri Denetçisi</a>. Bu not, bu kurulların parasının nereden geldiğini ve başlarına kimin geleceğini düzenler.</p>\n<h2>Bağımsızlık ne demek?</h2>\n<p>Bağımsızlık, kurumun devletten hiç para almaması demek değildir. Kurumu bağımsız yapan, parayı verenin ve atamayı yapanın kurumu <strong>kontrol edememesidir.</strong> Bunu dört kural sağlar:</p>\n<ol>\n<li><strong>Bütçe güvencesi:</strong> Bütçe hükümetin keyfine bırakılmaz, kanundaki bir formüle bağlıdır.</li>\n<li><strong>Atama kuralları:</strong> Üyeleri tek bir merci atamaz.</li>\n<li><strong>Görev güvencesi:</strong> Üyeler görev süresi dolmadan, verdikleri kararlar yüzünden görevden alınamaz.</li>\n<li><strong>Şeffaflık:</strong> Bütçe, harcamalar ve kararlar kamuya açıktır.</li>\n</ol>\n<p>Kurullarda çalışanlar gönüllü değildir. İşi tam zamanlı ve maaş karşılığında yaparlar. Bağımsızlıklarını gönüllülük değil, bu dört kural sağlar.</p>\n<h2>Finansman</h2>\n<p>Bütün kurullar tek bir <strong>ortak fondan</strong> finanse edilir. Fon iki katmanlıdır:</p>\n<table>\n<thead>\n<tr>\n<th>Katman</th>\n<th>Nasıl işler</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Ana kaynak: Prim payı</strong></td>\n<td>İşverenin her çalışan için ödediği SGK primine küçük bir pay eklenir. SGK bu parayı toplar ve doğrudan fona aktarır. SGK parayı toplar ama kullanamaz. Para devlet bütçesinden geçmediği için hükümet kısamaz.</td>\n</tr>\n<tr>\n<td><strong>Taban güvencesi: Kanuni formül</strong></td>\n<td>Fonun yıllık bütçesi kanunla belirlenen bir formülün altına düşemez. Prim payı yetmezse, örneğin ekonomik krizde, aradaki farkı <strong>Hazine kapatmak zorundadır.</strong></td>\n</tr>\n</tbody></table>\n<p>Pay oranı ve taban formülü kanunla belirlenir. Hükümet bunları değiştiremez, değiştirmek için kanun değişikliği gerekir.</p>\n<h3>Finansman kuralları</h3>\n<ul>\n<li><strong>Cezalar kurullara gitmez.</strong> Kurulların kestiği cezalar <strong>İşsizlik Sigortası Fonu</strong>&#39;na gider. Böylece kurulların ceza kesmekte bir çıkarı olmaz.</li>\n<li><strong>Sayıştay denetimi:</strong> Fonun harcamalarını Sayıştay denetler. Raporlar kamuya açıklanır.</li>\n<li><strong>Kurulların personeli:</strong> İncelemeleri yürüten müfettiş ve uzmanlar kurulların <strong>kendi personelidir.</strong> Açık sınavla işe alınır ve maaşlarını ortak fondan alırlar. Böylece bir bakanlığa ya da başka bir kuruma bağlı olmazlar.</li>\n<li><strong>Sendika denetçileri:</strong> Sendikaların hesaplarını inceleyen bağımsız denetçiler, kayıtlı denetçiler arasından <strong>kurayla</strong> atanır. Ücretleri sendikadan değil, ortak fondan ödenir. Böylece sendika kendi denetçisini ne seçebilir ne de ona para verebilir (bkz. <a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>).</li>\n</ul>\n<blockquote class=\"callout question\"><p class=\"ct\">Açık konular</p><p></p>\n<ul>\n<li>Prim payının oranı ne olacak?</li>\n<li>Taban güvencesi formülü neye bağlanacak? Örneğin kurulların bir önceki yılki bütçesinin enflasyonla güncellenmiş hali olabilir.</li>\n</ul>\n</blockquote>\n<h2>Seçim: Karşılıklı eleme yöntemi</h2>\n<p>Kurulların <strong>başkanları</strong> ve <strong>karar veren uzman üyeleri</strong> bu yöntemle seçilir. Bu yöntem uluslararası tahkimde hakem seçmek için kullanılır.</p>\n<ol>\n<li><strong>Aday listesi:</strong> Sendikalar ve işveren örgütleri <strong>eşit sayıda</strong> aday önerir. Örneğin her taraf 10&#39;ar aday.</li>\n<li><strong>Karşılıklı eleme:</strong> Her taraf, karşı tarafın listesinden belirli sayıda adayı gerekçe göstermeden eler. Örneğin 4&#39;er aday.</li>\n<li><strong>Kura:</strong> Geriye kalan adaylar arasından kurayla seçim yapılır.</li>\n</ol>\n<p>Hiçbir taraf kendi adayını garanti edemez, ama karşı tarafın en taraflı adaylarını eleyebilir. Geriye iki tarafın da kabul edebileceği adaylar kalır. Kura da son seçimde pazarlık yapılmasını engeller.</p>\n<h3>Neden mahkeme değil?</h3>\n<p>Önceki tasarımda kurulların başkanları iş mahkemesi hâkimleri arasından kurayla seçiliyordu. Ama iş mahkemesi hâkimlerini Hâkimler ve Savcılar Kurulu atar. Bir iktidar bu kurulu etkileyebilirse, hâkim havuzu zamanla o iktidara yakın isimlerden oluşur ve kura da bu havuzdan çekilir. Karşılıklı eleme yönteminde havuzu sendikalar ve işveren örgütleri oluşturur, hükümet havuza aday koyamaz. Bir iktidarın sistemi ele geçirmesi için hem sendikaları hem işveren örgütlerini aynı anda kontrol etmesi gerekir.</p>\n<p>Mahkemeler tamamen dışarıda kalmaz: Kurul kararlarına itiraz yine iş mahkemelerine gider. Anayasa md. 125 gereği yargı yolu kapatılamaz. Ama mahkeme sadece tek tek kararlara bakar, kurulları yönetmez.</p>\n<p>Sadece sendikaların aday göstermesi de değerlendirildi. Ama Sendikal Koruma Kurulu ve Kayıt Dışılık Kurulu işverenlere ceza kesen kurullar olduğu için, tek taraflı seçilmiş bir kurulun cezaları adil yargılanma hakkı (Anayasa md. 36, AİHS md. 6) gerekçesiyle mahkemelerde bozulabilirdi. Sonuçta işçiyi koruyamayan bir sistem ortaya çıkardı.</p>\n<h3>Aday şartları</h3>\n<ul>\n<li>İş hukuku, iktisat, denetim veya bilişim alanında en az <strong>10 yıl</strong> deneyim</li>\n<li>Aday gösterildiği tarihte bir siyasi partide <strong>yönetici olmamak</strong></li>\n<li>Son <strong>3 yılda</strong> aday gösteren sendikanın veya işveren örgütünün yöneticisi olmamak</li>\n</ul>\n<p>Sendika seçimlerinde siyasi yasaklar reddedilmişti (bkz. <a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>). Ama orada üyelerin kendi yöneticilerini seçmesi söz konusuydu. Burada tarafsız olması gereken bir hakem kurulundan bahsediliyor. Hâkimler ve bağımsız düzenleyici kurumların üyeleri için de benzer şartlar vardır.</p>\n<h3>Görev süresi ve güvence</h3>\n<ul>\n<li>Görev süresi <strong>4 yıldır</strong> ve <strong>yenilenemez.</strong> Bu süre, hükümet dönemleriyle aynı uzunlukta olmasın diye seçildi.</li>\n<li>Üyeler görev süresi dolmadan, verdikleri kararlar yüzünden <strong>görevden alınamaz.</strong></li>\n<li>İşçi ve işveren temsilcileri bu yöntemle seçilmez. Onlar yine kendi örgütlerinden gelir (bkz. <a href=\"#olcum-kurulu\">Ölçüm Kurulu</a>).</li>\n</ul>\n<h2>Güvence: Anayasa ve kanun</h2>\n<ul>\n<li>Seçim yönteminin ve finansmanın <strong>ana hatları Anayasa&#39;ya</strong> yazılır: kurulların bağımsızlığı, karşılıklı eleme yöntemi, görev güvencesi ve fonun hükümet tarafından kısılamaması. Anayasa değişikliği için en az 360 oy gerektiği için hiçbir iktidar bunları tek başına kolayca değiştiremez.</li>\n<li>Kaç adayın önerileceği, kaçının eleneceği, prim payı oranı ve taban formülü gibi <strong>ayrıntılar kanunda</strong> kalır.</li>\n</ul>\n<h2>Bağlantılı bölümler</h2>\n<ul>\n<li><a href=\"#olcum-kurulu\">Ölçüm Kurulu</a>, <a href=\"#kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a>, <a href=\"#iscinin-korunmasi\">İşçinin Korunması</a>: Bu kurallarla finanse edilen ve seçilen kurullar</li>\n<li><a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>: Sendika denetçilerinin atanması</li>\n<li><a href=\"#yargi-bagimsizligi\">Yargı Bağımsızlığı</a>: Kurulların mahkemelerle ilişkisi</li>\n<li><a href=\"#gereken-anayasa-degisiklikleri\">Gereken Anayasa Değişiklikleri</a>: Anayasa&#39;ya yazılacak ana hatlar</li>\n</ul>\n<p>Ana harita → <a href=\"#sendika-sistemi\">Sendika Sistemi</a></p>\n"},{"id":"iscinin-korunmasi","cat":"Koruma ve denetim","th":"blue","l1":"İşçinin","l2":"korunması","sub":"İşten çıkarma ve grev kırıcılığı","lead":"Sendikalaşmanın önündeki en büyük tehlike, işverenin sendikalı işçileri kovup yerlerine başkasını almasıdır. Bu tehlike en çok yeri kolay doldurulan işçiler için geçerlidir. Bu kurallar…","date":"19 Kasım 2026","min":3,"html":"<p>Sendikalaşmanın önündeki en büyük tehlike, işverenin sendikalı işçileri kovup yerlerine başkasını almasıdır. Bu tehlike en çok yeri kolay doldurulan işçiler için geçerlidir. Bu kurallar bunu engeller.</p>\n<blockquote class=\"callout info\"><p class=\"ct\">Bilinçli tercih</p><p>Bu korumalar, Friedman ve Hayek gibi iktisatçılara göre sendikalara tanınan &quot;imtiyazlar&quot; sayılabilir. Ama sendika hakkının kâğıt üzerinde kalmaması için gerekli oldukları düşünüldüğü için bilerek sisteme alınmıştır.</p>\n</blockquote>\n<p>Grev şube, marka veya sektör düzeyinde olabilir. Hangi düzeyde olursa olsun grevdeki işçilerin yerine yeni işçi alınması, işin başka yere kaydırılması ve <strong>aynı markanın diğer şubelerinden personel getirilmesi</strong> yasaktır. Sektör grevinde ayrıca işi bilen işçilerin büyük kısmı greve katıldığı için işverenin dışarıdan işçi bulması da zorlaşır.</p>\n<h2>Kurallar</h2>\n<table>\n<thead>\n<tr>\n<th>Koruma</th>\n<th>Nasıl işler</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>İşten çıkarma onayı</strong></td>\n<td>Bir işyerinde sendikal örgütlenme başladıktan sonra işveren, üye bir işçiyi çıkarmak için <strong>Sendikal Koruma Kurulu</strong>&#39;nun onayını almak zorundadır. Örgütlenme, işyerinde <strong>ilk sendika üyeliğinin kaydedildiği andan</strong> itibaren başlamış sayılır.</td>\n</tr>\n<tr>\n<td><strong>Zorunlu işe iade</strong></td>\n<td>Sendikal nedenle çıkarıldığı tespit edilen işçi işe geri alınır. İşveren tazminat ödeyerek bundan kurtulamaz.</td>\n</tr>\n<tr>\n<td><strong>İspat yükü işverende</strong></td>\n<td>Sendika üyesi bir işçi çıkarılırsa, sebebin sendika olmadığını işveren kanıtlar.</td>\n</tr>\n<tr>\n<td><strong>Grev kırıcılığına ağır ceza</strong></td>\n<td>Grevdeki işçinin yerine işçi alan, işi başka yere kaydıran ya da grevdeki şubeye aynı markanın diğer şubelerinden personel getiren işverene ceza kesilir.</td>\n</tr>\n</tbody></table>\n<h2>İşten çıkarma onayı süreci</h2>\n<ul>\n<li>Kurul başvuruya <strong>15 gün</strong> içinde karar verir.</li>\n<li>Karar verilene kadar işçi <strong>işinde kalır.</strong></li>\n<li>Hırsızlık veya şiddet gibi acil durumlarda işveren işçiyi, <strong>maaşını ödemeye devam ederek</strong> geçici olarak uzaklaştırabilir. Kesin karar yine kurula aittir.</li>\n</ul>\n<h2>Grev kırıcılığı cezası</h2>\n<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>C</mi><mo>=</mo><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msub><mi>W</mi><mrow><mi>y</mi><mi mathvariant=\"normal\">ı</mi><mi>l</mi><mi>l</mi><mi mathvariant=\"normal\">ı</mi><mi>k</mi><mo separator=\"true\">,</mo><mtext> </mtext><mi>i</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">C = \\sum_{i=1}^{n} W_{yıllık,\\,i}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.07153em;\">C</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:2.9291em;vertical-align:-1.2777em;\"></span><span class=\"mop op-limits\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.6514em;\"><span style=\"top:-1.8723em;margin-left:0em;\"><span class=\"pstrut\" style=\"height:3.05em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">i</span><span class=\"mrel mtight\">=</span><span class=\"mord mtight\">1</span></span></span></span><span style=\"top:-3.05em;\"><span class=\"pstrut\" style=\"height:3.05em;\"></span><span><span class=\"mop op-symbol large-op\">∑</span></span></span><span style=\"top:-4.3em;margin-left:0em;\"><span class=\"pstrut\" style=\"height:3.05em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">n</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.2777em;\"><span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">W</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.03588em;\">y</span><span class=\"mord latin_fallback mtight\">ı</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.01968em;\">ll</span><span class=\"mord latin_fallback mtight\">ı</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.03148em;\">k</span><span class=\"mpunct mtight\">,</span><span class=\"mspace mtight\" style=\"margin-right:0.1952em;\"></span><span class=\"mord mathnormal mtight\">i</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2861em;\"><span></span></span></span></span></span></span></span></span></span></span>\n<table>\n<thead>\n<tr>\n<th>Sembol</th>\n<th>Anlamı</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">C</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.07153em;\">C</span></span></span></span></td>\n<td>İşverene kesilecek toplam <strong>c</strong>eza (TL)</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.4306em;\"></span><span class=\"mord mathnormal\">n</span></span></span></span></td>\n<td>Yerine başkası alınan, işi başka yere kaydırılan ya da yerine diğer şubelerden personel getirilen grevci sayısı</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>W</mi><mrow><mi>y</mi><mi mathvariant=\"normal\">ı</mi><mi>l</mi><mi>l</mi><mi mathvariant=\"normal\">ı</mi><mi>k</mi><mo separator=\"true\">,</mo><mtext> </mtext><mi>i</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">W_{yıllık,\\,i}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">W</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.03588em;\">y</span><span class=\"mord latin_fallback mtight\">ı</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.01968em;\">ll</span><span class=\"mord latin_fallback mtight\">ı</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.03148em;\">k</span><span class=\"mpunct mtight\">,</span><span class=\"mspace mtight\" style=\"margin-right:0.1952em;\"></span><span class=\"mord mathnormal mtight\">i</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2861em;\"><span></span></span></span></span></span></span></span></span></span></td>\n<td>$i$&#39;inci grevcinin yıllık brüt ücreti. <strong>W</strong>, ücret anlamındaki İngilizce <em>wage</em> kelimesinden gelir.</td>\n</tr>\n<tr>\n<td><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></msubsup></mrow><annotation encoding=\"application/x-tex\">\\sum_{i=1}^{n}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1.104em;vertical-align:-0.2997em;\"></span><span class=\"mop\"><span class=\"mop op-symbol small-op\" style=\"position:relative;top:0em;\">∑</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8043em;\"><span style=\"top:-2.4003em;margin-left:0em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">i</span><span class=\"mrel mtight\">=</span><span class=\"mord mtight\">1</span></span></span></span><span style=\"top:-3.2029em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">n</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2997em;\"><span></span></span></span></span></span></span></span></span></span></td>\n<td>&quot;Toplam&quot; işareti. 1&#39;inci işçiden $n$&#39;inci işçiye kadar herkesin yıllık ücretini toplar.</td>\n</tr>\n</tbody></table>\n<p>Yani işveren, haksız yere yerine başkası konan her işçi için o işçinin bir yıllık ücreti kadar ceza öder. Cezayı Sendikal Koruma Kurulu keser.</p>\n<h2>Sendikal Koruma Kurulu</h2>\n<p>İşten çıkarma onaylarını veren, grev kırıcılığı cezalarını kesen ve memurların sürgün şikâyetlerine bakan kurul (bkz. <a href=\"#memurlar\">Memurlar</a>). Kişisel banka verilerine erişimi yoktur, o veriler sadece <a href=\"#kayit-disilikla-mucadele\">Kayıt Dışılık Kurulu</a>&#39;ndadır.</p>\n<h3>Yapısı</h3>\n<table>\n<thead>\n<tr>\n<th>Üye</th>\n<th>Rolü</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Uzmanlar (müfettişler)</td>\n<td>Başvuruları ve şikâyetleri inceler. Kurulun kendi personelidir, maaşını ortak fondan alır.</td>\n</tr>\n<tr>\n<td>İşçi ve işveren temsilcileri</td>\n<td>İncelemenin adil yapılıp yapılmadığını denetler.</td>\n</tr>\n<tr>\n<td>Sendika temsilcileri</td>\n<td>İlgili işyerinin sendika şubesi, kendi üyeleri arasından seçtiği temsilcilerle denetime katılır. İşyerinde sendika yoksa kurul işçi temsilcileriyle çalışır.</td>\n</tr>\n<tr>\n<td>Başkan</td>\n<td><strong>Karşılıklı eleme yöntemiyle</strong> seçilir (bkz. <a href=\"#kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a>).</td>\n</tr>\n</tbody></table>\n<h3>Güvenceler</h3>\n<ul>\n<li>Dosyayı inceleyen uzman, <strong>karar ve ceza oylamasında oy kullanmaz.</strong></li>\n<li>Kurul kararlarına iş mahkemesinde itiraz edilebilir. İtiraz kararı <strong>durdurmaz</strong> ve <strong>30 gün içinde</strong> sonuçlanır.</li>\n<li>Haksız çıkan ceza <strong>faiziyle</strong> geri ödenir.</li>\n</ul>\n<h2>Bağlantılı bölümler</h2>\n<ul>\n<li><a href=\"#kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a>: Kayıt dışı istihdamı ayrı bir kurul, Kayıt Dışılık Kurulu inceler.</li>\n<li><a href=\"#sendika-hakki\">Sendika Hakkı</a>: Sektör bazlı örgütlenme, korumanın temelidir.</li>\n<li><a href=\"#grev-fonu\">Grev Fonu</a>: Bu korumalar işvereni grevden caydırır ve grevlerin kısa sürmesini sağlar. Bu yüzden fonun çok uzun bir grevi karşılaması gerekmez.</li>\n<li><a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>: Erteleme yasağıyla birlikte grevin devlet tarafından durdurulması da engellenir.</li>\n<li><a href=\"#memurlar\">Memurlar</a>: Grev kırıcılığı yasağı memurlara da uygulanır. Memurlar için ayrıca sürgün yasağı vardır.</li>\n<li><a href=\"#kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a>: Kurulun bütçesi ve başkanının seçimi</li>\n<li><a href=\"#yargi-bagimsizligi\">Yargı Bağımsızlığı</a>: Kurul kararlarına yapılan itirazlara iş mahkemeleri bakar.</li>\n</ul>\n<p>Ana harita → <a href=\"#sendika-sistemi\">Sendika Sistemi</a></p>\n"},{"id":"kayit-disilikla-mucadele","cat":"Koruma ve denetim","th":"blue","l1":"Kayıt dışılıkla","l2":"mücadele","sub":"Kayıtsız işçi nasıl bulunur","lead":"Kayıt dışı çalışan işçiler resmi kayıtlarda görünmez. Bu yüzden sendikaya üye olamaz, hiçbir korumadan yararlanamaz ve oylamalarda kullanılan üye sayıları eksik ölçülür.","date":"19 Kasım 2026","min":3,"html":"<p>Kayıt dışı çalışan işçiler resmi kayıtlarda görünmez. Bu yüzden sendikaya üye olamaz, hiçbir korumadan yararlanamaz ve oylamalarda kullanılan üye sayıları eksik ölçülür.</p>\n<h2>Banka hareketleriyle tespit</h2>\n<ol>\n<li>Bir şirket hesabından aynı kişiye <strong>her ay, birbirine yakın tutarlarda</strong> para gidiyorsa sistem bunu fark eder.</li>\n<li>Bu kişinin SGK&#39;da o şirketin çalışanı olarak kayıtlı olup olmadığı otomatik kontrol edilir.</li>\n<li>Kayıtlı değilse durum <strong>Kayıt Dışılık Kurulu</strong>&#39;na bildirilir. Karar otomatik verilmez, kurul inceler.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Sorun</th>\n<th>Önlem</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Yanlış alarm: kira, serbest çalışan ödemesi, nafaka da düzenli olabilir.</td>\n<td>Sadece şirket hesabından kişiye giden ödemeler izlenir. Kişiden kişiye ödemeler izlenmez.</td>\n</tr>\n<tr>\n<td>Kişisel verilerin korunması (Anayasa md. 20, KVKK)</td>\n<td>İzleme için açık bir yasal dayanak çıkarılır. Veriler sadece eşleştirme için kullanılır, sadece yetkili uzmanlar görür.</td>\n</tr>\n<tr>\n<td>Nakit ödeme ile sistemden kaçma</td>\n<td>Ücretlerin nakit ödenmesine üst sınır konabilir.</td>\n</tr>\n</tbody></table>\n<h2>Kayıt Dışılık Kurulu</h2>\n<p>Kayıt dışı istihdamı tespit eden ve cezalandıran kurul. Kişisel banka verilerine <strong>sadece bu kurul</strong> erişir. İşten çıkarma onayları ve grev kırıcılığı cezaları ayrı bir kurula, <a href=\"#iscinin-korunmasi\">Sendikal Koruma Kurulu</a>&#39;na aittir. Böylece güç tek bir kurulda toplanmaz ve banka verisi başka kararlarda kullanılamaz.</p>\n<h3>Yapısı</h3>\n<table>\n<thead>\n<tr>\n<th>Üye</th>\n<th>Rolü</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Müfettişler ve uzmanlar</td>\n<td>İncelemeyi yürütür. Kurulun kendi personelidir, SGK ve MASAK konularında uzmandır, maaşını ortak fondan alır.</td>\n</tr>\n<tr>\n<td>İşçi ve işveren temsilcileri</td>\n<td>İncelemenin adil yapılıp yapılmadığını denetler. Kişisel banka verilerini görmez.</td>\n</tr>\n<tr>\n<td>Sendika temsilcileri</td>\n<td>İncelenen işyerinin sendika şubesi, kendi üyeleri arasından seçtiği temsilcilerle denetime katılır. İşyerinde sendika yoksa kurul işçi temsilcileriyle çalışır.</td>\n</tr>\n<tr>\n<td>Başkan</td>\n<td><strong>Karşılıklı eleme yöntemiyle</strong> seçilir (bkz. <a href=\"#kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a>).</td>\n</tr>\n</tbody></table>\n<h3>Yetkisi</h3>\n<p>Kurul kayıt dışı istihdamı hem <strong>tespit</strong> eder hem de <strong>ceza</strong> keser.</p>\n<h3>Güvenceler</h3>\n<ul>\n<li>Dosyayı inceleyen müfettiş veya uzman, <strong>ceza kararında oy kullanmaz.</strong></li>\n<li>İşveren cezaya iş mahkemesinde itiraz edebilir. İtiraz cezayı <strong>durdurmaz</strong> ve <strong>30 gün içinde</strong> sonuçlanır.</li>\n<li>Haksız çıkan ceza <strong>faiziyle</strong> geri ödenir.</li>\n</ul>\n<h2>Bağımsız Veri Denetçisi</h2>\n<p>Kayıt Dışılık Kurulu bütün şirketlerin kişilere yaptığı ödemeleri taradığı için, bu verilerin sadece izin verilen amaçla kullanılıp kullanılmadığını bağımsız biri denetler. Avrupa İnsan Hakları Mahkemesi, geniş çaplı veri izlemesinde böyle bir bağımsız denetimi arar.</p>\n<table>\n<thead>\n<tr>\n<th>Konu</th>\n<th>Kural</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Görevi</strong></td>\n<td>Kurulun banka verilerini sadece kayıt dışılık tespiti için kullanıp kullanmadığını denetler.</td>\n</tr>\n<tr>\n<td><strong>Yetkisi</strong></td>\n<td>Hangi veriye kimin, ne zaman, neden eriştiğini gösteren kayıtları istediği zaman inceleyebilir. Kurala aykırı bir kullanım bulursa kullanımı durdurur ve sorumluların yargılanması için savcılığa bildirir.</td>\n</tr>\n<tr>\n<td><strong>Kim olur</strong></td>\n<td>Bir hukukçu ve bir bilişim uzmanı. İkisi de <strong>karşılıklı eleme yöntemiyle</strong> seçilir, görev süreleri 4 yıldır ve yenilenemez (bkz. <a href=\"#kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a>).</td>\n</tr>\n<tr>\n<td><strong>Şeffaflık</strong></td>\n<td>Her yıl kaç kişinin verisinin incelendiğini, kaçının kayıt dışı çıktığını ve kaç yanlış alarm olduğunu kamuya açıklar. Kişisel bilgi yayınlanmaz.</td>\n</tr>\n<tr>\n<td><strong>Kişinin hakkı</strong></td>\n<td>Verisi incelenen ve kayıt dışı çıkmayan kişiye, inceleme bittikten sonra bilgi verilir. Kişi verisinin neden incelendiğini öğrenebilir ve gerekirse şikâyette bulunabilir.</td>\n</tr>\n</tbody></table>\n<h2>Bağlantılı bölümler</h2>\n<ul>\n<li><a href=\"#iscinin-korunmasi\">İşçinin Korunması</a>: İşten çıkarma onaylarını ve grev kırıcılığı cezalarını ayrı bir kurul, Sendikal Koruma Kurulu verir.</li>\n<li><a href=\"#kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a>: Kurulun ve Veri Denetçisi&#39;nin bütçesi ve seçimi</li>\n<li><a href=\"#yargi-bagimsizligi\">Yargı Bağımsızlığı</a>: Cezalara yapılan itirazlara iş mahkemeleri bakar.</li>\n<li><a href=\"#sendika-hakki\">Sendika Hakkı</a>: Kayıt altına alınan işçi sendikaya üye olabilir.</li>\n<li><a href=\"#olcum-kurulu\">Ölçüm Kurulu</a>: Kayıt altına alınan işçiler üye sayılarının doğru ölçülmesini sağlar.</li>\n</ul>\n<p>Ana harita → <a href=\"#sendika-sistemi\">Sendika Sistemi</a></p>\n"},{"id":"yargi-bagimsizligi","cat":"Koruma ve denetim","th":"blue","l1":"Yargı","l2":"bağımsızlığı","sub":"Sistemin dayandığı mahkemeler","lead":"Sistemdeki kurulların kararlarına yapılan itirazlara iş mahkemeleri bakar. Sendikaların denetim raporları da iş mahkemesine sunulur. Bu yüzden sistemin adil işlemesi, yargının bağımsız…","date":"19 Kasım 2026","min":2,"html":"<p>Sistemdeki kurulların kararlarına yapılan itirazlara iş mahkemeleri bakar. Sendikaların denetim raporları da iş mahkemesine sunulur. Bu yüzden sistemin adil işlemesi, yargının bağımsız olmasına bağlıdır.</p>\n<h2>Genel reformlar</h2>\n<p>Avrupa Konseyi&#39;nin Venedik Komisyonu gibi uluslararası kuruluşların önerdiği adımlar:</p>\n<table>\n<thead>\n<tr>\n<th>Reform</th>\n<th>Açıklama</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>HSK&#39;nın yapısı</strong></td>\n<td>Hâkimler ve Savcılar Kurulu üyelerinin çoğunluğunu siyasiler değil, hâkimler kendi aralarında seçer.</td>\n</tr>\n<tr>\n<td><strong>Atama ve terfide şeffaflık</strong></td>\n<td>Hâkimlerin atanması, terfisi ve yer değiştirmesi açık ve ölçülebilir kriterlere bağlanır.</td>\n</tr>\n<tr>\n<td><strong>Görev güvencesi</strong></td>\n<td>Hâkimler verdikleri kararlar yüzünden sürgün edilemez veya disiplin cezası alamaz.</td>\n</tr>\n<tr>\n<td><strong>Hâkim ile savcının ayrılması</strong></td>\n<td>Hâkimler ve savcılar ayrı kurullara bağlanır.</td>\n</tr>\n</tbody></table>\n<blockquote class=\"callout warning\"><p class=\"ct\">warning</p><p>Bu reformlar Anayasa değişikliği gerektirir.</p>\n</blockquote>\n<h2>Sistemimizdeki önlemler</h2>\n<p>Genel reformlar gerçekleşmese ya da ileride geri alınsa bile sistemimizi korumak için:</p>\n<ul>\n<li><strong>Kurullar mahkemelere bağlı değildir.</strong> Kurulların başkanları ve uzman üyeleri hâkimler arasından değil, sendikalar ile işveren örgütlerinin önerdiği adaylar arasından <strong>karşılıklı eleme yöntemiyle</strong> seçilir. Böylece kurulların bağımsızlığı, Hâkimler ve Savcılar Kurulu&#39;nun bağımsızlığına bağlı kalmaz (bkz. <a href=\"#kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a>).</li>\n<li><strong>Mahkemeler sadece itirazlara bakar.</strong> Anayasa md. 125 gereği kurul kararlarına karşı yargı yolu açıktır. Mahkeme tek tek kararları denetler, kurulları yönetmez.</li>\n<li><strong>İtirazlar hiçbir şeyi durdurmaz</strong> ve 30 gün içinde sonuçlanır. Böylece mahkemedeki gecikmeler sistemi kilitleyemez.</li>\n<li>Kurulların kararları, gerekçeleri ve kullandığı veriler <strong>kamuya açıktır.</strong></li>\n</ul>\n<h2>Bağlantılı bölümler</h2>\n<ul>\n<li><a href=\"#kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a>: Kurulların mahkemelerden bağımsız seçimi</li>\n<li><a href=\"#olcum-kurulu\">Ölçüm Kurulu</a>, <a href=\"#kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a>, <a href=\"#iscinin-korunmasi\">İşçinin Korunması</a>: Kararlarına iş mahkemelerinde itiraz edilebilen kurullar</li>\n<li><a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>: Sendikaların denetim raporları iş mahkemesine sunulur.</li>\n<li><a href=\"#gereken-anayasa-degisiklikleri\">Gereken Anayasa Değişiklikleri</a>: HSK reformu için Anayasa md. 159 ve hâkimlik teminatı için md. 139–140 değişmeli.</li>\n</ul>\n<p>Ana harita → <a href=\"#sendika-sistemi\">Sendika Sistemi</a></p>\n"},{"id":"memurlar","cat":"Hukuk ve kamu","th":"red","l1":"Memurlar","l2":"ve sendika","sub":"Kamu çalışanları","lead":"Memurlar da sisteme dahildir. Bugün Türkiye'de memurlar sendika kurup toplu sözleşme yapabiliyor, ama grev yapamıyor. Anlaşma olmazsa Kamu Görevlileri Hakem Kurulu zorunlu olarak karar…","date":"19 Kasım 2026","min":4,"html":"<p>Memurlar da sisteme dahildir. Bugün Türkiye&#39;de memurlar sendika kurup toplu sözleşme yapabiliyor, ama grev yapamıyor. Anlaşma olmazsa Kamu Görevlileri Hakem Kurulu zorunlu olarak karar veriyor. Bu sistemde memurlar da işçilerle aynı kurallara tabidir.</p>\n<h2>Sendika hakkı</h2>\n<p>Özel sektörde olduğu gibi kamuda da <strong>bütün memurlar</strong> sendikaya üye olabilir. Doktorlar, öğretmenler, büro memurları, herkes. Kurallar herkes için aynıdır (bkz. <a href=\"#sendika-hakki\">Sendika Hakkı</a>).</p>\n<h2>Grev hakkı</h2>\n<table>\n<thead>\n<tr>\n<th>Konu</th>\n<th>Karar</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Grev hakkı</strong></td>\n<td>Bütün memurlar grev yapabilir.</td>\n</tr>\n<tr>\n<td><strong>Grev yasağı</strong></td>\n<td>Asker, polis ve jandarma grev yapamaz.</td>\n</tr>\n<tr>\n<td><strong>Hayati kamu hizmetleri</strong></td>\n<td>Grev yapılabilir, ama asgari hizmet sürdürülür. Örneğin hastanede acil servis çalışmaya devam eder (bkz. <a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>).</td>\n</tr>\n<tr>\n<td><strong>Kamu Görevlileri Hakem Kurulu</strong></td>\n<td><strong>Gönüllü</strong> olur: Ancak iki taraf da isterse devreye girer. Taraflar anlaşamazsa memurlar greve gidebilir ya da birlikte hakeme başvurabilir.</td>\n</tr>\n</tbody></table>\n<h2>Sendikanın yapısı ve toplu sözleşme</h2>\n<p>Özel sektördeki sektör, marka ve şube yapısı kamuya uyarlanır. Kamuda bunlara ek olarak bütün memurları kapsayan bir <strong>kamu geneli</strong> seviyesi vardır.</p>\n<table>\n<thead>\n<tr>\n<th>Özel sektör</th>\n<th>Kamudaki karşılığı</th>\n<th>Örnek</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>—</td>\n<td>Kamu geneli</td>\n<td>Bütün memurlar</td>\n</tr>\n<tr>\n<td>Sektör</td>\n<td>Hizmet kolu</td>\n<td>Eğitim, sağlık, yerel yönetimler</td>\n</tr>\n<tr>\n<td>Marka</td>\n<td>Kurum</td>\n<td>Milli Eğitim Bakanlığı, bir belediye</td>\n</tr>\n<tr>\n<td>Şube</td>\n<td>Birim</td>\n<td>Bir okul, bir hastane, bir ilçe müdürlüğü</td>\n</tr>\n</tbody></table>\n<h3>Seviyeler</h3>\n<table>\n<thead>\n<tr>\n<th>Seviye</th>\n<th>Karşı taraf</th>\n<th>Sözleşmenin kapsamı</th>\n<th>Grev ve sözleşme için gereken</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Kamu geneli</strong></td>\n<td>Hükümet</td>\n<td>Bütün memurlar için genel maaş artışı (taban)</td>\n<td>Evet diyen hizmet kollarının kare kök ağırlıklı oranı en az %40</td>\n</tr>\n<tr>\n<td><strong>Hizmet kolu</strong></td>\n<td>Hükümet</td>\n<td>Hizmet koluna özel maaş ve haklar</td>\n<td>Evet diyen kurumların kare kök ağırlıklı oranı en az %40</td>\n</tr>\n<tr>\n<td><strong>Kurum</strong></td>\n<td>Kurum yönetimi</td>\n<td>Kuruma özel ek ödemeler, atama ve yer değiştirme kuralları</td>\n<td>Çifte çoğunluk: birimlerin salt çoğunluğunda temel kural sağlanmalı ve kurumun toplamında temel kural sağlanmalı</td>\n</tr>\n<tr>\n<td><strong>Birim</strong></td>\n<td>Birim amiri (okul müdürü, başhekim)</td>\n<td>Nöbet, vardiya, iş yükü dağılımı, fiziksel çalışma koşulları, iş güvenliği</td>\n<td>Birimde temel kural: oy kullananların çoğunluğu evet ve evetler üyelerin en az %40&#39;ı</td>\n</tr>\n</tbody></table>\n<p>Birim sözleşmesi <strong>sadece birimin kendi yetkisindeki konuları</strong> kapsar. Örneğin maaş, okul müdürünün yetkisinde olmadığı için birim düzeyinde pazarlığa açılmaz.</p>\n<p>Kare kök ağırlıklı oranın formülü ve oylama kuralları <a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a> notundaki sektör grevi formülüyle aynıdır. Hizmet kolu seviyesinde markaların yerine kurumlar, kamu geneli seviyesinde ise hizmet kolları kullanılır.</p>\n<h3>Özel sektörden aynen uygulanan kurallar</h3>\n<ul>\n<li>Her seviyenin kendi <strong>zam kurulu</strong> vardır.</li>\n<li><strong>Katmanlı sözleşme:</strong> Üst seviye taban oluşturur, alt seviye sadece üstüne ekleme yapabilir.</li>\n<li>Hizmet kolu ve kamu geneli grevlerine <strong>sadece evet diyen</strong> kurumlar ve hizmet kolları katılır. Sözleşme de sadece onları bağlar.</li>\n<li><strong>Gizli oy</strong> ve <strong>küçük birimlerin birleşmesi</strong> kuralları geçerlidir.</li>\n</ul>\n<h3>Kamu geneli grevine katılmayanların tabanı</h3>\n<p>Kamu geneli sözleşmesi bütün memurların tabanıdır, ama sadece talebe evet diyen hizmet kollarını bağlar. Talebe katılmayan hizmet kolları için <strong>bir önceki genel sözleşme, enflasyon oranında güncellenerek</strong> taban olarak devam eder. Böylece kimsenin maaşı enflasyonun gerisinde kalmaz, ama ek kazanımı sadece talebe evet diyenler alır.</p>\n<h2>Finansman</h2>\n<p><a href=\"#finansman\">Finansman</a> ve <a href=\"#grev-fonu\">Grev Fonu</a> notlarındaki bütün kurallar memurlara da <strong>aynen</strong> uygulanır: sabit aidat, aidat ödemeyenlere yaptırımlar, kazanım payı, giriş katkısı, grev yardımı ve grev fonu hedefi. Kazanım payı hesabında seviyeler kamu geneli, hizmet kolu, kurum ve birim olarak sıralanır.</p>\n<h2>Memurların korunması</h2>\n<p>Memurlar zaten iş güvencesine sahip ve kolayca işten çıkarılamıyor. Sendikalı memurlara karşı kullanılan yöntem genellikle <strong>sürgün</strong>, yani memurun istemediği bir yere atanmasıdır.</p>\n<table>\n<thead>\n<tr>\n<th>Koruma</th>\n<th>Nasıl işler</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Sürgün yasağı</strong></td>\n<td>Sendikal nedenle memurun istemediği bir yere atanması yasaktır.</td>\n</tr>\n<tr>\n<td><strong>İspat yükü kurumda</strong></td>\n<td>Sendikalı bir memur istemediği bir yere atanırsa, sebebin sendika olmadığını kurum kanıtlar.</td>\n</tr>\n<tr>\n<td><strong>Şikâyet yolu</strong></td>\n<td>Sürgün şikâyetlerine <a href=\"#iscinin-korunmasi\">Sendikal Koruma Kurulu</a> bakar. Kurul 15 gün içinde karar verir, itiraz kararı durdurmaz ve 30 günde sonuçlanır.</td>\n</tr>\n<tr>\n<td><strong>Grev kırıcılığı yasağı</strong></td>\n<td>Devlet grevdeki memurların yerine geçici personel alamaz ve aynı kurumun <strong>diğer birimlerinden personel getiremez.</strong> Örneğin grevdeki bir okula başka okullardan öğretmen gönderilemez (bkz. <a href=\"#iscinin-korunmasi\">İşçinin Korunması</a>).</td>\n</tr>\n</tbody></table>\n<h2>Bağlantılı bölümler</h2>\n<ul>\n<li><a href=\"#sendika-hakki\">Sendika Hakkı</a>: Herkese tanınan sendika hakkı</li>\n<li><a href=\"#olcum-kurulu\">Ölçüm Kurulu</a>: Kamu hizmet kollarını da ölçer.</li>\n<li><a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>: Grev kararı ve asgari hizmet kuralları memurlar için de geçerlidir.</li>\n<li><a href=\"#iscinin-korunmasi\">İşçinin Korunması</a>: Grev kırıcılığı yasağı memurlara da uygulanır.</li>\n<li><a href=\"#gereken-anayasa-degisiklikleri\">Gereken Anayasa Değişiklikleri</a>: Memurlara grev hakkı için Anayasa md. 54, gönüllü hakemlik için md. 53 değişmeli.</li>\n</ul>\n<p>Ana harita → <a href=\"#sendika-sistemi\">Sendika Sistemi</a></p>\n"},{"id":"gereken-anayasa-degisiklikleri","cat":"Hukuk ve kamu","th":"red","l1":"Gereken Anayasa","l2":"değişiklikleri","sub":"Maddeler, kanunlar, antlaşmalar","lead":"Sistemin uygulanabilmesi için Anayasa'da, kanunlarda ve uluslararası yükümlülüklerde yapılması gereken değişiklikler.","date":"19 Kasım 2026","min":9,"html":"<p>Sistemin uygulanabilmesi için Anayasa&#39;da, kanunlarda ve uluslararası yükümlülüklerde yapılması gereken değişiklikler.</p>\n<blockquote class=\"callout warning\"><p class=\"ct\">Not</p><p>Madde numaraları ve içerikleri genel hatlarıyla verilmiştir. Kesin metin hazırlanmadan önce Anayasa&#39;nın, kanunların ve antlaşmaların güncel halleri bir anayasa hukukçusuyla birlikte kontrol edilmelidir.</p>\n</blockquote>\n<h2>Anayasa değişikliği nasıl yapılır? (md. 175)</h2>\n<table>\n<thead>\n<tr>\n<th>Meclis&#39;te kabul oyu</th>\n<th>Sonuç</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>360&#39;tan az (üye tamsayısının 3/5&#39;inden az)</td>\n<td>Değişiklik kabul edilmez.</td>\n</tr>\n<tr>\n<td>360–399 arası</td>\n<td>Değişiklik halkoyuna (referanduma) sunulur.</td>\n</tr>\n<tr>\n<td>400 ve üstü (2/3)</td>\n<td>Değişiklik doğrudan kabul edilir. Cumhurbaşkanı yine de halkoyuna sunabilir.</td>\n</tr>\n</tbody></table>\n<h2>1. Anayasa değişiklikleri</h2>\n<table>\n<thead>\n<tr>\n<th>Madde</th>\n<th>Şu anki durum</th>\n<th>Gereken değişiklik</th>\n<th>İlgili bölüm</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>md. 90</strong> (uluslararası antlaşmalar)</td>\n<td>Temel haklara ilişkin uluslararası antlaşmalar, kanunlarla çatışırsa antlaşmalar esas alınır.</td>\n<td>Her sektörde tek sendika ve kanunla belirlenen iç yönetim kuralları ILO 87 ile çatıştığı için mahkemeler bu kanun hükümlerini uygulamayabilir. Ya bu iki konu için istisna tanınır, ya da aşağıdaki antlaşma sorunları çözülür. md. 90&#39;ı değiştirmek bütün temel hakları etkileyeceği için ikinci yol daha uygundur.</td>\n<td><a href=\"#sendika-hakki\">Sendika Hakkı</a>, <a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a></td>\n</tr>\n<tr>\n<td><strong>md. 53</strong> (toplu sözleşme hakkı)</td>\n<td>Memurların toplu sözleşme hakkını düzenler. Anlaşma olmazsa Kamu Görevlileri Hakem Kurulu&#39;nun kararının kesin olduğunu söyler.</td>\n<td>Hakem Kurulu&#39;nun ancak iki taraf da isterse devreye gireceği yazılır.</td>\n<td><a href=\"#memurlar\">Memurlar</a></td>\n</tr>\n<tr>\n<td><strong>md. 54</strong> (grev hakkı)</td>\n<td>Grev hakkını sadece <strong>işçilere</strong> tanır. Grevin kanunla ertelenmesine izin verir.</td>\n<td>Grev hakkı memurları da kapsayacak şekilde genişletilir. Asker, polis ve jandarma için yasak açıkça yazılır. Erteleme yetkisi kanun değişikliğiyle de kaldırılabilir, ama ileride geri getirilmesini önlemek için erteleme yasağı ve asgari hizmet kuralı da buraya yazılabilir.</td>\n<td><a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>, <a href=\"#memurlar\">Memurlar</a></td>\n</tr>\n<tr>\n<td><strong>Yeni madde</strong> (bağımsız çalışma hayatı kurulları)</td>\n<td>Böyle bir madde yok.</td>\n<td>Kurulların bağımsızlığı, başkan ve uzman üyelerin karşılıklı eleme yöntemiyle seçilmesi, görev güvencesi ve kurulların fonunun hükümet tarafından kısılamaması Anayasa&#39;ya yazılır. Ayrıntılar kanunda kalır.</td>\n<td><a href=\"#kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a></td>\n</tr>\n<tr>\n<td><strong>md. 159</strong> (Hâkimler ve Savcılar Kurulu)</td>\n<td>HSK üyelerinin çoğunluğunu Cumhurbaşkanı ve Meclis belirler. Adalet Bakanı kurulun başkanıdır.</td>\n<td>Üyelerin çoğunluğunu hâkimler kendi aralarında seçer. Bakanın kuruldaki yeri kaldırılır. Hâkimler ve savcılar için ayrı kurullar kurulur.</td>\n<td><a href=\"#yargi-bagimsizligi\">Yargı Bağımsızlığı</a></td>\n</tr>\n<tr>\n<td><strong>md. 139–140</strong> (hâkimlik teminatı)</td>\n<td>Hâkimlik güvencesi var, ama atama ve yer değiştirme HSK&#39;ya bağlı.</td>\n<td>Hâkimlerin verdikleri kararlar yüzünden yer değiştirilemeyeceği ve disiplin cezası alamayacağı açıkça yazılır. Atama ve terfinin açık kriterlere bağlanması güvence altına alınır.</td>\n<td><a href=\"#yargi-bagimsizligi\">Yargı Bağımsızlığı</a></td>\n</tr>\n<tr>\n<td><strong>md. 20</strong> (özel hayatın gizliliği)</td>\n<td>Kişisel verilerin ancak kanunla öngörülen hallerde işlenebileceğini söyler.</td>\n<td>Anayasa değişikliği gerekmeyebilir. Banka hareketlerinin izlenmesi için açık ve sınırları belli bir kanun çıkarılması yeterli olabilir.</td>\n<td><a href=\"#kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a></td>\n</tr>\n</tbody></table>\n<p><strong>Değişiklik gerektirmeyenler:</strong></p>\n<ul>\n<li><strong>md. 51 (sendika kurma hakkı):</strong> Sendika hakkı herkese tanındığı için değişiklik gerekmez (<a href=\"#sendika-hakki\">Sendika Hakkı</a>).</li>\n<li><strong>md. 35 (mülkiyet):</strong> Geçiş kuralı paraya el koymuyor, paranın işçilerde kalmasını sağlıyor. Değişiklik gerekmez (<a href=\"#grev-fonu\">Grev Fonu</a>).</li>\n<li><strong>md. 36 (hak arama) ve md. 125 (yargı yolu):</strong> İtiraz hakkı korunduğu için değişiklik gerekmez (<a href=\"#olcum-kurulu\">Ölçüm Kurulu</a>).</li>\n</ul>\n<h2>2. Uluslararası yükümlülükler</h2>\n<p>Sendika hakkı herkese tanındığı için sistemin uluslararası sözleşmelerle en büyük çatışması ortadan kalktı. Kalan çatışmalar, bilerek tercih edilen iki konudan kaynaklanıyor: her sektörde tek sendika ve sendika iç yönetiminin kanunla belirlenmesi.</p>\n<table>\n<thead>\n<tr>\n<th>Antlaşma</th>\n<th>Sorun</th>\n<th>Seçenekler</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>ILO 87 sayılı Sözleşme</strong> (sendika özgürlüğü)</td>\n<td>İşçilere &quot;kendi seçtikleri&quot; sendikaya üye olma (md. 2) ve sendikaların tüzüklerini ve yönetimlerini devlet müdahalesi olmadan belirleme (md. 3) hakkı tanır.</td>\n<td>Çatışmayı kabul etmek ya da sözleşmeden çekilmek. ILO sözleşmelerinden ancak belirli zaman aralıklarında, yaklaşık her 10 yılda bir açılan kısa bir süre içinde çekilinebilir.</td>\n</tr>\n<tr>\n<td><strong>Avrupa İnsan Hakları Sözleşmesi md. 11</strong></td>\n<td>Sendika özgürlüğünü korur. Sendikaların iç işlerine yapılan müdahaleler, ancak &quot;demokratik bir toplumda gerekli&quot; olduğu ölçüde kabul edilir.</td>\n<td>Avrupa İnsan Hakları Mahkemesi&#39;nde ihlal kararlarıyla karşılaşma riskinin kabul edilmesi.</td>\n</tr>\n<tr>\n<td><strong>Avrupa Sosyal Şartı md. 5 ve 6</strong></td>\n<td>Örgütlenme ve toplu pazarlık hakkını düzenler. Türkiye&#39;nin hangi hükümleri kabul ettiğine göre sorun çıkarabilir.</td>\n<td>Türkiye&#39;nin kabul ettiği hükümler kontrol edilmeli.</td>\n</tr>\n</tbody></table>\n<blockquote class=\"callout question\"><p class=\"ct\">Açık konu</p><p>Bu antlaşmalardan çekilmenin Türkiye&#39;nin dış ilişkilerine ve diğer haklara etkileri ayrıca değerlendirilmeli.</p>\n</blockquote>\n<h3>Kararlarımızın uluslararası yükümlülüklerle karşılaştırması</h3>\n<h4>🔴 Doğrudan çatışan kararlar</h4>\n<table>\n<thead>\n<tr>\n<th>Kararımız</th>\n<th>Hangi madde</th>\n<th>Neden çatışıyor</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Her sektörde tek sendika (<a href=\"#sendika-hakki\">Sendika Hakkı</a>, <a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>)</td>\n<td>ILO 87 md. 2</td>\n<td>İşçiler &quot;kendi seçtikleri&quot; sendikaya üye olma hakkına sahiptir. Kanunla tek sendika zorunluluğu getirmek, ILO&#39;nun açıkça eleştirdiği bir uygulamadır. <strong>Sistemin görüşü:</strong> Sendika şube şube ayrılabilen parçalı bir yapı olduğu ve karar gücü işyerlerine dağıldığı için ortada gerçek bir tekel yoktur, sadece ad olarak tek sendika vardır.</td>\n</tr>\n<tr>\n<td>Sendika iç yönetiminin kanunla zorunlu kılınması: yönetimin yıllık yarı yenilenmesi, zam kurulu, seçim kuralları, aidat ödemeyen kuralları (<a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>, <a href=\"#finansman\">Finansman</a>)</td>\n<td>ILO 87 md. 3</td>\n<td>Sendikalar tüzüklerini ve yönetimlerini serbestçe belirler, devlet karışamaz. Örnek tüzük seçeneği değerlendirildi, ama sistemin her sendikada aynı işlemesi ve gelecekte yönetime gelenlerin kuralları keyfi olarak değiştirememesi için kanunla zorunlu kılınmasına <strong>bilerek</strong> karar verildi.</td>\n</tr>\n<tr>\n<td>Kazanım payı ve giriş katkısı oranlarının kanunla zorunlu kılınması (<a href=\"#finansman\">Finansman</a>)</td>\n<td>ILO 87 md. 3</td>\n<td>Sendikanın mali işlerine devlet müdahalesi sayılır. Aynı gerekçeyle kanunla zorunlu kılınmasına karar verildi.</td>\n</tr>\n</tbody></table>\n<h4>🟡 Riskli kararlar</h4>\n<table>\n<thead>\n<tr>\n<th>Kararımız</th>\n<th>Hangi madde</th>\n<th>Risk</th>\n<th>Nasıl azaltılır</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Banka hareketlerinin izlenmesi (<a href=\"#kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a>)</td>\n<td>AİHS md. 8 (özel hayat)</td>\n<td>Geniş çaplı izleme, mahkemenin en sıkı denetlediği konulardan biridir.</td>\n<td>Bağımsız Veri Denetçisi eklendi: erişim kayıtlarının denetimi, yıllık şeffaflık raporu ve incelenen kişiye bilgi verilmesi. Risk azaldı, ama izlemenin genişliği nedeniyle tamamen ortadan kalkmadı.</td>\n</tr>\n</tbody></table>\n<h4>🟢 Uyumlu kararlar</h4>\n<table>\n<thead>\n<tr>\n<th>Kararımız</th>\n<th>Neden uyumlu</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Sendika hakkının her meslekte ve her sektörde herkese tanınması (<a href=\"#sendika-hakki\">Sendika Hakkı</a>)</td>\n<td>ILO 87, AİHS md. 11 ve BM sözleşmeleri sendika hakkını ayrım gözetmeksizin herkese tanır. Önceki taslaktaki yerine konabilirlik ölçütü bu sözleşmelerle doğrudan çatışıyordu, kaldırıldı.</td>\n</tr>\n<tr>\n<td>Grev erteleme yetkisinin kaldırılması (<a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>)</td>\n<td>ILO, Türkiye&#39;nin grev ertelemelerini yıllardır eleştiriyor.</td>\n</tr>\n<tr>\n<td>Hayati hizmetlerde asgari hizmet (<a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>)</td>\n<td>ILO&#39;nun önerdiği yöntemle aynı.</td>\n</tr>\n<tr>\n<td>Grev oylamasında evet oyu şartı: oy kullananların çoğunluğu ve tüm üyelerin en az %40&#39;ı (<a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>)</td>\n<td>Başlangıçta riskliydi: Tüm üyelerin salt çoğunluğu şartı aşırı yüksek bulunabilirdi. Eşik düşürülerek ve oy kullanmamanın grevi engellemeye yaramadığı bir yapı kurularak risk azaltıldı. ILO makul eşikleri kabul ediyor.</td>\n</tr>\n<tr>\n<td>Memurlara grev hakkı, silahlı güvenlik görevlileri hariç (<a href=\"#memurlar\">Memurlar</a>)</td>\n<td>ILO&#39;nun memurların grev yasağına yönelik eleştirileriyle ve Avrupa İnsan Hakları Mahkemesi&#39;nin <em>Enerji Yapı-Yol Sen - Türkiye</em> (2009) kararıyla uyumlu.</td>\n</tr>\n<tr>\n<td>İşçinin korunmasıyla ilgili kurallar (<a href=\"#iscinin-korunmasi\">İşçinin Korunması</a>)</td>\n<td>ILO 98, sendika üyelerinin ayrımcılığa karşı etkili korunmasını ister. Kararlarımız bu standardın ötesine geçer.</td>\n</tr>\n<tr>\n<td>Yargı bağımsızlığı reformları (<a href=\"#yargi-bagimsizligi\">Yargı Bağımsızlığı</a>)</td>\n<td>Venedik Komisyonu ve Avrupa Konseyi&#39;nin önerileriyle aynı.</td>\n</tr>\n<tr>\n<td>Geçiş kuralı (<a href=\"#grev-fonu\">Grev Fonu</a>)</td>\n<td>Para işçilere geri döndüğü için mülkiyet hakkına (AİHS Ek 1 No&#39;lu Protokol md. 1) uygun.</td>\n</tr>\n<tr>\n<td>Durdurmayan itiraz ve mahkeme denetimi (<a href=\"#olcum-kurulu\">Ölçüm Kurulu</a>, <a href=\"#kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a>, <a href=\"#iscinin-korunmasi\">İşçinin Korunması</a>)</td>\n<td>Cezalara karşı mahkeme yolu açık olduğu için AİHS md. 6&#39;ya (adil yargılanma) uygun.</td>\n</tr>\n</tbody></table>\n<p><strong>Özet:</strong> Sendika hakkı herkese tanındığı için en büyük çatışma ortadan kalktı. Kalan iki çatışma, yani tek sendika ve kanunla belirlenen iç yönetim, bilinçli tercihlerdir. Kararların büyük çoğunluğu uluslararası standartlarla uyumludur.</p>\n<h2>3. Kanun değişiklikleri</h2>\n<p>Anayasa değişikliği gerektirmeyen, ama sistem için çıkarılması ya da değiştirilmesi gereken kanunlar:</p>\n<table>\n<thead>\n<tr>\n<th>Kanun</th>\n<th>Gereken değişiklik</th>\n<th>İlgili bölüm</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu</strong></td>\n<td>Ölçüm Kurulu; her sektörde tek sendika ve sendikanın marka ve şube olarak bölünmesi; şube, marka (çifte çoğunluk) ve sektör (kare kök ağırlıklı %40) düzeyinde grev, toplu sözleşme ve zam talebi oylamaları; evet oyu şartı (oy kullananların çoğunluğu ve üyelerin en az %40&#39;ı); her seviyenin ayrı yönetimi; Ölçüm Kurulu temsilcilerinin seçimi; grev yardımından kimlerin yararlanacağı; katmanlı toplu sözleşme; sektör sözleşmesinin sadece talebe evet diyen markaları bağlaması; gizli oy, küçük şubelerin birleşmesi, franchise şubeler ve şirket gruplarına ilişkin kurallar; grev ertelemesinin kaldırılması (md. 63); asgari hizmet; grev kırıcılığı cezası ve grevde diğer şubelerden personel transferi yasağı; zorunlu işe iade; sendika iç yönetimine ilişkin kuralların (yönetimin yıllık yarı yenilenmesi, zam kurulu, aidat ödemeyenlere yaptırımlar) bütün sendikalar için zorunlu kılınması; delege sisteminin kaldırılması ve doğrudan seçim; nispi temsil; geri çağırma; görev süresi sınırı; kimlik ile oy kaydını ayıran gizli elektronik oylama; sendika denetimi; kazanım payı ve giriş katkısının oranlarıyla birlikte aidat olarak tanımlanması; geçiş kuralı (sektördeki mevcut sendikaların parasının yeni sektör sendikasına geçmesi)</td>\n<td><a href=\"#sendika-hakki\">Sendika Hakkı</a>, <a href=\"#olcum-kurulu\">Ölçüm Kurulu</a>, <a href=\"#grev-ve-yonetim\">Grev ve Yönetim</a>, <a href=\"#iscinin-korunmasi\">İşçinin Korunması</a>, <a href=\"#finansman\">Finansman</a>, <a href=\"#grev-fonu\">Grev Fonu</a></td>\n</tr>\n<tr>\n<td><strong>4688 sayılı Kamu Görevlileri Sendikaları ve Toplu Sözleşme Kanunu</strong></td>\n<td>Kamu geneli, hizmet kolu, kurum ve birim olarak dört seviyeli sendika ve toplu sözleşme yapısı; birim sözleşmesinin birimin yetkisindeki konularla sınırlanması; kamu geneli grevine katılmayanlar için enflasyonla güncellenen taban; memurların grev hakkı; gönüllü hakemlik; grevde geçici personel alınması ve diğer birimlerden personel getirilmesi yasağı</td>\n<td><a href=\"#memurlar\">Memurlar</a></td>\n</tr>\n<tr>\n<td><strong>657 sayılı Devlet Memurları Kanunu</strong></td>\n<td>Sendikal nedenle sürgün yasağı; ispat yükünün kurumda olması; sürgün şikâyetlerine Sendikal Koruma Kurulu&#39;nun bakması; grev nedeniyle disiplin cezası verilememesi</td>\n<td><a href=\"#memurlar\">Memurlar</a></td>\n</tr>\n<tr>\n<td><strong>4857 sayılı İş Kanunu</strong></td>\n<td>Sendikal nedenle çıkarmada ispat yükünün işverene geçmesi; örgütlenme döneminde (işyerinde ilk sendika üyeliğinin kaydından itibaren) işten çıkarma için Sendikal Koruma Kurulu&#39;nun kurulması ve 15 gün içinde onay vermesi; tazminatla işe iadeden kurtulma seçeneğinin kaldırılması</td>\n<td><a href=\"#iscinin-korunmasi\">İşçinin Korunması</a></td>\n</tr>\n<tr>\n<td><strong>5510 sayılı Sosyal Sigortalar Kanunu ve 5549 sayılı MASAK Kanunu</strong></td>\n<td>Banka hareketleriyle SGK kayıtlarının eşleştirilmesi; Kayıt Dışılık Kurulu&#39;nun kurulması ve yetkileri; Bağımsız Veri Denetçisi&#39;nin kurulması ve yetkileri</td>\n<td><a href=\"#kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a></td>\n</tr>\n<tr>\n<td><strong>6698 sayılı Kişisel Verilerin Korunması Kanunu (KVKK)</strong></td>\n<td>Banka verilerinin kayıt dışılık tespiti için işlenmesine açık ve sınırlı bir yasal dayanak</td>\n<td><a href=\"#kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a></td>\n</tr>\n<tr>\n<td><strong>Bağımsız çalışma hayatı kurulları kanunu (yeni)</strong></td>\n<td>Ölçüm Kurulu, Kayıt Dışılık Kurulu, Sendikal Koruma Kurulu ve Bağımsız Veri Denetçisi&#39;nin kuruluşu; karşılıklı eleme yöntemi ve aday şartları; 4 yıllık yenilenemez görev süresi; ortak fon, SGK prim payı ve Hazine taban güvencesi; cezaların İşsizlik Sigortası Fonu&#39;na aktarılması; Sayıştay denetimi; kurulların kendi personeli; sendika denetçilerinin kurayla atanması</td>\n<td><a href=\"#kurullarin-finansmani-ve-secimi\">Kurulların Finansmanı ve Seçimi</a></td>\n</tr>\n<tr>\n<td><strong>İş mahkemeleriyle ilgili kanunlar</strong></td>\n<td>Kurul kararlarına yapılan itirazların 30 günde sonuçlanması ve itirazın kararı durdurmaması</td>\n<td><a href=\"#yargi-bagimsizligi\">Yargı Bağımsızlığı</a>, <a href=\"#olcum-kurulu\">Ölçüm Kurulu</a></td>\n</tr>\n<tr>\n<td><strong>Ücretlerin ödenmesiyle ilgili düzenlemeler</strong></td>\n<td>Ücretlerin nakit ödenmesine üst sınır</td>\n<td><a href=\"#kayit-disilikla-mucadele\">Kayıt Dışılıkla Mücadele</a></td>\n</tr>\n</tbody></table>\n<h2>Temel ilke</h2>\n<blockquote class=\"callout important\"><p class=\"ct\">Not</p><p>Ne olursa olsun, hangi engel olursa olsun, kendi işçimizden ve memurumuzdan önemlisi yoktur. Dolayısıyla işçiyi önemsiyorsak bu tarz engeller önemli olmamalıdır.</p>\n</blockquote>\n<p>Ana harita → <a href=\"#sendika-sistemi\">Sendika Sistemi</a></p>\n"}];
var app=document.getElementById('app'),filter='Hepsi';
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function md(a){return a.map(function(b){if(b.indexOf('## ')==0)return'<h3>'+esc(b.slice(3))+'</h3>';if(b.indexOf('> ')==0)return'<blockquote>'+esc(b.slice(2))+'</blockquote>';return'<p>'+esc(b)+'</p>'}).join('')}
function ttl(p){return'<h1 class="title" style="--th:'+C[p.th]+'"><span class="l1">'+esc(p.l1)+'</span><span class="l2">'+esc(p.l2)+'</span></h1>'}
function ttl2(p){return'<h3 class="title" style="--th:'+C[p.th]+'"><span class="l1">'+esc(p.l1)+'</span><span class="l2">'+esc(p.l2)+'</span></h3>'}
function home(){
  if(!POSTS.length){app.innerHTML='<div class="post" style="--th:var(--gold);text-align:center;padding:60px 0"><span class="cat">Yakında</span><h1 class="title" style="margin-top:20px"><span class="l1">İlk yazı</span><span class="l2">yolda</span></h1></div>';return}
  var h=POSTS[0],cats=['Hepsi'].concat(POSTS.map(function(p){return p.cat}).filter(function(t,i,a){return a.indexOf(t)==i}));
  var rest=POSTS.slice(1).filter(function(p){return filter=='Hepsi'||p.cat==filter});
  app.innerHTML='<a class="hero" href="#'+h.id+'" style="--th:'+C[h.th]+'"><span class="cat">'+h.cat+'</span>'+ttl(h)+'<p>'+esc(h.lead)+'</p><span class="meta">'+h.sub+' · '+h.date+' · '+h.min+' dk</span>'
   +'<svg class="spark" viewBox="0 0 600 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10 L60 14 L120 22 L180 20 L240 36 L300 44 L360 52 L420 50 L480 70 L540 76 L600 84"/></svg></a>'
   +'<h2 class="sec">Yazılar</h2><div class="tags" role="group" aria-label="Konu">'+cats.map(function(t){return'<button aria-pressed="'+(t==filter)+'" data-t="'+t+'">'+t+'</button>'}).join('')+'</div>'
   +'<div class="cards" style="margin-top:16px">'+rest.map(function(p){return'<a class="card" href="#'+p.id+'" style="--th:'+C[p.th]+'"><span class="cat" style="align-self:flex-start">'+p.cat+'</span>'+ttl2(p)+'<p>'+esc(p.lead)+'</p><span class="meta">'+p.date+' · '+p.min+' dk</span></a>'}).join('')+'</div>'
   +'<div class="bar"><span class="meta">Videolar ve canlı yayınlar için</span><div class="links"><a href="#yazilar">YouTube</a><a href="#yazilar">Kick</a></div></div>';
  app.querySelectorAll('.tags button').forEach(function(b){b.onclick=function(){filter=b.dataset.t;home()}});
}
function post(p){
  app.innerHTML='<div class="pw" style="--th:'+C[p.th]+'"><nav class="toc" id="toc" aria-label="İçindekiler"></nav><div class="post"><a class="back" href="#yazilar">← Yazılar</a><span class="cat">'+p.cat+'</span>'+ttl(p)+'<p class="lead">'+p.sub+' · '+p.date+' · '+p.min+' dk okuma</p><div class="rule"></div><div class="prose" id="prose">'+(p.html||md(p.body))+'</div></div></div>';
  buildToc();
}

function buildToc(){
  var pr=document.getElementById('prose'),toc=document.getElementById('toc');if(!pr||!toc)return;
  var hs=[].slice.call(pr.querySelectorAll('h2,h3,h4'));
  if(hs.length<2){toc.remove();document.querySelector('.pw').style.display='block';return}
  var top=Math.min.apply(0,hs.map(function(h){return +h.tagName[1]})),html='',stack=[],links=[];
  hs.forEach(function(h,i){
    h.id='b'+(i+1);var lv=+h.tagName[1]-top;
    while(stack.length>lv+1){html+='</li></ul>';stack.pop()}
    if(stack.length==lv+1){html+='</li>'}
    while(stack.length<lv+1){html+='<ul>';stack.push(1)}
    html+='<li><a href="#" data-i="'+h.id+'">'+esc(h.textContent)+'</a>';
  });
  while(stack.length){html+='</li></ul>';stack.pop()}
  toc.innerHTML='<div class="toc-h"><b>İçindekiler</b><button type="button" id="tg">gizle</button></div>'+html;
  document.getElementById('tg').onclick=function(){var off=toc.classList.toggle('off');this.textContent=off?'göster':'gizle'};
  links=[].slice.call(toc.querySelectorAll('a'));
  links.forEach(function(a){a.onclick=function(e){e.preventDefault();var t=document.getElementById(a.dataset.i);t.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}});
  function act(){var cur=hs[0].id;hs.forEach(function(h){if(h.getBoundingClientRect().top<=80)cur=h.id});links.forEach(function(a){a.classList.toggle('on',a.dataset.i==cur)})}
  window.removeEventListener('scroll',window._tocAct);window._tocAct=act;window.addEventListener('scroll',act,{passive:true});act();
}
function about(){
  app.innerHTML='<div class="post" style="--th:var(--gold)"><span class="cat">Hakkında</span><h1 class="title"><span class="l1">Ben</span><span class="l2">Ulmocus</span></h1><div class="rule" style="margin-top:20px"></div><div class="prose"><p>Çok yakında.</p></div></div>';
}
function route(){
  var h=location.hash.slice(1)||'yazilar';window.scrollTo(0,0);
  if(h=='yazilar')return home();if(h=='hakkinda')return about();
  var p=POSTS.filter(function(x){return x.id==h})[0];p?post(p):home();
}
window.addEventListener('hashchange',route);route();
</script>
